# Link checking for the documentation set.
#
# ⚠ THE PR GATE RUNS `--offline` (see the Makefile and ci.yml). That is not a limitation being
# worked around, it is the design: checking external URLs on every pull request imports the
# whole internet's link rot into this repo's CI, and a gate that goes red for reasons no
# contributor can fix is a gate people learn to ignore.
#
# Relative links are the class that has actually broken here, twice:
#   - docs/frontend-design.md pointed at `loomarr-design.md` for months after the rename
#   - docs/engineering/phase-0-findings.md linked a FINDINGS file that never existed
# Both were invisible to every other check in the repo, and both are exactly what --offline
# catches.

# Directories that are not ours to police.
exclude_path = [
  "node_modules",
  "web/node_modules",
  "docs-site/node_modules",
  "docs-site/dist",
  "internal/web/dist",
  ".agents/skills",   # vendored third-party skills, pinned by hash — not our prose
  # ⚠ NOT the whole design/ directory. Its *.md deltas carry real links into docs/ — one of
  # them broke in the archive move and was caught here — so the Makefile feeds `design/*.md`
  # as an input and only the design-tool artifacts are skipped. Excluding the directory
  # instead silently produced "No files found for this input source", which reads as
  # "nothing to check" rather than "you excluded it".
  "design/support.js",
  "design/image-slot.js",
  "design/composites-data.js",
]

exclude = [
  # (No bare-slug exclusion any more. The in-app help pages used to link each other as
  # `[Filler guide](filler)`, which lychee could not check. Since #1572 they use real relative
  # `.md` links, which the app (parseDocHref), the site (remark-md-links) and GitHub all
  # resolve, so every one of them is checked here.)

  # Hosts that reject or rate-limit automated requests. Only consulted on a non-offline run.
  # Requires a signed-in session; always 403s a bot.
  "^https://www\\.themoviedb\\.org/settings/api",
  # Local and example addresses that appear throughout the install docs by design.
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://192\\.168\\.",
  "^https?://<host>",
  "^https?://emby:",
  "^https?://tunarr:",
  "^https?://ollama:",

  # GitHub line anchors (`file.md#L12-L34`) exist only in GitHub's blob view; no markdown
  # renderer, lychee included, can resolve them from the file.
  '#L[0-9]+(-L[0-9]+)?$',
]

# Fragment checking is ON. `docs/embed_test.go` proves the in-app help anchors against the
# frontend's own slug transform, but nothing covered the design and engineering docs: when
# #779 turned this on, two links into design.md sections had already died unnoticed (the
# sections were renamed or retired), and moving design.md into docs/design/ would break every
# anchored link to it at once.
include_fragments = "anchor-only"

max_concurrency = 8
no_progress = true
