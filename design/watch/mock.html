<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watching Loomarr: The Cross</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0C0E;--surface:#131519;--surface2:#1B1E24;--line:#2A2E37;--muted:#8B93A3;--text:#E7EAF0;--white:#fff;
--amber:#FFB020;--red:#E5484D;--cyan:#4CC9E8;--ink:11,12,14;
/* The decades' own colours: soft tints that reuse none of the system's accents, so a channel's
   decade is never mistaken for live, a link, a warning or focus. New tokens; see the README. */
--decade-50s:#E6CFA8;--decade-60s:#F0A8B8;--decade-70s:#C9E08A;--decade-80s:#B9A6F2;--decade-90s:#9DB4F5;--decade-00s:#8FD3C8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:#0B0C0E}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- one screen ---------- */
.screen{position:relative;overflow:hidden;background:#000}
.abs{position:absolute}
.pic{position:absolute;background:#000 url(picture.webp) center/cover no-repeat}
.bright .pic{filter:brightness(2.4) saturate(.55) contrast(.8)}
.dip{position:absolute;inset:0;background:rgba(var(--ink),.5)}
.scrimB{position:absolute;inset:0;background:linear-gradient(0deg,rgba(var(--ink),.96) 0,rgba(var(--ink),.78) 26%,rgba(var(--ink),0) 56%)}
.scrimB.low{background:linear-gradient(0deg,rgba(var(--ink),.94) 0,rgba(var(--ink),.7) 22%,rgba(var(--ink),0) 44%)}
.scrimL{position:absolute;inset:0;background:linear-gradient(90deg,rgba(var(--ink),.96) 0,rgba(var(--ink),.92) 50%,rgba(var(--ink),0) 70%)}
.scrimAll{position:absolute;inset:0;background:rgba(var(--ink),.72)}
.cover{position:absolute;inset:0;background:rgba(var(--ink),.9);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:0 32px}
.cover h2{font-size:20px;font-weight:600;color:var(--white)}
.cover p{font-size:14px;color:var(--muted);max-width:340px;line-height:1.5}
.cover .btn{margin-top:14px;height:40px;padding:0 18px;border-radius:8px;border:1px solid #666970;display:inline-flex;align-items:center;font-size:14px;font-weight:500}
/* the lower third: the crossing */
.third{position:absolute;display:grid;align-items:center}
.third .n{line-height:1;font-weight:500;text-align:right;letter-spacing:-.02em;color:var(--white)}
.third h1{line-height:1.12;font-weight:600;color:var(--white);letter-spacing:-.01em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.third .meta{color:var(--muted);white-space:nowrap}
.third .meta em{font-style:normal;color:var(--text)}
.third .next{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.third .next b{font-weight:500;color:var(--text)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle;position:relative;top:-1px}
.golive{display:inline-flex;align-items:center;margin-left:12px;padding:3px 10px;border:1px solid var(--red);border-radius:6px;color:#E85A5F;font-weight:500}
.back{color:var(--cyan)}
.caret{display:inline-block;width:.5em;height:.08em;background:currentColor;margin-left:.06em}
.bars{position:absolute;height:3px;background:linear-gradient(90deg,#FFB020 0 14.3%,#F5D90A 0 28.6%,#3DD68C 0 42.9%,#4CC9E8 0 57.2%,#D6409F 0 71.5%,#E5484D 0 85.8%,#8B93A3 0)}
.bars.wait{background:linear-gradient(90deg,#8B93A3 0 14.3%,#5A6170 0 28.6%,#8B93A3 0 42.9%,#5A6170 0 57.2%,#8B93A3 0 71.5%,#5A6170 0 85.8%,#8B93A3 0)}
/* the vertical arm: channels */
.tabs{position:absolute;display:flex;align-items:center;color:var(--muted);white-space:nowrap}
.tab{position:relative;display:inline-flex;align-items:center;height:30px}
.tab.on{color:var(--text);font-weight:500}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:1px;background:var(--text)}
.gctl{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:6px;color:var(--text)}
.gctl.on{background:var(--surface2);font-weight:500}
/* a finger needs 44px: every touch control is at least that tall */
.t-touch .tab,.t-touch .gctl{height:44px}
.t-touch .tab.on::after{bottom:8px}
.t-touch .menu .o{min-height:44px}
.t-touch .cover .btn{height:44px}
.t-touch .golive{min-height:44px;padding:0 12px}
/* pointing is a plain ring; amber is kept for focus */
.blk.hover .still{outline:2px solid var(--text);outline-offset:3px}
.keys .lab{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;font-size:14px;color:var(--text)}
.keys .lab.on{background:var(--surface2);font-weight:500}
.keys .lab.focus{outline:2px solid var(--amber);outline-offset:2px}
.t-touch .keys .lab{height:44px}
.keys .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.pausemark{position:absolute;display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:rgba(var(--ink),.72);color:var(--white);transform:translate(-50%,-50%)}
.ring{position:absolute;border-radius:8px;outline:2px solid var(--amber)}
.query{position:absolute;color:var(--white);font-weight:500}
.query small{font-weight:400;color:var(--muted);margin-left:14px}
.row{position:absolute;display:grid;align-items:baseline}
.row .n{color:var(--muted);text-align:right}
.row .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .now{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .left{color:var(--muted)}
.dial{position:absolute;width:10px;background:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px 15px)}
.dial i{position:absolute;left:0;width:10px;background:repeating-linear-gradient(180deg,var(--text) 0 1px,transparent 1px 15px)}
/* the horizontal arm: tonight on this channel */
.strip{position:absolute;display:flex;align-items:flex-start}
.blk{position:relative;flex:none}
.still{border-radius:6px;background-size:cover;background-position:center}
.blk .t{color:var(--muted);white-space:nowrap}
.blk .ti{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.focus .still{outline:2px solid var(--amber);outline-offset:3px}
.s0{background-image:url(picture.webp)}
.s1{background:linear-gradient(135deg,#24364f,#101721 72%)}
.s2{background:linear-gradient(135deg,#5a2b2f,#1c1012 72%)}
.s3{background:linear-gradient(135deg,#3b3a22,#15150d 72%)}
.s4{background:linear-gradient(135deg,#2f2a4a,#12101c 72%)}
.s5{background:linear-gradient(135deg,#1f4037,#0c1714 72%)}
.s6{background:linear-gradient(135deg,#4a3320,#17100a 72%)}
.spots{flex:none;display:flex}
.spots i{display:block;border-radius:2px;background:rgba(231,234,240,.2)}
.head{position:absolute;width:2px;background:var(--white)}
.head::before{content:"";position:absolute;left:-4px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--white)}
.fadeR{position:absolute;right:0;background:linear-gradient(90deg,rgba(var(--ink),0),rgba(var(--ink),.94))}
.info{position:absolute}
.info.plate{background:rgba(var(--ink),.94);padding:12px 14px;border-radius:8px}
.info h2{font-weight:600;color:var(--white)}
.info .f{color:var(--muted);margin-top:4px}
.info p{color:var(--text);margin-top:8px;line-height:1.5}
/* the guide: every channel's day at once, on one clock */
.gb{position:absolute;border-radius:4px;padding:0 10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb.focus{outline:2px solid var(--amber);outline-offset:2px}
.gs{position:absolute;border-radius:2px;background:rgba(231,234,240,.2)}
.nowtag{position:absolute;font-size:12px;background:var(--red);color:#0B0C0E;font-weight:500;border-radius:3px;padding:2px 6px;transform:translateX(-50%)}
/* quiet controls */
.keys{position:absolute;display:flex;align-items:center;color:var(--text)}
.keys .k{display:grid;place-items:center;opacity:.82;border-radius:8px}
.keys .k.open{opacity:1;background:var(--surface2)}
.keys .k.focus{opacity:1;outline:2px solid var(--amber);outline-offset:2px}
.top{position:absolute;display:flex;align-items:center;color:var(--text)}
.rate{font-size:12px;letter-spacing:.04em;color:var(--text)}
.pill{position:absolute;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;background:rgba(var(--ink),.94);font-size:13px;font-weight:500;transform:translateX(-50%)}
/* menus and sheets */
.menu{position:absolute;background:var(--surface);border-radius:10px;padding:8px}
.menu .h{font-size:12px;color:var(--muted);padding:8px 12px 6px}
.menu .o{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:6px;font-size:14px}
.menu .o small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.menu .o.sel{color:var(--white);font-weight:500}
.menu .o.focus{outline:2px solid var(--amber);outline-offset:-2px}
.sheetB{left:0;right:0;bottom:0;border-radius:16px 16px 0 0;padding:10px 12px 40px}
.sheetB::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheetR{top:0;bottom:0;right:0;border-radius:0;padding:20px 12px 20px 12px}
/* the wall: Home, zoomed out */
.rail{position:absolute;left:0;top:0;bottom:0;width:224px;border-right:1px solid var(--line);padding:22px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px 22px;font-weight:600;font-size:13px;letter-spacing:.18em}
.brand i{display:block;width:52px;height:3px;background:linear-gradient(90deg,#FFB020 0 14.3%,#F5D90A 0 28.6%,#3DD68C 0 42.9%,#4CC9E8 0 57.2%,#D6409F 0 71.5%,#E5484D 0 85.8%,#8B93A3 0)}
.nav{display:flex;align-items:center;gap:14px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--muted)}
.nav.on{background:var(--surface2);color:var(--text);font-weight:500}
.wtabs{position:absolute;display:flex;gap:28px;font-size:14px;color:var(--muted)}
.wtabs b{color:var(--text);font-weight:500;padding-bottom:6px;border-bottom:1px solid var(--text)}
.wcount{position:absolute;font-size:12px;color:var(--muted)}
.wall{position:absolute;display:grid}
.tile{position:relative;border-radius:8px;overflow:hidden;background-size:cover;background-position:center}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(var(--ink),.94),rgba(var(--ink),0) 62%),linear-gradient(180deg,rgba(var(--ink),.8),rgba(var(--ink),0) 46%)}
.tile>*{position:absolute;z-index:1}
.tile .n{left:14px;top:12px;font-size:20px;font-weight:500}
.tile .left{right:14px;top:15px;font-size:12px}
.tile .cap{left:14px;right:14px;bottom:14px}
.tile .name{font-size:12px;color:var(--muted)}
.tile .ti{margin-top:2px;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .prog{left:0;right:0;bottom:0;height:2px;background:rgba(231,234,240,.16)}
.tile .prog i{display:block;height:2px;background:var(--white)}
.tile.here{outline:2px solid var(--text);outline-offset:3px}
.sec{position:absolute;font-size:20px;font-weight:600}
.trow{position:absolute;display:grid;grid-template-columns:96px 40px 1fr;column-gap:16px;align-items:baseline;height:46px;padding-top:13px;border-top:1px solid var(--surface2);font-size:14px}
.trow .mono{color:var(--muted);font-size:13px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;border-top:1px solid var(--line);background:var(--bg);display:flex;padding-top:10px;font-size:12px;color:var(--muted)}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabbar .on{color:var(--text);font-weight:500}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;border-radius:20px;background:#000;transform:translateX(-50%);z-index:5}
.homeind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(231,234,240,.8);transform:translateX(-50%);z-index:5}
/* ---------- the gallery ---------- */
.gal{padding:48px 48px 96px;max-width:1500px;margin:0 auto}
.gal h1{font-size:32px;font-weight:600;letter-spacing:-.01em}
.gal .lede{margin-top:10px;max-width:68ch;color:var(--muted);font-size:15px;line-height:1.55}
.gal h2{margin:56px 0 4px;font-size:20px;font-weight:600}
.gal .dn{color:var(--muted);font-size:13px;margin-bottom:20px}
.grid{display:flex;flex-wrap:wrap;gap:28px 24px}
.cell a{display:block;border-radius:6px;overflow:hidden;outline:1px solid var(--line)}
.cell a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.cell iframe{border:0;display:block;transform-origin:0 0;pointer-events:none}
.cell .cap{margin-top:10px;font-size:14px;font-weight:500}
.cell .why{margin-top:2px;font-size:13px;color:var(--muted);line-height:1.45}
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
const ICON = {
  back:'<path d="M15 5l-7 7 7 7"/>', pause:'<path d="M8 5v14M16 5v14"/>', play:'<path d="M7 5l12 7-12 7z"/>',

};
const ic = (name, s = 22) => `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" aria-hidden="true">${ICON[name]}</svg>`;

// The invented household: 34 channels, these the ones the mock draws.
const CH = {

  22:{name:'Cozy Autumn Horror',now:'The Harvest House',short:'The Harvest House',left:'52 min',s:2,p:44},
  23:{name:'Kung Fu Theater',now:'Two Sides of the Ridge',short:'Two Sides of the Ridge',left:'77 min',s:5,p:26},
  24:{name:'Midnight Anime',now:'Beacon of the Hollow Moon',short:'Beacon of the Hollow Moon',left:'18 min',s:4,p:70},
  31:{name:'Sunday Matinee',now:'The Long Way to Marrow Bay',short:'The Long Way to Marrow Bay',left:'1 hr 12',s:1,p:34},
  40:{name:'Sports Replay',now:'A baseball classic',short:'A baseball classic',left:'2 hr 3',s:5,p:15},
  55:{name:'Frontier Westerns',now:'Dust on the Telegraph Line',short:'Dust on the Telegraph Line',left:'33 min',s:6,p:61}
};
// Each channel's decade, which heads By decade and colours the watched channel's numeral.
const DECADE = {1:'00',2:'90',3:'80',4:'80',5:'70',6:'00',7:'90',9:'80',12:'90',14:'50',19:'50',20:'70',21:'60',22:'70',23:'70',24:'90',31:'60',40:'80',55:'50'};
const decName = n => `${DECADE[n] < '30' ? 20 : 19}${DECADE[n]}s`;
const dec = n => `var(--decade-${DECADE[n]}s)`;
// One order everywhere: channel number. A list scrolls so the tuned channel sits on the crossing;
// it never wraps on screen, though flipping past the last channel still reaches the first.
const ORDER = Object.keys(CH).map(Number).sort((a, b) => a - b);
const before = (n, k) => ORDER.slice(0, ORDER.indexOf(n)).reverse().slice(0, k);
const after = (n, k) => ORDER.slice(ORDER.indexOf(n) + 1).slice(0, k);
const leftOf = n => CH[n].left === 'break' ? 'in a break' : `${CH[n].left} left`;
// The group tabs head every list of channels. The find glyph opens the query; a television has none.

// A decade heading, in its decade's colour.
const dhead = (n, style) => `<div class="abs" style="${style};font-size:12px;font-weight:500;letter-spacing:.04em;color:${dec(n)}">${decName(n)}</div>`;
const guideCtl = (style, on) => `<span class="gctl abs${on ? ' on' : ''}" style="${style}">${ic('guide', 18)}Guide</span>`;
const STRIPS = {
  12: [{w:270,s:3,t:'Now · until 10:44',ti:'Buzzer Round',now:1},{spots:2},{w:270,s:3,t:'10:47 AM',ti:'Buzzer Round'},{spots:3},{w:260,s:5,t:'11:34 AM',ti:'Odds and Evens'},{spots:2},{w:260,s:5,t:'12:21 PM',ti:'Odds and Evens'}]
};
const STRIP = [
  {w:250,s:0,t:'Now · until 10:55',ti:'The Diner Years',now:1},{spots:3},
  {w:300,s:1,t:'10:58 AM',ti:'Last Case on Harbor Street'},{spots:2},
  {w:170,s:2,t:'12:34 PM',ti:'The Diner Years'},{spots:3},
  {w:190,s:3,t:'1:02 PM',ti:'Beacon of the Hollow Moon'},{spots:2},
  {w:220,s:4,t:'2:40 PM',ti:'Two Sides of the Ridge'}
];

// Each channel's day in minutes from 10:00 AM: [start, end, title]. A gap between two is a break.

const lead = (d, o) => d.window ? '' : `${o.live ? `<span class="lab" style="color:#E85A5F"><span class="dot" style="top:0;margin:0"></span>Go live</span>` : ''}<span class="lab${o.col ? ' on' : ''}">${ic('list', 18)}Channels${o.group ? `: ${o.group}` : ''}</span><span class="lab">${ic('guide', 18)}Guide</span><i class="sep"></i>`;
const keys = (d, o = {}) => `<div class="keys" style="right:${d.touch ? 30 : d.pad}px;${o.top != null ? `top:${o.top}px` : `bottom:${d.remote ? 27 + 8 : d.touch ? 24 : 44}px`};gap:${d.keyGap - 14}px">${lead(d, o)}${
  d.keys.map(k => `<span class="k${o.open === k ? ' open' : ''}" style="width:${d.touch ? 44 : d.keyS + 14}px;height:${d.touch ? 44 : d.keyS + 14}px">${ic(o.muted && k === 'vol' ? 'mute' : (o.paused && k === 'pause' ? 'play' : k), d.keyS)}</span>`).join('')}</div>`;
// Home is named, so the arrow is never a bare glyph. The rating sits in the lower third, not beside it.
const topLeft = d => d.remote ? '' : `<div class="top" style="left:${d.pad - 10}px;top:${d.touch ? 14 : 32}px;gap:2px;font-size:14px"><span style="display:grid;place-items:center;width:44px;height:44px">${ic('back', 22)}</span>Home</div>`;

// More holds only what has no key of its own, and the sheet of keys or remote buttons.
const more = (d, cls, style) => `<div class="menu ${cls}" style="${style}"><div class="h">More</div>
  <div class="o${d.remote ? ' focus' : ''}">Last channel<span style="color:var(--muted);font-size:13px">12 Game Night</span></div>
  <div class="o">Picture<span style="color:var(--muted);font-size:13px">Auto · 1080p</span></div><div class="o">Playback details</div>${d.pointer ? '<div class="o">Picture in picture</div>' : ''}
  ${d.remote ? '<div class="o">Remote buttons</div>' : d.pointer ? '<div class="o">Keyboard shortcuts</div>' : ''}<div class="o">Manage this channel</div></div>`;

const pauseMark = (x = '50%', y = '46%') => `<div class="pausemark" style="left:${x};top:${y}">${ic('pause', 30)}</div>`;

// Desktop, television and a phone on its side share one composition.

  // The cursor ring rests on the pinned channel. A touch screen draws no ring.
  const ring = d.touch ? '' : `<div class="ring" style="left:${d.pad - 10}px;top:${d.cross - 12}px;width:${d.rowW + d.gap + 60}px;height:${d.title * 1.12 + d.meta * 3 + 30}px"></div>`;

    case 'tune': return P + `<div class="dip"></div>` + snow(.22) + B + `<div class="bars" style="left:${d.pad}px;top:${d.cross - 18}px;width:${Math.round(d.W * .46)}px"></div>` + third(d, {n: 12, title: 'Game Night', next: 1, meta: `<span class="dot"></span><em>Game Night</em> · TV-PG · <em>24 min left</em>`}) + K;

// The Guide on a television: the picture docks top right and keeps its caption, the header is one

  const T = state === 'tune' ? 12 : 7;
  const pic = `<div class="pic" style="left:0;top:104px;width:390px;height:219px"></div>${state === 'tune' ? '<div class="dip" style="inset:104px 0 521px 0"></div>' + snow(.22, 'inset:104px 0 521px 0') : ''}${state === 'cold' ? drained('inset:104px 0 521px 0') : ''}`;
  // The whole list in number order, or headed by decade, scrolled so the watched channel is in view and marked.
  const rows = (order) => { let y = 482, h = ''; const at = order.indexOf(T), first = Math.max(0, at - 2);
    for (let i = first; i < order.length && y < 800; i++) {
      const n = order[i], on = n === T;
      if (order === BYDEC && (i === first || DECADE[order[i - 1]] !== DECADE[n])) { h += dhead(n, `left:58px;top:${y + 4}px`); y += 24; }
      h += `<div class="row" style="left:16px;top:${y}px;width:358px;grid-template-columns:36px 1fr auto;column-gap:14px">
        <span class="n mono" style="font-size:15px${on ? `;color:${dec(n)}` : ''}">${n}</span>
        <div style="min-width:0"><div class="name" style="font-size:15px${on ? ';color:var(--white);font-weight:600' : ''}">${CH[n].name}</div><div class="now" style="font-size:13px;margin-top:2px">${CH[n].now}</div></div>
        <span class="left mono" style="font-size:12px${on ? ';color:var(--text)' : ''}">${on ? 'watching' : leftOf(n)}</span></div>`;
      y += 56;
    }
    return h; };
  const list = rows(ORDER);
  // The tabs scroll sideways under a fade; the Guide control is pinned at their end, with its word.
  // While the Guide is up it reads Channels.
  const tabRow = (inGuide, sel) => tabs({left: 4, top: 424, gap: 20, touch: 1, width: 280, sel}) + `<div class="abs" style="left:252px;top:424px;width:32px;height:44px;background:linear-gradient(90deg,rgba(0,0,0,0),#000)"></div>`
    + `<span class="gctl abs on" style="right:10px;top:424px;height:44px">${inGuide ? ic('list', 18) + 'Channels' : ic('guide', 18) + 'Guide'}</span>`;
  const tabsP = tabRow(false);
  const fade = `<div class="abs" style="left:0;right:0;bottom:0;height:70px;background:linear-gradient(0deg,var(--bg),rgba(var(--ink),0))"></div><div class="homeind"></div>`;
  const t = o => third(d, {w: 200, next: 1, ...o}) + thumb(o.paused);
  const body = o => bar + pic + t(o) + tabsP + list + fade;
  if (state.startsWith('guide') || state === 'later') {
    // The Guide on a phone is a time view: one channel's day per row, its number and name on a line above.
    const looking = state === 'later', paged = state === 'guide-paged', byDecade = state === 'guide-decade';
    const g = {x:16,y:512,k:3.9,span:90,off:paged || looking ? 60 : 0,now:20,rows:looking ? [7,9] : byDecade ? [9,2,7,12] : [5,6,7,9,12],bh:34,th:54,rg:28,cx:16,numW:0,gap:0,nameW:0,fn:15,fb:13,above:1,bg:'#000'};
    const detail = looking ? `<div class="abs" style="left:16px;right:16px;top:702px;border-top:1px solid var(--line);padding-top:12px"><h2 style="font-size:16px;font-weight:600;color:var(--white)">Beacon of the Hollow Moon</h2>
      <div class="mono" style="font-size:12px;color:var(--muted);margin-top:4px">9 Movie Matinee · 11:23 AM to 12:55 PM · ${FACTS['Beacon of the Hollow Moon'][0]}</div><p style="font-size:13px;line-height:1.45;margin-top:6px">${FACTS['Beacon of the Hollow Moon'][1]}</p></div><div class="homeind"></div>` : fade;
    return bar + pic + t({}) + tabRow(true, byDecade ? 'By decade' : null) + pager('right:8px;top:468px', !paged && !looking, 44) + guide(g, {byDecade})
      + `<div class="abs" style="right:0;top:540px;width:20px;height:${looking ? 160 : 280}px;background:linear-gradient(90deg,rgba(0,0,0,0),#000)"></div>` + detail
      + (state === 'guide-message' ? plate('Beacon of the Hollow Moon starts at 11:23 AM', 'top:276px') : '');
  }
  switch (state) {
    case 'playing': return body({}) + hint('phone', 'left:50%;top:280px;transform:translateX(-50%)');
    case 'list-decade': return bar + pic + t({}) + tabRow(false, 'By decade') + rows(BYDEC) + fade;
    case 'break': return body({meta: `<em>Coast 90s</em> · <span class="back">Back in 2 min</span>`});
    // Go live leads its line, which keeps its height.
    case 'behind': return body({meta: `<span class="golive" style="margin:0 10px 0 0;padding:0 8px;min-height:0;height:17px;line-height:15px"><span class="dot" style="top:0"></span>Go live</span>12 s behind live`});
    case 'nothing': return bar + pic + t({title: 'Coast 90s', meta: 'Nothing scheduled', next: 0}) + tabsP + list + fade;
    case 'tune': return bar + pic + `<div class="bars" style="left:16px;top:326px;width:210px"></div>` + t({n: 12, title: 'Game Night', meta: `<span class="dot"></span><em>Game Night</em> · <em>24 min left</em>`}) + tabsP + list + fade;
    case 'subtitles': return body({}) + `<div class="scrimAll" style="top:323px;opacity:.6"></div>` + subs({}, 'sheetB abs', '') + `<div class="homeind"></div>`;
    case 'more': return body({}) + `<div class="scrimAll" style="top:323px;opacity:.6"></div>` + more({}, 'sheetB abs', '') + `<div class="homeind"></div>`;
    case 'paused': return body({meta: `<em>Coast 90s</em> · <em>Paused</em>`, paused: 1}) + `<div class="abs" style="left:0;top:104px;width:390px;height:219px"><div class="dip" style="background:rgba(var(--ink),.3)"></div>${pauseMark('50%', '50%')}</div>`;
    case 'cold': return bar + pic + `<div class="bars wait" style="left:16px;top:326px;width:210px"></div>` + t({title: 'Coast 90s', next: 0, meta: `Tuning in… <em>Starting the channel</em>`}) + tabsP + list + fade;
    case 'off-air': return bar + `<div class="abs" style="inset:104px 0 0 0">${cover()}</div><div class="homeind"></div>`;
  }
  return body({});
};

// The wall: Home, where the back arrow leads.
const tile = (n, w, h, here) => `<div class="tile${NOART ? '' : ` s${CH[n].s}`}${here ? ' here' : ''}" style="height:${h}px${NOART ? ';background:var(--surface)' : ''}"><span class="n mono"${here ? ` style="color:${dec(n)}"` : ''}>${n}</span><span class="left mono">${here ? 'you were here' : leftOf(n)}</span>
  <div class="cap"><div class="name">${CH[n].name}</div><div class="ti">${CH[n].short}</div></div><div class="prog"><i style="width:${CH[n].p}%"></i></div></div>`;
const wall = dev => {
  // The last watched leads; the rest follow in number order, the same order as every other list.
  const order = [7, ...ORDER.filter(n => n !== 7)].slice(0, 12);
  if (dev === 'portrait') return `<div class="island"></div>${tabs({left: 4, top: 62, gap: 20, touch: 1})}
    <div class="wall" style="left:16px;top:122px;width:358px;grid-template-columns:1fr 1fr;gap:12px">${order.slice(0, 10).map((n, i) => tile(n, 173, 112, i === 0)).join('')}</div>
    <div class="tabbar"><div class="on">${ic('home')}Home</div><div>${ic('guide')}Guide</div><div>${ic('inbox')}Requests</div><div>${ic('more')}More</div></div><div class="homeind"></div>`;
  const nav = [['home','Home',1],['guide','Guide'],['inbox','Requests'],['bell','Notifications'],['help','Help']];
  // The watched tile says so; every other says how long is left.
  return `<div class="rail"><div class="brand"><i></i>LOOMARR</div>${nav.map(([i, l, on]) => `<div class="nav${on ? ' on' : ''}">${ic(i, 18)}${l}</div>`).join('')}</div>
    ${tabs({left: 264, top: 36, gap: 24})}
    <div class="wcount mono" style="right:48px;top:46px">34 channels · 10:20 AM</div>
    <div class="wall" style="left:272px;top:92px;width:1120px;grid-template-columns:repeat(4,1fr);gap:16px">${order.map((n, i) => tile(n, 268, 151, i === 0)).join('')}</div>
    <div class="sec" style="left:272px;top:630px">Later today</div>
    ${[['10:58 AM','7','Last Case on Harbor Street'],['11:23 AM','9','Beacon of the Hollow Moon'],['11:46 AM','21','Cold Relay'],['12:51 PM','14','A Quiet Day in Dry Gulch and the Long Ride Home Afterwards']].map((r, i) =>
      `<div class="trow" style="left:272px;top:${676 + i * 46}px;width:1120px"><span class="mono">${r[0]}</span><span class="mono">${r[1]}</span><span style="font-weight:500">${r[2]}</span></div>`).join('')}`;
};

const STATES = {
  // Every state drawn for each device, in the order of its sheet.
  desk: 'playing peek later focus find typing recent list-decade tune cold paused break behind nothing subtitles more unmute off-air guide guide-later guide-paged guide-message guide-decade',
  desktop: 'rest third list list-row list-decade favourites find typing tune cold paused break behind nothing subtitles more unmute off-air bright guide guide-later guide-paged guide-message guide-decade',
  tv: 'rest third list list-row list-tab list-decade favourites tune cold paused break behind nothing subtitles more off-air bright guide guide-later guide-paged guide-message guide-decade',
  portrait: 'playing list-decade guide later guide-paged guide-message guide-decade tune cold paused break behind nothing subtitles more off-air wall',
  landscape: 'rest third list list-decade favourites tune cold paused break behind nothing subtitles more off-air bright'
};
const CAPTION = {
  rest:['At rest','Nothing but the picture and the channel’s own watermark.'],
  third:['A flip or a wake','Up and Down change channel and show only the lower third and the quiet row, with the first-run hint.'],
  playing:['Playing','Nothing covers the picture. The whole channel list stays in view, with the watched channel pinned or marked.'],
  list:['The channel list','Opened from Channels. The watched channel is pinned as the lower third; moving the cursor does not tune.'],
  'list-row':['The cursor on another row','The list looks; the picture keeps playing the watched channel.'],
  'list-tab':['The ring on a group tab','Up from the first channel reaches the tabs; Left and Right change the group.'],
  'list-decade':['By decade','Each decade heads its channels in its own colour.'],
  favourites:['A group other than All','The Channels control names it, because the group also steers Up and Down.'],
  recent:['Recent, empty','The group with nothing in it says what will collect there.'],
  peek:['Pointing at a channel','The label names the channel looked at and the one still playing. A click tunes.'],
  later:['Looking ahead','A later programme’s facts: under the strip in a window, under the Guide on a phone.'],
  find:['Finding by name','The find control filters the list. Results list under the query.'],
  focus:['Keyboard focus','Focus is drawn on the pinned channel.'],
  typing:['Typing a number','The digits replace the numeral and wait for Enter.'],
  tune:['Changing channel','A short, dim burst of static, and the seven bars run once along the crossing.'],
  cold:['Tuning in','Static for the real wait. The lower third names the channel and the bars wait in grey.'],
  paused:['Paused','The picture itself is marked.'],
  break:['In a break','The programme that comes back, and when.'],
  behind:['Behind live','How far behind, and Go live: first in the line, or first in a television’s quiet row.'],
  nothing:['Nothing scheduled','The channel’s name stands in for a title.'],
  subtitles:['What a key opens','A menu over the quiet row; a sheet on a phone.'],
  more:['More','Only what has no key of its own.'],
  unmute:['First play, muted','The web’s first play is muted and says how to fix it.'],
  'off-air':['Off air','The covers and their words are unchanged.'],
  bright:['Over a bright frame','The open list over a washed-out picture, to prove the scrims.'],
  guide:['The Guide','Opens on the row of the channel you are watching. What has ended is dimmed.'],
  'guide-later':['The Guide, looking','The header says “Looking at”; the docked picture keeps its caption.'],
  'guide-paged':['The Guide, paged later','Earlier and Later page it; a television pages with Right.'],
  'guide-message':['A message in the Guide','OK on a later programme says when it starts.'],
  'guide-decade':['The Guide by decade','The same decade headings.'],
  wall:['The wall','Home, where the back arrow leads: every channel with its artwork.']
};
const SIZE = {desk:[1440,900,.3],desktop:[1440,900,.3],tv:[960,540,.45],landscape:[844,390,.5],portrait:[390,844,.5]};

const dev = q.get('device'), state = q.get('state');
if (dev) {
  const [W, H] = SIZE[dev];
  // Full screen, the Guide is the same page as in a window: it already fills the screen.
  const paged = dev === 'desk' || (dev === 'desktop' && state.startsWith('guide'));
  // The phone's wall is a state of its own; the window's is drawn as desktop.
  const html = state === 'wall' ? wall(dev) : dev === 'portrait' ? portrait(state) : paged ? desk(state) : wide(DEV[dev], state);
  document.body.innerHTML = `<div class="screen${dev === 'portrait' || dev === 'landscape' ? ' t-touch' : ''}" style="${paged ? 'background:var(--bg);' : ''}width:${W}px;height:${H}px${state === 'wall' || dev === 'desk' ? ';background:var(--bg)' : dev === 'portrait' ? ';background:#000' : ''}">${html}</div>`;
  document.documentElement.style.cssText = `width:${W}px;height:${H}px;overflow:hidden`;
} else {
  const cell = (d, s, cap = CAPTION[s][0], why = CAPTION[s][1], x = '') => { const [W, H, k] = SIZE[d]; const src = `?device=${d}&state=${s}${x}`;
    return `<div class="cell" style="width:${W * k}px"><a href="${src}" style="width:${W * k}px;height:${H * k}px"><iframe src="${src}" width="${W}" height="${H}" style="transform:scale(${k})" tabindex="-1" title="${cap}"></iframe></a><div class="cap">${cap}</div>${why ? `<div class="why">${why}</div>` : ''}</div>`; };
  const sect = (d, title, note, extra = '') => `<h2>${title}</h2><div class="dn">${note}</div><div class="grid">${STATES[d].split(' ').map(s => cell(d, s)).join('')}${extra}</div>`;
  document.body.innerHTML = `<main class="gal"><h1>Watching Loomarr: The Cross</h1>
    <p class="lede">Channels run down, the day runs across, and they meet at what is on. Loomarr opens on the picture. Flipping tunes; the list looks. Select a tile to open it at full size.</p>
    ${sect('desk','Desktop, in a window','1440 × 900, pointer and keyboard. The list runs down the left and the strip under the picture; nothing covers it.', cell('desk','playing','No artwork','A library with no art: flat tones in place of stills.','&art=0') + cell('desk','guide','The Guide, no artwork','The same hierarchy from tone alone.','&art=0') + cell('desktop','wall'))}
    ${sect('desktop','Desktop, full screen','1440 × 900. Up and Down change channel. Channels opens the list over the picture; Guide shows later today.')}
    ${sect('tv','Television','960 × 540, remote. Up and Down change channel, OK pauses, Left and Right move along the quiet row: Channels, Guide, Pause, Subtitles, Audio, More. No typed find.')}
    ${sect('portrait','Phone, upright','390 × 844, touch. The picture on top, the whole list under it.', cell('portrait','playing','No artwork','','&art=0'))}
    ${sect('landscape','Phone, on its side','844 × 390, touch. A tap wakes the lower third; a vertical swipe flips.')}
  </main>`;
}
</script>
</body>
</html>
