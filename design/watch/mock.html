<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watching Loomarr: The Cross</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0C0E;--surface:#131519;--surface2:#1B1E24;--line:#2A2E37;--muted:#8B93A3;--text:#E7EAF0;--white:#fff;
--amber:#FFB020;--red:#E5484D;--cyan:#4CC9E8;--ink:11,12,14}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:#0B0C0E}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- one screen ---------- */
.screen{position:relative;overflow:hidden;background:#000}
.abs{position:absolute}
.pic{position:absolute;background:#000 url(picture.webp) center/cover no-repeat}
.bright .pic{filter:brightness(2.4) saturate(.55) contrast(.8)}
.dip{position:absolute;inset:0;background:rgba(var(--ink),.5)}
.scrimB{position:absolute;inset:0;background:linear-gradient(0deg,rgba(var(--ink),.96) 0,rgba(var(--ink),.78) 26%,rgba(var(--ink),0) 56%)}
.scrimB.low{background:linear-gradient(0deg,rgba(var(--ink),.94) 0,rgba(var(--ink),.7) 22%,rgba(var(--ink),0) 44%)}
.scrimL{position:absolute;inset:0;background:linear-gradient(90deg,rgba(var(--ink),.96) 0,rgba(var(--ink),.92) 50%,rgba(var(--ink),0) 70%)}
.scrimAll{position:absolute;inset:0;background:rgba(var(--ink),.72)}
.cover{position:absolute;inset:0;background:rgba(var(--ink),.9);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:0 32px}
.cover h2{font-size:20px;font-weight:600;color:var(--white)}
.cover p{font-size:14px;color:var(--muted);max-width:340px;line-height:1.5}
.cover .btn{margin-top:14px;height:40px;padding:0 18px;border-radius:8px;border:1px solid #666970;display:inline-flex;align-items:center;font-size:14px;font-weight:500}
/* the lower third: the crossing */
.third{position:absolute;display:grid;align-items:center}
.third .n{line-height:1;font-weight:500;text-align:right;letter-spacing:-.02em;color:var(--white)}
.third h1{line-height:1.12;font-weight:600;color:var(--white);letter-spacing:-.01em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.third .meta{color:var(--muted);white-space:nowrap}
.third .meta em{font-style:normal;color:var(--text)}
.third .next{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.third .next b{font-weight:500;color:var(--text)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle;position:relative;top:-1px}
.golive{display:inline-flex;align-items:center;margin-left:12px;padding:3px 10px;border:1px solid var(--red);border-radius:6px;color:#E85A5F;font-weight:500}
.back{color:var(--cyan)}
.caret{display:inline-block;width:.5em;height:.08em;background:currentColor;margin-left:.06em}
.bars{position:absolute;height:3px;background:linear-gradient(90deg,#FFB020 0 14.3%,#F5D90A 0 28.6%,#3DD68C 0 42.9%,#4CC9E8 0 57.2%,#D6409F 0 71.5%,#E5484D 0 85.8%,#8B93A3 0)}
.bars.wait{background:linear-gradient(90deg,#8B93A3 0 14.3%,#5A6170 0 28.6%,#8B93A3 0 42.9%,#5A6170 0 57.2%,#8B93A3 0 71.5%,#5A6170 0 85.8%,#8B93A3 0)}
/* the vertical arm: channels */
.tabs{position:absolute;display:flex;align-items:center;color:var(--muted);white-space:nowrap}
.tab{position:relative;display:inline-flex;align-items:center;height:30px}
.tab.on{color:var(--text);font-weight:500}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:1px;background:var(--text)}
.gctl{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:6px;color:var(--text)}
.gctl.on{background:var(--surface2);font-weight:500}
/* a finger needs 44px: every touch control is at least that tall */
.t-touch .tab,.t-touch .gctl{height:44px}
.t-touch .tab.on::after{bottom:8px}
.t-touch .menu .o{min-height:44px}
.t-touch .cover .btn{height:44px}
.t-touch .golive{padding:11px 12px}
.ring{position:absolute;border-radius:8px;outline:2px solid var(--amber)}
.query{position:absolute;color:var(--white);font-weight:500}
.query small{font-weight:400;color:var(--muted);margin-left:14px}
.row{position:absolute;display:grid;align-items:baseline}
.row .n{color:var(--muted);text-align:right}
.row .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .now{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .left{color:var(--muted)}
.dial{position:absolute;width:10px;background:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px 15px)}
.dial i{position:absolute;left:0;width:10px;background:repeating-linear-gradient(180deg,var(--text) 0 1px,transparent 1px 15px)}
/* the horizontal arm: tonight on this channel */
.strip{position:absolute;display:flex;align-items:flex-start}
.blk{position:relative;flex:none}
.still{border-radius:6px;background-size:cover;background-position:center}
.blk .t{color:var(--muted);white-space:nowrap}
.blk .ti{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.focus .still{outline:2px solid var(--amber);outline-offset:3px}
.s0{background-image:url(picture.webp)}
.s1{background:linear-gradient(135deg,#24364f,#101721 72%)}
.s2{background:linear-gradient(135deg,#5a2b2f,#1c1012 72%)}
.s3{background:linear-gradient(135deg,#3b3a22,#15150d 72%)}
.s4{background:linear-gradient(135deg,#2f2a4a,#12101c 72%)}
.s5{background:linear-gradient(135deg,#1f4037,#0c1714 72%)}
.s6{background:linear-gradient(135deg,#4a3320,#17100a 72%)}
.spots{flex:none;display:flex}
.spots i{display:block;border-radius:2px;background:rgba(231,234,240,.2)}
.head{position:absolute;width:2px;background:var(--white)}
.head::before{content:"";position:absolute;left:-4px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--white)}
.fadeR{position:absolute;right:0;background:linear-gradient(90deg,rgba(var(--ink),0),rgba(var(--ink),.94))}
.info{position:absolute}
.info.plate{background:rgba(var(--ink),.94);padding:12px 14px;border-radius:8px}
.info h2{font-weight:600;color:var(--white)}
.info .f{color:var(--muted);margin-top:4px}
.info p{color:var(--text);margin-top:8px;line-height:1.5}
/* the guide: every channel's day at once, on one clock */
.gb{position:absolute;border-radius:4px;padding:0 10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb.focus{outline:2px solid var(--amber);outline-offset:2px}
.gs{position:absolute;border-radius:2px;background:rgba(231,234,240,.2)}
.nowtag{position:absolute;font-size:12px;background:var(--red);color:#0B0C0E;font-weight:500;border-radius:3px;padding:2px 6px;transform:translateX(-50%)}
/* quiet controls */
.keys{position:absolute;display:flex;align-items:center;color:var(--text)}
.keys .k{display:grid;place-items:center;opacity:.82;border-radius:8px}
.keys .k.open{opacity:1;background:var(--surface2)}
.keys .k.focus{opacity:1;outline:2px solid var(--amber);outline-offset:2px}
.top{position:absolute;display:flex;align-items:center;color:var(--text)}
.rate{font-size:12px;letter-spacing:.04em;color:var(--text)}
.help{position:absolute;display:flex;color:var(--muted);white-space:nowrap}
.help b{font-weight:500;color:var(--text);margin-right:8px}
.pill{position:absolute;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;background:rgba(var(--ink),.94);font-size:13px;font-weight:500;transform:translateX(-50%)}
/* menus and sheets */
.menu{position:absolute;background:var(--surface);border-radius:10px;padding:8px}
.menu .h{font-size:12px;color:var(--muted);padding:8px 12px 6px}
.menu .o{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:6px;font-size:14px}
.menu .o small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.menu .o.sel{color:var(--white);font-weight:500}
.menu .o.focus{outline:2px solid var(--amber);outline-offset:-2px}
.sheetB{left:0;right:0;bottom:0;border-radius:16px 16px 0 0;padding:10px 12px 40px}
.sheetB::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheetR{top:0;bottom:0;right:0;border-radius:0;padding:20px 12px 20px 12px}
/* the wall: Home, zoomed out */
.rail{position:absolute;left:0;top:0;bottom:0;width:224px;border-right:1px solid var(--line);padding:22px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px 22px;font-weight:600;font-size:13px;letter-spacing:.18em}
.brand i{display:block;width:52px;height:3px;background:linear-gradient(90deg,#FFB020 0 14.3%,#F5D90A 0 28.6%,#3DD68C 0 42.9%,#4CC9E8 0 57.2%,#D6409F 0 71.5%,#E5484D 0 85.8%,#8B93A3 0)}
.nav{display:flex;align-items:center;gap:14px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--muted)}
.nav.on{background:var(--surface2);color:var(--text);font-weight:500}
.wtabs{position:absolute;display:flex;gap:28px;font-size:14px;color:var(--muted)}
.wtabs b{color:var(--text);font-weight:500;padding-bottom:6px;border-bottom:1px solid var(--text)}
.wcount{position:absolute;font-size:12px;color:var(--muted)}
.wall{position:absolute;display:grid}
.tile{position:relative;border-radius:8px;overflow:hidden;background-size:cover;background-position:center}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(var(--ink),.94),rgba(var(--ink),0) 62%),linear-gradient(180deg,rgba(var(--ink),.8),rgba(var(--ink),0) 46%)}
.tile>*{position:absolute;z-index:1}
.tile .n{left:14px;top:12px;font-size:20px;font-weight:500}
.tile .left{right:14px;top:15px;font-size:12px}
.tile .cap{left:14px;right:14px;bottom:14px}
.tile .name{font-size:12px;color:var(--muted)}
.tile .ti{margin-top:2px;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .prog{left:0;right:0;bottom:0;height:2px;background:rgba(231,234,240,.16)}
.tile .prog i{display:block;height:2px;background:var(--white)}
.tile.here{outline:2px solid var(--text);outline-offset:3px}
.tile.here .n{color:var(--cyan)}
.sec{position:absolute;font-size:20px;font-weight:600}
.trow{position:absolute;display:grid;grid-template-columns:96px 40px 1fr;column-gap:16px;align-items:baseline;height:46px;padding-top:13px;border-top:1px solid var(--surface2);font-size:14px}
.trow .mono{color:var(--muted);font-size:13px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;border-top:1px solid var(--line);background:var(--bg);display:flex;padding-top:10px;font-size:12px;color:var(--muted)}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabbar .on{color:var(--text);font-weight:500}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;border-radius:20px;background:#000;transform:translateX(-50%);z-index:5}
.homeind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(231,234,240,.8);transform:translateX(-50%);z-index:5}
/* ---------- the gallery ---------- */
.gal{padding:48px 48px 96px;max-width:1500px;margin:0 auto}
.gal h1{font-size:32px;font-weight:600;letter-spacing:-.01em}
.gal .lede{margin-top:10px;max-width:68ch;color:var(--muted);font-size:15px;line-height:1.55}
.gal h2{margin:56px 0 4px;font-size:20px;font-weight:600}
.gal .dn{color:var(--muted);font-size:13px;margin-bottom:20px}
.grid{display:flex;flex-wrap:wrap;gap:28px 24px}
.cell a{display:block;border-radius:6px;overflow:hidden;outline:1px solid var(--line)}
.cell a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.cell iframe{border:0;display:block;transform-origin:0 0;pointer-events:none}
.cell .cap{margin-top:10px;font-size:14px;font-weight:500}
.cell .why{margin-top:2px;font-size:13px;color:var(--muted);line-height:1.45}
</style>
</head>

    const g = {x:264,y:118,k:5.4,span:120,now:20,rows:[3,4,5,6,7,9,12,14],bh:34,th:60,rg:5,cx:d.pad,numW:44,gap:16,nameW:150,fn:16,fname:15,fb:14};

    case 'off-air': return P + cover();
    case 'cold': return P + drained() + Bl + `<div class="bars wait" style="left:${d.pad}px;top:${d.cross - 18}px;width:${Math.round(d.W * .46)}px"></div>` + third(d, {title: 'Coast 90s', meta: 'Tuning in…'});

};

STATES.desk = [
  ['playing','Playing','Nothing covers the picture. The column and today’s strip sit beside and under it.'],
  ['peek','Pointing at a channel','Its day shows in the strip before you tune. A click tunes.'],
  ['later','Pointing at a programme','Its facts replace the on-air synopsis underneath.'],

];
const SIZE = {desk:[1440,900,.3],desktop:[1440,900,.3],tv:[960,540,.45],landscape:[844,390,.5],portrait:[390,844,.5]};

const dev = q.get('device'), state = q.get('state');
if (dev) {
  const [W, H] = SIZE[dev];
  // Full screen, the Guide is the same page as in a window: it already fills the screen.
  const paged = dev === 'desk' || (dev === 'desktop' && state.startsWith('guide'));
  const html = state === 'wall' ? wall(dev) : dev === 'portrait' ? portrait(state) : paged ? desk(state) : wide(DEV[dev], state);
  document.body.innerHTML = `<div class="screen${dev === 'portrait' || dev === 'landscape' ? ' t-touch' : ''}" style="${paged ? 'background:var(--bg);' : ''}width:${W}px;height:${H}px${state === 'wall' || dev === 'desk' ? ';background:var(--bg)' : dev === 'portrait' ? ';background:#000' : ''}">${html}</div>`;
  document.documentElement.style.cssText = `width:${W}px;height:${H}px;overflow:hidden`;
} else {
  const cell = (d, s, cap, why, x = '') => { const [W, H, k] = SIZE[d]; const src = `?device=${d}&state=${s}${x}`;
    return `<div class="cell" style="width:${W * k}px"><a href="${src}" style="width:${W * k}px;height:${H * k}px"><iframe src="${src}" width="${W}" height="${H}" style="transform:scale(${k})" tabindex="-1" title="${cap}"></iframe></a><div class="cap">${cap}</div>${why ? `<div class="why">${why}</div>` : ''}</div>`; };
  const sect = (d, title, note, list, extra = '') => `<h2>${title}</h2><div class="dn">${note}</div><div class="grid">${list.map(s => cell(d, ...s)).join('')}${extra}</div>`;
  document.body.innerHTML = `<main class="gal"><h1>Watching Loomarr: The Cross</h1>
    <p class="lede">Channels run down, the evening runs across, and they meet at what is on. Loomarr opens on the picture. Every state is drawn on a desktop, a television, and a phone both ways. Select a tile to open it at full size.</p>
    ${sect('desk','Desktop, in a window','1440 × 900, pointer and keyboard. There is room beside the picture, so the cross sits beside it.',STATES.desk, cell('desk','guide','The guide','Every channel’s day on one clock. The picture steps into the corner and keeps playing.') + cell('desk','guide-later','The guide, pointing at a programme','Its facts take the place of what is on. A click on a row tunes.') + cell('desk','more','More','Only what has no key of its own. The channel list and Info left it.') + cell('desk','cold','Tuning in','Static for as long as the real wait. The lower third names the channel and the bars wait in grey.') + cell('desk','playing','No artwork','A library with no art: flat tones in place of stills, nothing empty.','&art=0') + cell('desk','guide','The guide, no artwork','The same hierarchy from tone alone.','&art=0') + cell('desktop','wall','The wall','Home, where the back arrow leads: every channel with its artwork.'))}
    ${sect('desktop','Desktop, full screen','The picture fills the screen and the same cross sits over it.',STATES.wide, cell('desktop','unmute','First play, muted','The web’s first play is muted and says how to fix it.') + cell('desktop','bright','Over a bright frame','The same crossing over a washed-out picture, to prove the scrims.') + cell('desktop','more','More','') + cell('desktop','paused','Paused','') + cell('desktop','guide','The guide','Full screen, the Guide is the same page as in a window.'))}
    ${sect('tv','Television','960 × 540, remote. Up and Down tune, OK opens the column, Left and Right move along the evening.',STATES.wide.filter(s => s[0] !== 'find'), cell('tv','guide','The guide','OK on the picture opens it. Focus starts on what the tuned channel is showing.') + cell('tv','more','More','') + cell('tv','paused','Paused','') + cell('tv','bright','Over a bright frame',''))}
    ${sect('portrait','Phone, upright','390 × 844',STATES.portrait, cell('portrait','guide','The guide','The picture stays on top; the grid takes the column’s place.') + cell('portrait','cold','First open','') + cell('portrait','playing','No artwork','','&art=0') +cell('portrait','wall','The wall',''))}
    ${sect('landscape','Phone, on its side','844 × 390, touch. A tap wakes the lower third; a vertical swipe flips.',STATES.wide.filter(s => !['find','typing'].includes(s[0])), cell('landscape','paused','Paused','') + cell('landscape','more','More','') + cell('landscape','bright','Over a bright frame',''))}
  </main>`;
}
