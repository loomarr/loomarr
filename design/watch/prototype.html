<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watching Loomarr: The Cross, prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0C0E;--surface:#131519;--surface2:#1B1E24;--line:#2A2E37;--muted:#8B93A3;--text:#E7EAF0;--white:#fff;
--amber:#FFB020;--red:#E5484D;--cyan:#4CC9E8;--ink:11,12,14;
--d50:#E6CFA8;--d60:#F0A8B8;--d70:#C9E08A;--d80:#B9A6F2;--d90:#9DB4F5;--d00:#8FD3C8;
--num:56px;--title:28px;--meta:14px;--rn:16px;--rname:15px;--rnow:13px;--pad:48px;--colw:400px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050506;color:var(--text);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--amber);color:#0B0C0E}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* ----- outside the product: the prototype's own bar ----- */
#bar{height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;background:#050506;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
#bar b{color:var(--text);font-weight:500;margin-right:8px}
#bar button{height:28px;padding:0 10px;border-radius:6px;color:var(--muted)}
#bar button.on{background:var(--surface2);color:var(--text)}
#bar .sp{flex:1}
#wrap{position:absolute;inset:44px 0 0 0;display:grid;place-items:center;overflow:hidden}
#tasks{position:absolute;right:14px;top:58px;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;z-index:50}
#tasks h2{font-size:13px;font-weight:600;margin-bottom:8px}
#tasks li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--muted)}
#tasks li.done{color:var(--text)}
#tasks li.done::before{content:"";width:8px;height:8px;border-radius:50%;background:#3DD68C;margin-top:5px;flex:none}
#tasks li:not(.done)::before{content:"";width:8px;height:8px;border-radius:50%;border:1px solid var(--muted);margin-top:5px;flex:none}
#tasks li span:first-of-type{flex:1}
/* ----- the product ----- */
#stage{position:relative;background:var(--bg);overflow:hidden;width:100%;height:100%}
#stage.tv{width:960px;height:540px;transform-origin:center;cursor:none;--num:52px;--title:30px;--meta:15px;--rn:18px;--rname:16px;--rnow:13px;--pad:48px;--colw:372px}
#stage.phone{width:390px;height:844px;transform-origin:center;border-radius:44px;background:#000;--num:44px;--title:22px;--meta:13px;--rn:15px;--rname:15px;--rnow:13px;--pad:16px}
#stage.full{--num:64px;--title:34px;--meta:15px;--rn:20px;--rname:16px;--pad:64px;--colw:440px}
/* picture */
#pic{position:relative;overflow:hidden;background:#000;border-radius:6px}
#pic .art{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .12s}
#pic .wm{position:absolute;top:5%;right:5%;font-weight:600;letter-spacing:.08em;font-size:clamp(11px,1.6cqw,20px);color:rgba(231,234,240,.42);text-transform:uppercase}
#pic .snow{position:absolute;inset:0;background:url(static.webp) 0 0/256px;mix-blend-mode:screen;opacity:0;pointer-events:none}
#pic .dim{position:absolute;inset:0;background:rgba(var(--ink),.5);opacity:0;pointer-events:none;transition:opacity .12s}
#pic.tuning .snow{opacity:.24}#pic.tuning .dim{opacity:1}
#pic.cold .snow{opacity:.5}#pic.cold .dim{opacity:1;background:rgba(var(--ink),.8)}
#pic.paused .dim{opacity:1;background:rgba(var(--ink),.3)}
#pic .pm{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px;border-radius:50%;background:rgba(var(--ink),.72);display:none;place-items:center;color:#fff}
#pic.paused .pm{display:grid}
#pic .unmute{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;background:rgba(var(--ink),.94);font-size:13px;font-weight:500}
#pic .cover{position:absolute;inset:0;background:rgba(var(--ink),.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 24px}
@media (prefers-reduced-motion:reduce){#pic.tuning .snow,#pic.cold .snow{opacity:0}}
/* lower third */
.third{display:grid;grid-template-columns:auto 1fr auto;column-gap:20px;align-items:center;position:relative}
.third .n{font-size:var(--num);line-height:1;font-weight:500;letter-spacing:-.02em;min-width:1.2em;text-align:right;color:var(--white)}
.third .n.typing{color:var(--amber);border-bottom:3px solid currentColor;padding-bottom:4px}
.third h1{font-size:var(--title);line-height:1.12;font-weight:600;color:var(--white);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.third .meta,.third .next{font-size:var(--meta);color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.third em{font-style:normal;color:var(--text)}
.third .next b{font-weight:500;color:var(--text)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:8px;position:relative;top:-1px}
.back{color:var(--cyan)}
.golive{display:inline-flex;align-items:center;height:28px;margin-left:10px;padding:0 10px;border:1px solid var(--red);border-radius:6px;color:#E85A5F;font-weight:500;font-size:13px}
.bars{position:absolute;left:0;top:-14px;height:3px;width:0;background:linear-gradient(90deg,#FFB020 0 14.3%,#F5D90A 0 28.6%,#3DD68C 0 42.9%,#4CC9E8 0 57.2%,#D6409F 0 71.5%,#E5484D 0 85.8%,#8B93A3 0);background-size:var(--colw) 3px}
.bars.run{animation:bars .42s ease-out}
.bars.wait{width:100%;background:linear-gradient(90deg,#8B93A3 0 14.3%,#5A6170 0 28.6%,#8B93A3 0 42.9%,#5A6170 0 57.2%,#8B93A3 0 71.5%,#5A6170 0 85.8%,#8B93A3 0)}
@keyframes bars{0%{width:0;opacity:1}70%{width:100%;opacity:1}100%{width:100%;opacity:0}}
/* column */
.tabs{display:flex;align-items:center;gap:20px;font-size:14px;color:var(--muted);white-space:nowrap;min-height:36px}
.tabs button{height:30px;display:inline-flex;align-items:center;position:relative}
.tabs button.on{color:var(--text);font-weight:500}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:1px;background:var(--text)}
.find{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;color:var(--white);min-height:36px}
.find input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;color:inherit}
.find small{font-size:13px;font-weight:400;color:var(--muted)}
.row{display:grid;grid-template-columns:var(--numw,56px) 1fr auto;column-gap:20px;align-items:baseline;width:100%;padding:9px 12px 9px 0;border-radius:6px}
.row .n{font-size:var(--rn);color:var(--muted);text-align:right}
.row .name{font-size:var(--rname);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .now{font-size:var(--rnow);color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .left{font-size:12px;color:var(--muted)}
.row.hov,.row:hover{background:var(--surface2)}
.row.cur{background:var(--surface2)}
.row.tuned .name{color:var(--white);font-weight:600}
.row.tuned .left{color:var(--text)}
.above{display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;min-height:0}
/* strip */
.slabel{font-size:13px;color:var(--muted);min-height:36px;display:flex;align-items:center}
.slabel b{color:var(--text);font-weight:600;margin:0 4px}
.strip{display:flex;align-items:flex-start;gap:0;overflow:hidden;position:relative}
.blk{position:relative;flex:none;padding:3px;border-radius:9px;outline-offset:0}
.blk .still{height:var(--sh,84px);border-radius:6px;background-size:cover;background-position:center}
.blk .t{font-size:12px;color:var(--muted);margin-top:8px;white-space:nowrap}
.blk .ti{font-size:14px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk:hover .still{outline:2px solid var(--text);outline-offset:1px}
.blk.cur .still{outline:2px solid var(--amber);outline-offset:1px}
.blk .head{position:absolute;top:-3px;width:2px;height:calc(var(--sh,84px) + 12px);background:#fff}
.blk .head::before{content:"";position:absolute;left:-4px;top:-5px;width:10px;height:10px;border-radius:50%;background:#fff}
.spots{flex:none;display:flex;gap:2px;margin:3px 4px 0}
.spots i{width:6px;height:var(--sh,84px);border-radius:2px;background:rgba(231,234,240,.2)}
.strip::after{content:"";position:absolute;right:0;top:0;bottom:0;width:90px;background:linear-gradient(90deg,rgba(var(--ink),0),var(--fadeto,var(--bg)));pointer-events:none}
.info h2{font-size:17px;font-weight:600;color:var(--white)}
.info .f{font-size:12px;color:var(--muted);margin-top:4px}
.info p{font-size:14px;line-height:1.5;margin-top:8px;max-width:60ch}
/* keys */
#keys{display:flex;align-items:center;gap:8px}
#keys button{height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:0 8px;position:relative;font-size:14px}
#keys button.lab{padding:0 12px}
#keys button.on{background:var(--surface2)}
#keys button:hover{background:var(--surface2)}
#keys button.cur{outline:2px solid var(--amber);outline-offset:2px}
#keys .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#keys button[data-tip]:hover::after,#keys button[data-tip].cur::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(var(--ink),.96);padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.gctl{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:6px}
.gctl.on,.gctl:hover{background:var(--surface2)}
.home{display:inline-flex;align-items:center;gap:6px;height:36px;font-size:14px;padding-right:10px}
/* menus, sheets, hints */
.menu{position:absolute;background:var(--surface);border-radius:10px;padding:8px;width:280px;z-index:20}
.menu .h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:4px 6px 6px 12px}
.menu .h button{width:28px;height:28px;display:grid;place-items:center;border-radius:6px}
.menu .o{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:40px;padding:8px 12px;border-radius:6px;font-size:14px}
.menu .o:hover,.menu .o.cur{background:var(--surface2)}
.menu .o.cur{outline:2px solid var(--amber);outline-offset:-2px}
.menu .o small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.menu .o .v{color:var(--muted);font-size:13px}
.menu dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:6px 12px 10px;font-size:13px}
.menu dt{color:var(--muted)}.menu dd{text-align:right}
.hint{position:absolute;z-index:15;display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(var(--ink),.94);font-size:13px;color:var(--text)}
.hint kbd{font-family:"Geist Mono",monospace;font-size:12px;color:var(--white);font-weight:500}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;padding:8px 14px;border-radius:8px;background:rgba(var(--ink),.96);font-size:13px}
.btn{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;border:1px solid #666970;font-size:14px;font-weight:500}
.btn.pri{background:#fff;color:#0B0C0E;border-color:#fff}
body.tasks #wrap{right:278px}
/* ----- desktop in a window: the cross sits beside the picture ----- */
.window .over{display:none}
#stage.window{display:grid;grid-template-columns:var(--colw) 1fr;grid-template-rows:auto 1fr auto;column-gap:48px;padding:28px 48px 32px}
.window #colhead{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:6px}
.window #coltop{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0}
.window #colbot{grid-column:1;grid-row:3;padding-top:22px}
.window #picwrap{grid-column:2;grid-row:1/3;min-height:0;container-type:size;display:flex;align-items:flex-end}
.window #pic{width:min(100cqw,177.78cqh);height:min(100cqh,56.25cqw)}
.window #low{grid-column:2;grid-row:3;min-width:0}
.window .lowhead{display:flex;justify-content:space-between;align-items:center}
.window .info{min-height:92px;margin-top:14px}
.window .below{height:168px;overflow:hidden}
.window #colhead .top{display:flex;justify-content:space-between;align-items:center}
/* ----- full screen and television: the same cross, over the picture ----- */
#stage.full #picwrap,#stage.tv #picwrap{position:absolute;inset:0}
#stage.full #pic,#stage.tv #pic{position:absolute;inset:0;border-radius:0}
.over{position:absolute;inset:0;pointer-events:none;transition:opacity .12s}
.over.b{background:linear-gradient(0deg,rgba(var(--ink),.95) 0,rgba(var(--ink),.72) 24%,rgba(var(--ink),0) 46%)}
.over.l{background:linear-gradient(90deg,rgba(var(--ink),.96) 0,rgba(var(--ink),.92) 38%,rgba(var(--ink),0) 58%);opacity:0}
#stage.tv .over.l{background:linear-gradient(90deg,rgba(var(--ink),.96) 0,rgba(var(--ink),.92) 52%,rgba(var(--ink),0) 70%)}
.colopen .over.l{opacity:1}
#stage.full #col,#stage.tv #col{position:absolute;left:var(--pad);top:0;bottom:0;width:var(--colw);display:flex;flex-direction:column;--fadeto:rgba(11,12,14,.9)}
#stage.full #colhead,#stage.tv #colhead{padding-top:28px;display:flex;flex-direction:column;gap:14px}
#stage.tv #colhead .top{display:none}
#stage.full #coltop,#stage.tv #coltop{flex:1;display:flex;flex-direction:column;min-height:0}
#stage.full #colbot{padding:18px 0 150px}#stage.tv #colbot{padding:14px 0 86px}
#stage.full .below,#stage.tv .below{height:0;overflow:visible}
#stage.full .tabs,#stage.tv .tabs,#stage.full .find,#stage.tv .find,#stage.full .above,#stage.tv .above,#stage.full .below .row,#stage.tv .below .row{opacity:0;visibility:hidden;transition:opacity .12s}
.colopen .tabs,.colopen .find,.colopen .above,.colopen .below .row{opacity:1!important;visibility:visible!important}
#stage.full #low,#stage.tv #low{position:absolute;left:calc(var(--pad) + var(--colw) + 56px);right:0;bottom:0;height:300px;pointer-events:none}
#stage.tv #low{height:206px}
#stage.full .slabel,#stage.tv .slabel{display:none}
#stage.full .strip,#stage.tv .strip{position:absolute;left:0;right:0;top:0;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:auto;--fadeto:rgba(11,12,14,.92)}
.stripopen .strip{opacity:1!important;visibility:visible!important}
#stage.full .info,#stage.tv .info{position:absolute;left:0;bottom:calc(100% + 14px);width:440px;background:rgba(var(--ink),.94);padding:12px 14px;border-radius:8px;display:none}
.stripopen .info.has{display:block!important}
#stage.full #keys,#stage.tv #keys{position:absolute;right:var(--pad);bottom:40px;pointer-events:auto}
#stage.tv #keys{bottom:32px}#stage.tv{--sh:68px}
#stage.full #colhead .gctl{display:none}
.idle #col,.idle #low,.idle .over,.idle #keys{opacity:0;transition:opacity .2s}
#stage.idle{cursor:none}
#stage.tv .hint{left:calc(var(--pad) + 80px);bottom:36px}
#stage.full .hint{left:calc(var(--pad) + 96px);bottom:48px}
.window .hint{left:48px;bottom:8px}
/* ----- phone, upright ----- */
#stage.phone{display:flex;flex-direction:column}
.phone .island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:40}
.phone #ptop{height:104px;padding:55px 8px 0;display:flex;justify-content:space-between;align-items:center}
.phone #ptop button{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:14px}
.phone #pic{width:390px;height:219px;border-radius:0;flex:none}
.phone .third{padding:18px 8px 6px 16px;column-gap:14px}
.phone .third .act{display:flex}.phone .third .act button{width:44px;height:44px;display:grid;place-items:center}
.phone .pstrip{padding:6px 0 0 16px;--sh:52px;--fadeto:#000}
.phone .ptabs{display:flex;align-items:center;padding:0 10px 0 16px;gap:8px}
.phone .ptabs .tabs{flex:1;overflow:hidden;min-height:44px;gap:18px;mask-image:linear-gradient(90deg,#000 80%,transparent)}
.phone .tabs button,.phone .gctl{height:44px}
.phone #plist{flex:1;overflow:auto;padding:0 16px 40px;scrollbar-width:none;--numw:28px}
.phone .row{padding:10px 0;min-height:56px;column-gap:14px}
.phone .hint{left:16px;right:16px;bottom:44px;justify-content:center}
.phone .menu{left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0;padding:10px 12px 40px}
.phone .menu .o{min-height:44px}
.phone .homeind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(231,234,240,.8);z-index:40}
/* ----- the Guide: every channel's day on one clock ----- */
#guide{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;padding:28px var(--pad) 0;z-index:10}
.vguide #guide{display:flex}
#guide .ghead{display:flex;gap:32px;min-height:0}
#guide .gleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
#guide .gdock{flex:none;width:min(400px,30%);aspect-ratio:16/9}
#guide .gsyn{font-size:14px;line-height:1.5;color:var(--text);max-width:60ch;min-height:42px}
#guide .gbar{display:flex;align-items:center;gap:24px;margin-top:6px}
#guide .gbar .day{display:flex;align-items:center;gap:8px;font-size:14px}
#guide .ruler{position:relative;height:26px;margin:14px 0 0 var(--gl)}
#guide .ruler span{position:absolute;top:4px;font-size:12px;color:var(--muted)}
#guide .ruler .nowtag{top:1px;font-size:12px;background:var(--red);color:#0B0C0E;font-weight:500;border-radius:3px;padding:2px 6px;transform:translateX(-50%)}
#guide .grows{position:relative;flex:1;overflow:auto;scrollbar-width:none;padding-bottom:28px}
#guide .grow{display:grid;grid-template-columns:var(--gl) 1fr;align-items:center;margin-bottom:5px}
#guide .glab{display:grid;grid-template-columns:44px 1fr;column-gap:16px;align-items:baseline;padding-right:14px;width:100%}
#guide .glab .n{text-align:right;color:var(--muted);font-size:15px}
#guide .glab .nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#guide .grow.tuned .glab .n{font-size:26px;font-weight:500}#guide .grow.tuned .glab .nm{color:#fff;font-weight:600}
#guide .track{position:relative;height:36px}
#guide .grow.tuned .track{height:76px}
#guide .gb{position:absolute;top:0;bottom:0;border-radius:4px;overflow:hidden;font-size:13px;font-weight:500;white-space:nowrap;display:flex;align-items:center;background:var(--surface)}
#guide .gb .tx{padding:0 10px;overflow:hidden;text-overflow:ellipsis;position:relative}
#guide .gb .tx .tm{font-weight:400;font-size:12px;color:var(--muted);margin-right:8px}
#guide .gb.on{color:#fff;font-weight:600;background-size:cover;background-position:center}
#guide .gb.on::before,#guide .grow.tuned .gb::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(var(--ink),.68),rgba(var(--ink),.46))}
#guide .gb .aired{position:absolute;left:0;top:0;bottom:0;background:rgba(var(--ink),.62)}
#guide .grow.tuned .gb{align-items:flex-end;background-size:cover;background-position:center;color:#fff}
#guide .grow.tuned .gb .tx{padding-bottom:8px}
#guide .grow.tuned .gb .tx .tm{display:block;color:rgba(231,234,240,.78);font-size:12px}
#guide .gb:hover{outline:2px solid var(--text);outline-offset:1px}
#guide .gb.cur{outline:2px solid var(--amber);outline-offset:1px}
#guide .tick{position:absolute;top:30%;height:40%;width:2px;border-radius:1px;background:rgba(231,234,240,.4)}
#guide .nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--red);pointer-events:none;z-index:2}
#stage.tv #guide{--gl:214px;padding-top:27px}#stage.full #guide,#stage.window #guide{--gl:264px}
.phone #guide{position:static;display:none;padding:0 16px;flex:1;min-height:0;--gl:0px;background:#000}
.phone.vguide #guide{display:flex}.phone.vguide #plist,.phone.vguide .pstrip{display:none}
.phone #guide .ghead,.phone #guide .gbar .tabs{display:none}
.phone #guide .grow{grid-template-columns:1fr;margin-bottom:12px}
.phone #guide .glab{grid-template-columns:auto 1fr;column-gap:8px;padding:0 8px 4px 0;font-size:13px;position:relative;z-index:3;background:#000;width:max-content;max-width:100%}
.phone #guide .glab .n,.phone #guide .grow.tuned .glab .n{font-size:13px}
.phone #guide .grow.tuned .track{height:54px}
/* ----- the wall: Home ----- */
#wall{position:absolute;inset:0;background:var(--bg);display:none;padding:36px var(--pad);overflow:auto;z-index:12}
.vwall #wall{display:block}
#wall .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:18px}
.phone #wall{padding:70px 16px 40px}.phone #wall .tiles{grid-template-columns:1fr 1fr;gap:12px}
#wall .tile{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background-size:cover;background-position:center;display:block;width:100%}
#wall .tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(var(--ink),.94),rgba(var(--ink),0) 62%),linear-gradient(180deg,rgba(var(--ink),.8),rgba(var(--ink),0) 46%)}
#wall .tile>*{position:absolute;z-index:1}
#wall .tile .n{left:14px;top:12px;font-size:20px;font-weight:500}
#wall .tile .lf{right:14px;top:15px;font-size:12px}
#wall .tile .cap{left:14px;right:14px;bottom:12px}
#wall .tile .nm{font-size:12px;color:var(--muted)}
#wall .tile .ti{font-size:15px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wall .tile.here{outline:2px solid var(--text);outline-offset:3px}
#wall h2{font-size:20px;font-weight:600}

<script>

const FACTS = {

};
const facts = t => FACTS[t] ?? ['TV-PG · From the household library', 'A title from the household library.'];
const art = t => t === 'The Diner Years' ? 'url(picture.webp)' : `linear-gradient(120deg,${ART[t] ?? '#2A2E37,#131519'})`;
const ORDER = Object.keys(CH).map(Number).sort((a, b) => a - b);
const before = (n, k) => ORDER.slice(0, ORDER.indexOf(n)).reverse().slice(0, k);
const after = (n, k) => ORDER.slice(ORDER.indexOf(n) + 1).slice(0, k);
const dec = n => `var(--d${CH[n][1]})`;
const clock = (m, ap = true) => { m = Math.round(m); const h = 10 + Math.floor(m / 60), mm = String(((m % 60) + 60) % 60).padStart(2, '0'); return `${h > 12 ? h - 12 : h}:${mm}${ap ? (h >= 12 ? ' PM' : ' AM') : ''}`; };

// ----- state -----
const t0 = Date.now();
const now = () => 20 + (Date.now() - t0) / 60000;
const S = { mode: 'window', view: 'watch', T: 7, last: null, col: false, strip: false, sb: null, kf: null, hov: null, hb: null, paused: false, behind: 0, pausedAt: 0,
  muted: true, menu: null, mi: 0, find: null, fi: 0, digits: '', idle: false, cold: true, cc: 'English', gcur: null, toast: '', hinted: {}, tab: 'All 34' };
const DONE = {}; let started = Date.now();
const done = k => { if (!DONE[k]) { DONE[k] = ((Date.now() - started) / 1000).toFixed(0); renderTasks(); } };
const overlay = () => S.mode === 'full' || S.mode === 'tv';
const stage = document.getElementById('stage'), live = document.getElementById('live');
const cur = n => { const s = SCHED[n], t = now(); let i = s.findIndex(b => b[0] <= t && b[1] > t); if (i >= 0) return {i, b: s[i], on: true}; i = s.findIndex(b => b[0] > t); return {i, b: s[i], on: false}; };
const leftOf = n => { const c = cur(n), t = now(); return c.on ? `${Math.max(1, Math.ceil(c.b[1] - t))} min left` : 'in a break'; };
const say = t => { live.textContent = t; };

// ----- pieces -----
const thirdHTML = () => {
  const typing = S.digits !== '', n = typing ? S.digits : S.T, target = typing ? ORDER.find(x => String(x) === S.digits) : S.T;
  const c = target ? cur(target) : null, t = now();
  let title, meta, next = '';
  if (typing) { title = target ? CH[target][0] : 'No such channel'; meta = target ? `${c.b[2]} · <em>press Enter, or wait</em>` : `There is no channel ${S.digits}`; }
  else if (S.cold) { title = CH[S.T][0]; meta = 'Tuning in… <em>Starting the channel</em>'; }
  else {
    title = c.b[2];
    // On a phone the line is short, so the rating waits in the programme's facts.
    const where = S.mode === 'phone' ? `<em>${CH[S.T][0]}</em>` : `<em>${CH[S.T][0]}</em> · TV-PG`;
    if (S.paused) meta = `${where} · <em>Paused</em>`;
    else if (S.behind > 0) meta = `${where} · ${S.behind} s behind<button class="golive" data-act="live"><span class="dot" style="top:0"></span>Go live</button>`;
    else if (!c.on) meta = `<em>${CH[S.T][0]}</em> · <span class="back">Back in ${Math.max(1, Math.ceil(c.b[0] - t))} min</span>`;

  return `<div class="bars${S.cold ? ' wait' : ''}" id="bars"></div><span class="n mono${typing ? ' typing' : ''}" style="${typing ? '' : `color:${dec(S.T)}`}">${n}</span>

const rowHTML = (n, cls = '') => `<button class="row ${cls}" data-n="${n}" role="option" aria-label="Channel ${n}, ${CH[n][0]}, ${cur(n).b[2]}">
  <span class="n mono"${cls.includes('tuned') ? ` style="color:${dec(n)}"` : ''}>${n}</span>
  <div style="min-width:0"><div class="name">${CH[n][0]}</div><div class="now">${cur(n).b[2]}${cur(n).on ? '' : ' · in a break'}</div></div>

const results = () => { const q = (S.find ?? '').trim().toLowerCase(); return q ? ORDER.filter(n => CH[n][0].toLowerCase().includes(q) || cur(n).b[2].toLowerCase().includes(q)) : []; };
const tabsHTML = () => S.find != null
  ? `<div class="find">${ic('search', 18)}<input id="q" value="${S.find.replace(/"/g, '&quot;')}" placeholder="Find a channel or a programme…" aria-label="Find a channel or a programme"><small>${S.find ? results().length + ' found' : ''}</small><button data-act="findclose" aria-label="Close find">${ic('x', 18)}</button></div>`

const stripHTML = n => {
  const c = cur(n), s = SCHED[n].slice(c.i, c.i + 5), t = now(); let h = '', prev = null;

    prev = b[1];
    const w = Math.max(150, Math.min(330, (b[1] - Math.max(b[0], t - 20)) * 3.1)), on = i === 0 && c.on, k = S.sb === i ? ' cur' : '';

  });
  return h;

const infoHTML = () => {
  const n = S.hov ?? S.T, c = cur(n), b = S.hb != null ? SCHED[n][c.i + S.hb] : (S.sb != null ? SCHED[n][c.i + S.sb] : null);
  if (b && b !== c.b) return `<h2>${b[2]}</h2><div class="f mono">${clock(b[0])} to ${clock(b[1])} · ${facts(b[2])[0]}</div><p>${facts(b[2])[1]}</p>`;
  if (S.hov) return `<h2>${c.b[2]}</h2><div class="f mono">On now until ${clock(c.b[1])} · ${facts(c.b[2])[0]}</div><p>${facts(c.b[2])[1]}</p>`;
  return `<div class="f mono" style="margin-top:0">${facts(c.b[2])[0]}</div><p>${facts(c.b[2])[1]}</p>`;

const KEYS = { window: ['pause', 'cc', 'audio', 'vol', 'full', 'more'], full: ['channels', 'guide', 'pause', 'cc', 'audio', 'vol', 'full', 'more'], tv: ['channels', 'guide', 'cc', 'audio', 'more'], phone: [] };
const TIP = { pause: 'Pause (Space)', cc: 'Subtitles (C)', audio: 'Audio (A)', vol: 'Mute (M)', full: 'Full screen (F)', more: 'More' };
const keysHTML = () => KEYS[S.mode].map((k, i) => {
  const f = S.kf === i ? ' cur' : '';
  if (k === 'channels') return `<button class="lab${S.col ? ' on' : ''}${f}" data-act="channels">${ic('list', 18)}Channels</button>`;
  if (k === 'guide') return `<button class="lab${f}" data-act="guide">${ic('guide', 18)}Guide</button><i class="sep"></i>`;
  const icon = k === 'pause' && S.paused ? 'play' : k === 'vol' && S.muted ? 'mute' : k;
  const tip = k === 'pause' && S.paused ? 'Play (Space)' : k === 'vol' && S.muted ? 'Unmute (M)' : k === 'full' && S.mode === 'full' ? 'Leave full screen (F)' : TIP[k];
  return `<button class="${S.menu === k ? 'on' : ''}${f}" data-act="${k}" data-tip="${tip}" aria-label="${tip}">${ic(icon, 20)}</button>`;

// The drawn diner still already carries its channel's watermark; every other stand-in gets one drawn.
const picHTML = () => { const c = cur(S.T); return `<div class="art" style="background-image:${art(c.b[2])}"></div>${c.b[2] === 'The Diner Years' ? '' : `<div class="wm">${CH[S.T][0]}</div>`}<div class="dim"></div><div class="snow"></div>
  <div class="pm">${ic('pause', 30)}</div>${S.muted && !S.cold && S.mode !== 'tv' ? `<button class="unmute" data-act="vol">${ic('mute', 18)}${S.mode === 'phone' ? 'Tap' : 'Click'} to unmute</button>` : ''}`; };
const MENUS = {
  cc: () => ['Subtitles', ['Off', 'English', 'English, with sounds', 'Spanish'].map(o => ({l: o, s: o === 'English, with sounds' ? 'For the deaf and hard of hearing' : '', sel: S.cc === o, go: () => { S.cc = o; S.menu = null; toast(o === 'Off' ? 'Subtitles off' : `Subtitles: ${o}`); }}))],

    {l: 'Playback details', go: () => { S.menu = 'details'; }},
    {l: 'Keyboard shortcuts', go: () => { S.menu = 'keys'; }},
    {l: 'Manage this channel', go: () => { S.menu = null; toast('Channel management opens here (not in this prototype)'); }}]],
  details: () => ['Playback details', [], `<dl><dt>Resolution</dt><dd class="mono">1920×1080 · 29.97 fps</dd><dt>Video</dt><dd class="mono">H.264 High 4.1</dd><dt>Audio</dt><dd class="mono">AAC stereo</dd><dt>Buffer ahead</dt><dd class="mono">6.2 s</dd><dt>Behind live</dt><dd class="mono">${S.behind} s</dd></dl>`],
  keys: () => ['Keyboard shortcuts', [], `<dl><dt>Up, Down</dt><dd>Change channel</dd><dt>Left, Right</dt><dd>Later today</dd><dt>0 to 9</dt><dd>Tune by number</dd><dt>/</dt><dd>Find by name</dd><dt>G</dt><dd>Guide</dd><dt>Space</dt><dd>Pause</dd><dt>L</dt><dd>Last channel</dd><dt>C, A, M</dt><dd>Subtitles, audio, mute</dd><dt>F</dt><dd>Full screen</dd><dt>Esc</dt><dd>Close, then back</dd></dl>`]
};
const menuHTML = () => { if (!S.menu) return ''; const [h, opts, body = ''] = MENUS[S.menu]();
  const pos = S.mode === 'phone' ? '' : S.mode === 'window' ? 'right:48px;bottom:calc(var(--mb,330px))' : 'right:var(--pad);bottom:96px';
  return `<div class="menu" role="dialog" aria-label="${h}" style="${pos}"><div class="h">${h}<button data-act="menuclose" aria-label="Close">${ic('x', 16)}</button></div>
    ${opts.map((o, i) => `<button class="o${S.mi === i ? ' cur' : ''}" data-mi="${i}"><span>${o.l}${o.s ? `<small>${o.s}</small>` : ''}</span>${o.v ? `<span class="v">${o.v}</span>` : o.sel ? ic('check', 18) : ''}</button>`).join('')}${body}</div>`; };
const HINT = { window: 'Click a channel to change it, or press <kbd>Up</kbd> and <kbd>Down</kbd>', full: '<kbd>Channels</kbd> opens the list. <kbd>Up</kbd> and <kbd>Down</kbd> change channel', tv: '<kbd>Up Down</kbd> change channel · <kbd>Left Right</kbd> controls', phone: 'Tap a channel to change it. Tap yours to see today' };
const hintHTML = () => S.hinted[S.mode] || S.cold || S.view !== 'watch' ? '' : `<div class="hint" role="note">${HINT[S.mode]}</div>`;

// ----- views -----
const guideHTML = () => {
  const phone = S.mode === 'phone', span = phone ? 90 : S.mode === 'tv' ? 120 : 180, t = now(), c = cur(S.T), g = S.gcur, gb = g ? SCHED[g[0]][g[1]] : null;
  const rows = ORDER.map(n => {
    const tuned = n === S.T; let h = '', prev = null;
    SCHED[n].forEach((b, j) => {
      const s = Math.max(0, b[0]), e = Math.min(span, b[1]);
