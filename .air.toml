# Air (github.com/air-verse/air) — dev-only live reload for the Loomarr backend.
# Watches Go sources under cmd/ + internal/, rebuilds cmd/loomarr on change, and
# restarts the running binary. Not a build/runtime dependency (§14): a dev tool, the
# Go analogue of Vite's HMR — never imported, never shipped. Run from the repo root:
#
#   make dev-be     (installs Air on first use, then watches)
#
# The FE has its own Vite dev server (pnpm --filter @loomarr/web dev); Air only owns
# the Go backend, so web/ is excluded to avoid pointless rebuilds on .ts edits.
#
# ⚠ full_bin SOURCES .env rather than setting variables inline. The binary does not read
# .env itself — it expects the shell to have exported it — so an inline DATABASE_URL is
# not "the same as the manual launch": it is a DIFFERENT, EMPTY instance with no media
# server, no Tunarr, and no LLM, on the same port. That reads as data loss until you work
# out it is pointing at another database. One source of truth: .env.

root = "."
tmp_dir = "tmp"

[build]
  # Build the dev binary into tmp/ (git-ignored). CGO off — the store uses modernc
  # (pure-Go sqlite), so no C toolchain is needed for the dev build.
  cmd = "go build -o ./tmp/loomarr-dev ./cmd/loomarr"
  entrypoint = ["./tmp/loomarr-dev"]
  # Source shared credentials first, then re-apply the worktree isolation resolved by
  # scripts/dev-env.sh. This prevents a copied .env from putting two agents back on :8080 or
  # the same SQLite file. A missing .env remains supported.
  full_bin = "sh -c 'set -a; [ -f .env ] && . ./.env; [ -n \"${LOOMARR_DEV_PORT:-}\" ] && LISTEN_ADDR=\":${LOOMARR_DEV_PORT}\"; [ -n \"${LOOMARR_AGENT_DATABASE_URL:-}\" ] && DATABASE_URL=\"${LOOMARR_AGENT_DATABASE_URL}\"; [ -n \"${LOOMARR_AGENT_FILLER_DIR:-}\" ] && FILLER_DIR=\"${LOOMARR_AGENT_FILLER_DIR}\"; [ -n \"${LOOMARR_AGENT_PREPARED_DIR:-}\" ] && PLAYOUT_PREPARED_DIR=\"${LOOMARR_AGENT_PREPARED_DIR}\"; [ -n \"${LOOMARR_AGENT_DEV_LOGIN:-}\" ] && LOOMARR_DEV_LOGIN=\"${LOOMARR_AGENT_DEV_LOGIN}\"; set +a; exec ./tmp/loomarr-dev'"
  # Rebuild only on backend Go source changes.
  include_ext = ["go"]
  exclude_dir = ["web", "tmp", "docs", "design", "node_modules", ".git", "internal/testkit/fixtures"]
  exclude_regex = ["_test\\.go"]
  # Don't restart on an in-progress rebuild; give the compile a moment to settle.
  delay = 400
  # ⚠ stop_on_error MUST be false. `true` makes Air STOP WATCHING after any failed build — so a
  # single transient compile error from a mid-refactor save wedges Air permanently: it holds the
  # last-good binary and ignores every later save, INCLUDING the one that fixes the error. That is
  # the "my fix didn't take for a week" bug (a fresh single Air, not a duplicate — the guard cannot
  # catch it). With `false`, a failed build keeps the previous binary running AND keeps watching, so
  # the moment the code compiles again Air rebuilds and swaps. `build-errors.log` records the failure
  # either way; you just don't lose the watcher over it.
  stop_on_error = false
  # Send SIGINT so the server's graceful shutdown (context cancel) runs before restart.
  send_interrupt = true
  kill_delay = "2s"
  # ⚠ poll = true — do NOT rely on inotify here. The repo is on btrfs, and Air's inotify watcher
  # silently fails to deliver events on some Linux/filesystem/editor combinations (atomic-save-via-
  # rename, overlay/btrfs subvolumes), leaving Air alive but never rebuilding on save — the same
  # stale-binary symptom as stop_on_error. Polling re-scans file mtimes on an interval instead, which
  # works on every filesystem. Slightly less instant than inotify; correctness beats the ~500ms.
  poll = true
  poll_interval = 500

[log]
  time = true

[misc]
  # Leave the last-built binary in place on exit for quick manual runs.
  clean_on_exit = false
