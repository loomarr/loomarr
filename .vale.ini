# Prose linting for the reader-facing documentation.
#
# ⚠ NO STOCK STYLE PACKAGE IS ENABLED — not Microsoft, not Google, not write-good. They are
# good packages and the wrong tool here: across this repo's prose they produce findings in the
# hundreds (passive voice, sentence length, "simply"), which buries the handful that are real.
# A gate whose output gets skimmed has stopped being a gate.
#
# What IS enforced is this project's own vocabulary — the terms CONTEXT.md defines and that
# reviewers have had to correct by hand. That list is short, objective, and cannot be argued
# with, which is what makes it worth automating.

StylesPath = .vale
MinAlertLevel = warning

# Only the set a user or contributor reads. design.md, PROGRESS.md and docs/engineering/ are
# internal long-form records — see the same reasoning in .markdownlint-cli2.jsonc.
[*.md]
BasedOnStyles = Loomarr

# The generated command reference takes its words from the Makefile; a finding here would be
# unfixable without editing generated output.
[docs/dev/commands.md]
BasedOnStyles =
