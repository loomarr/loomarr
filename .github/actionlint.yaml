# GitHub introduced these hosted labels after actionlint v1.7.12's built-in runner
# list. Declaring them here preserves strict label checking for every other workflow
# value until actionlint publishes an updated list.
self-hosted-runner:
  labels:
    - macos-26
    - xcode-27
    - loomarr-playout-arc
    - loomarr-playout-geforce

# actionlint v1.7.12 predates the job-level cache-mode key (rhysd/actionlint#762). The ignore
# covers only that one message in the one workflow that declares the key; release-verify pins its
# value.
paths:
  .github/workflows/android-ccache-promotion.yml:
    ignore:
      - 'unexpected key "cache-mode" for "job" section'
