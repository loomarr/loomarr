version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  # The web workspace uses pnpm; Dependabot reads pnpm-lock.yaml under npm.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      expo-sdk-57-native:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/config-plugins"
          - "expo-doctor"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-reanimated"
          - "react-native-worklets"
          - "react-native-safe-area-context"
          - "react-native-screens"
          - "react-native-svg"
          - "react-native-web"
        update-types:
          - minor
          - patch
      typescript-toolchain:
        patterns:
          - "typescript"
        update-types:
          - major
          - minor
          - patch
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
        update-types:
          - minor
          - patch
      routine-web:
        patterns: ["*"]
        exclude-patterns:
          - "expo"
          - "expo-*"
          - "@expo/config-plugins"
          - "expo-doctor"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-reanimated"
          - "react-native-worklets"
          - "react-native-safe-area-context"
          - "react-native-screens"
          - "react-native-svg"
          - "react-native-web"
          - "typescript"
          - "vite"
          - "@vitejs/plugin-react"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/config-plugins"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-doctor"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-svg"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directories:
      - /
      - /rust/loomarr-image/fuzz
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 2
    groups:
      rust-image:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
