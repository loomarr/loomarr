name: CI / Expo Android mobile — native build

on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  run:
    name: Expo Android mobile — native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: make fe-install
      - name: Install pinned ccache
        id: ccache
        run: web/scripts/install-android-ccache.sh "${RUNNER_TEMP}/loomarr-android-ccache-tool"
      - name: Restore ccache compiler results
        id: ccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/loomarr-android-ccache
          key: android-mobile-ccache-v1-${{ runner.os }}-ccache-4.14-${{ hashFiles('web/apps/mobile/**', 'web/packages/**', 'web/pnpm-lock.yaml', 'web/scripts/**') }}-${{ github.run_id }}
          restore-keys: |
            android-mobile-ccache-v1-${{ runner.os }}-ccache-4.14-${{ hashFiles('web/apps/mobile/**', 'web/packages/**', 'web/pnpm-lock.yaml', 'web/scripts/**') }}-
            android-mobile-ccache-v1-${{ runner.os }}-ccache-4.14-
      # Read-only: reuse the newest Android TV Gradle generation this ref can see (the same pinned
      # React Native TV, Gradle, and plugin builds) instead of spending another ~1.3 GB cache entry.
      - name: Restore the Android TV Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-tv-react-native-v1-${{ runner.os }}-temurin-21-node-${{ env.NODE_VERSION }}-
      - name: Generate and build the standalone mobile APK
        run: make client-android-debug CLIENT_APP=mobile
        env:
          CCACHE_DIR: ${{ runner.temp }}/loomarr-android-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 2G
          CCACHE_SLOPPINESS: ""
          LOOMARR_ANDROID_CCACHE_LAUNCHER: ${{ steps.ccache.outputs.launcher }}
          LOOMARR_ANDROID_GRADLE_WORKERS: "2"
          LOOMARR_ANDROID_NATIVE_JOBS: "4"
          LOOMARR_ANDROID_METRO_WORKERS: "4"
          LOOMARR_ANDROID_GRADLE_HEAP: 3g
          LOOMARR_ANDROID_MEMORY_HIGH: 11G
          LOOMARR_ANDROID_MEMORY_MAX: 12G
      - name: Save ccache for later pull-request revisions
        if: github.event_name == 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/loomarr-android-ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}
      - name: Keep the standalone mobile APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: expo-android-mobile
          path: web/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
