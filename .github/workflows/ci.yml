# CI — mirrors the harness contract (CLAUDE.md / design §16):
# check + openapi-verify + config-docs-verify + test-pg + fe + e2e/visual.
# Every gate here is a `make` target so local and CI never diverge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # Which trees moved. Everything else gates on this, so a docs-only PR costs one ~5s job
  # instead of ~14 runner-minutes verifying code nobody touched.
  #
  # ⚠ Filtering happens PER JOB, never with a workflow-level `paths:`. A workflow that does
  # not trigger reports no checks at all, so a required check sits "expected" forever and the
  # PR cannot merge. This way the run always happens; individual jobs skip.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the merge base to diff against
      # Plain git rather than a third-party action: this is ~15 lines of shell, and a
      # marketplace action here would be a new dependency (CLAUDE.md §5) whose whole job is
      # `git diff --name-only`. It also fails SAFE — any error, or an unresolvable base,
      # falls through to running everything.
      - name: Which trees moved
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail
          # No usable base (first push, force-push, a new branch): run everything. Skipping
          # because we could not work out what changed would be the wrong failure direction.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ($BASE) — running every job"
            { echo "go=true"; echo "web=true"; echo "image=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "changed files:"; echo "$changed"

          # Makefile and this workflow gate BOTH: they define how every job runs, so a change
          # to either has to be proven against everything.
          #
          # ⚠ `scripts/` is here because the Go job RUNS scripts from it — `make retired-verify`
          # is `./scripts/check-retired.sh`, and `make tags-verify` is `./scripts/check-tags.sh`.
          # Without it a PR that edited only a guard script skipped the one job that executes
          # it, so a broken guard merged unproven. `docs/help/` was already listed for being
          # retired-verify's INPUT; the script itself was the gap — the guard was covered
          # against the thing it reads but not against itself.
          if echo "$changed" | grep -qE '\.go$|^go\.(mod|sum)$|^internal/store/migrations/|^docs/help/|^scripts/|^Makefile$|^\.github/workflows/'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^web/|^Makefile$|^\.github/workflows/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          # The IMAGE. Added after a Dockerfile change that could never have built for
          # arm64 sat undetected: `intel-media-va-driver` has no arm64 candidate, so apt
          # exited 100 — and release.yml builds linux/amd64,linux/arm64. Nothing caught it
          # because the image was built ONLY at release time, on a v* tag, which is the
          # worst moment to discover the build is broken.
          #
          # ⚠ On a PR this diffs against the MERGE BASE, not the previous push, so the
          # question is "did this PR touch the Dockerfile", not "did the last commit".
          # A PR that changed it in commit 1 keeps building the image for every later
          # push, which is correct — skipping would leave the PR's own change unproven.
          #
          # ⚠ DELIBERATELY NARROWER THAN THE go/web FILTERS ABOVE — the only one that does
          # NOT gate on `Makefile` or `.github/workflows/`. Those two are edited often and
          # neither changes what `docker build` produces, while this job costs ~30 min of
          # billed CI because the arm64 half is QEMU-emulated. Gating it on them would
          # spend that on every workflow tweak. The rule for the others ("they define how
          # every job runs, so prove them against everything") does not apply to a job
          # whose only input is the Dockerfile itself.
          if echo "$changed" | grep -qE '^Dockerfile$|^\.dockerignore$'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  go:
    name: Go — check + spec/config drift
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # ⚠ DELIBERATELY OFF — the step below owns every Go cache path in this job.
          # `cache: true` caches `~/go/pkg/mod` AND `~/.cache/go-build` keyed on go.sum,
          # which is the SAME `~/.cache/go-build` the unified cache rolls. Both on meant
          # restoring it twice and, whenever go.sum moved, SAVING it twice: measured
          # 2026-08-09, `Post Cache golangci` 83s ran alongside `Post Run actions/setup-go`
          # 91s in one job. Worse, setup-go's half is keyed on go.sum alone — exactly the
          # frozen-key bug the note below exists to prevent — so it re-froze a slice of the
          # very cache the rolling key was added to keep fresh.
          cache: false
      # ONE cache for the whole Go toolchain: module downloads, build objects, and
      # golangci's analysis cache. `make lint` runs golangci-lint via `go run …@v2.12.2`,
      # whose dependencies are NOT in go.sum, so nothing keyed on go.sum alone ever covers
      # them (visible in the logs as `go: downloading lipgloss / fatih-color / gofrs-flock`)
      # — that is why the linter's module dir rides along here rather than in its own entry.
      #
      # ⚠ THE KEY MUST BE UNIQUE PER RUN, and this is not a style choice. `actions/cache`
      # NEVER overwrites an existing key — it skips the save when the key already hit. This
      # path holds `~/.cache/go-build`, whose contents track `.go` SOURCE, but the key used
      # to be `hashFiles('go.sum')`: so the entry was written once and then frozen while the
      # source moved under it. Measured — one 473MB entry created 2026-07-31T01:06 was still
      # being restored days and many source changes later, so `go test -race` recompiled
      # nearly everything on every run (~224s of the job). `github.run_id` guarantees a miss
      # on the exact key so the save always happens, while `restore-keys` still restores the
      # newest prior cache to compile against.
      #
      # ⚠ AND A ROLLING KEY MUST BE BOUNDED — the other half of the same trade, and the
      # failure mode the fix above created. A stable key never re-SAVES; a rolling key never
      # PRUNES. Neither actions/cache mode evicts anything, so this entry grew purely by
      # accretion: every run restored the previous one, added to it, and saved the union.
      # Measured 2026-08-09 it had reached **1.36 GB**, costing 85s to restore (74s of that
      # spent EXTRACTING, not downloading) plus 83–122s to save — ~168s of a ~10 min job
      # spent moving a tarball before a single test ran.
      #
      # The ISO week in the key is the bound. It rotates on its own, so there is no number
      # for anyone to remember to bump — this repo has been bitten repeatedly by
      # hand-maintained lists that drift — and it costs exactly one cold build per week. It
      # is in the restore-keys prefixes too, deliberately: a prefix that outlived the epoch
      # would restore the very accumulation the epoch exists to drop.
      - name: Cache epoch (bounds rolling-cache growth)
        id: epoch
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Go caches (modules + build + golangci)
        id: gocache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ steps.epoch.outputs.week }}-v2.12.2-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.epoch.outputs.week }}-v2.12.2-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ steps.epoch.outputs.week }}-v2.12.2-
      # ⚠ ffmpeg is NOT on the runner image, and several filler tests skip without it — the
      # language gate's span extraction (16kHz mono WAV, the shape whisper requires), the
      # silence guard, artwork rendering and the clip scan's probe. Measured on this runner
      # before adding this step: `ffmpeg: MISSING`, and the three `TestExtractSpanWAV_*`
      # tests reported SKIP while the job stayed green.
      #
      # A skip is visible in the log, so this was never a silent hole — but it did mean CI
      # could not catch a broken `-ar 16000`, which is exactly the flag those tests exist to
      # pin. The two backends carried byte-identical copies of that invocation with nothing
      # asserting it, so the gap was worth closing rather than documenting.
      #
      # ⚠ `ffmpeg` alone pulls `ffprobe` (same Debian source package), and both are needed:
      # the tests assert what the extracted file IS by probing it, not merely that ffmpeg
      # exited 0. `--no-install-recommends` keeps the codec/doc tail off a runner that only
      # has to decode and re-encode small synthetic WAVs.
      #
      # ⚠ The DEBS are cached, not the installed binaries. Copying `/usr/bin/ffmpeg` back into
      # place would leave its shared libraries behind — ffmpeg links a large tree (libav*,
      # libx264, …) spread across /usr/lib, so a binary-only cache produces a file that exists
      # and cannot run. Caching the .debs and letting apt install them keeps the package
      # manager's own dependency handling and skips only the download, which is the slow part.
      #
      # ⚠ Cache what APT ITSELF decides to fetch on THIS runner (~62.8 MB), not a computed
      # dependency closure. Measured while writing this: `apt-cache depends --recurse` over
      # ffmpeg resolves 298 packages / 244 MB, because the closure includes base packages the
      # runner image already has installed. Caching that would spend 244 MB of a 10GB repo-wide
      # budget to save 38 seconds — worse than no cache at all. `-d` into the apt archive dir
      # asks apt for the actual delta against what is already there.
      #
      # ⚠ A STABLE key, deliberately NOT the rolling `github.run_id` pattern the golangci and
      # gobuild caches above use. Those cache contents track something their key does not
      # (`~/.cache/go-build` tracks .go SOURCE), so they must re-save every run. This one's
      # contents are fully determined by the key — a fixed package set at a runner image
      # version — exactly like the pnpm caches, which are keyed on the lockfile alone. The
      # rolling pattern here would write a fresh copy EVERY run into the budget that
      # `cache-cleanup.yml` exists because the repo already blew through once.
      #
      # ⚠ The Ubuntu RELEASE is in the key because the package versions come from the runner
      # image's apt sources. Without it a runner image bump would restore debs built for the
      # previous release and the install would fail on unmet dependencies — a red CI whose
      # cause is a cache entry nobody edited.
      #
      # ⚠ Read from `/etc/os-release` into an output, NOT from `env.ImageOS`. That variable is
      # set by the hosted runner image rather than by Actions itself, so it is not a documented
      # context (editors flag it, and a self-hosted or changed image can leave it empty) — and
      # an empty segment does not fail, it silently produces ONE key shared across every image
      # version, which is precisely the collision this segment exists to prevent.
      - name: Resolve the runner's Ubuntu release (cache key input)
        id: os
        run: |
          . /etc/os-release
          test -n "$VERSION_ID"
          echo "release=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Cache ffmpeg packages
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-${{ runner.os }}-${{ steps.os.outputs.release }}-v1
      - name: Download ffmpeg packages
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          mkdir -p ~/ffmpeg-debs
          # -d downloads without installing. Copied out of apt's archive dir rather than
          # pointed there directly, because that path is root-owned and actions/cache runs
          # as the runner user.
          sudo apt-get install -y --no-install-recommends -d -o Dir::Cache::archives="$HOME/apt-debs" ffmpeg \
            || sudo apt-get install -y --no-install-recommends -d ffmpeg
          sudo find "$HOME/apt-debs" /var/cache/apt/archives -maxdepth 1 -name '*.deb' \
            -exec cp -n {} ~/ffmpeg-debs/ \; 2>/dev/null || true
          sudo chown -R "$USER" ~/ffmpeg-debs
          echo "cached $(find ~/ffmpeg-debs -name '*.deb' | wc -l) debs, $(du -sh ~/ffmpeg-debs | cut -f1)"
      # ⚠ apt-get install with the cached debs already in its archive dir, NOT `dpkg -i`. dpkg
      # processes files in glob order and fails on a package whose dependency has not been
      # unpacked yet; apt orders them itself. `--no-download` proves the cache is doing the
      # work — if a deb is missing this fails rather than quietly re-fetching it, which is how
      # a cache that stopped working would otherwise stay invisible.
      - name: Install ffmpeg (several filler tests skip without it)
        run: |
          sudo cp -n ~/ffmpeg-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install -y --no-install-recommends --no-download ffmpeg \
            || sudo apt-get install -y --no-install-recommends ffmpeg
      # ⚠ FAIL LOUDLY if the install silently stopped working. Without this the tests go back
      # to skipping and the job stays green — the exact "green but not covered" state this
      # step was added to end, and one nobody would notice because a skip looks like a pass
      # at a glance.
      - name: ffmpeg and ffprobe are on PATH
        run: |
          command -v ffmpeg
          command -v ffprobe
      - run: make check
      - name: OpenAPI spec is committed and current
        run: make openapi-verify
      - name: Config docs are committed and current
        run: make config-docs-verify
      - name: Retired identifiers are gone from prose
        run: make retired-verify
      # The workflow parsed as valid YAML and was still REJECTED by GitHub: expressions only
      # accept single quotes, and `join(needs.*.result, " ")` is a lex error the YAML parser
      # cannot see. Verified this target catches exactly that.
      #
      # ⚠ `make ci-lint` IS WEAKER ON A DEV MACHINE THAN IT IS HERE. actionlint shells out to
      # shellcheck for every `run:` block and SILENTLY SKIPS that half when shellcheck is not
      # installed — so the target exits 0 locally and fails here, which is exactly what
      # happened when the image filter was added (SC2129 on the grouped redirects). If this
      # step is red and your local run was green, install shellcheck before doubting CI.
      - name: Workflows are valid
        run: make ci-lint
      # ⚠ SAVE ONLY ON main, which is why this is cache/save rather than the round-trip
      # `actions/cache`. A PR's cache is scoped to `refs/pull/N/merge` and can never be
      # restored again once that PR closes — cache reads are scoped to the branch and its
      # base — so every PR save wrote ~1.4GB that only ever became eviction pressure on the
      # caches that ARE read. That is the same 10GB-quota burn `cache-cleanup.yml` exists to
      # mop up after; not creating the garbage beats deleting it. PRs restore from main's
      # entry and skip the measured 83–122s save outright.
      #
      # `always()` so a RED gate still refreshes the build objects it already produced — the
      # next run should not recompile from cold merely because an assertion failed.
      - name: Save Go caches (main only)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  store-postgres:
    name: Store conformance (Postgres)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Off for the same reason as the `go` job: the step below owns both Go cache
          # paths, and leaving setup-go's on would restore/save `~/.cache/go-build` twice
          # under a go.sum-only (frozen) key.
          cache: false
          go-version: ${{ env.GO_VERSION }}
      # This job was compiling the store test binary from source every run. ⚠ SEPARATE KEY
      # from the `go` job above, and it must stay separate: this one builds WITHOUT -race,
      # and race and non-race objects are distinct entries, so sharing a key would have each
      # job evict the other's work on every run.
      #
      # Same rolling-key-plus-weekly-epoch pattern as the `go` job — see the long note there
      # for why the key must be both unique per run (or it freezes) and epoch-bounded (or it
      # snowballs). Modules ride along because setup-go no longer caches them.
      - name: Cache epoch (bounds rolling-cache growth)
        id: epoch
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Go caches (store conformance)
        id: gocache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-pg-${{ runner.os }}-${{ steps.epoch.outputs.week }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gobuild-pg-${{ runner.os }}-${{ steps.epoch.outputs.week }}-${{ hashFiles('go.sum') }}-
            gobuild-pg-${{ runner.os }}-${{ steps.epoch.outputs.week }}-
      # testcontainers uses the Docker daemon preinstalled on ubuntu-latest.
      - run: make test-pg
      # main only — see the `go` job's save step for why a PR-scoped save is pure eviction
      # pressure on caches that are still being read.
      - name: Save Go caches (main only)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  frontend:
    name: Frontend — biome + typecheck + unit + build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (pinned via web/package.json packageManager)
        run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: make fe-install
      - run: make fe
      - name: Token artifacts are committed and current
        run: make fe-tokens-verify

  playwright:
    name: Playwright — visual + a11y + e2e (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Sharded purely for WALL-CLOCK. 624 browser screenshots on a 4-core runner took ~6
    # minutes of a ~7 minute build — this job alone WAS the critical path; every other job
    # finished by 4.2 min. Two shards put it at ~3.8 min, which lands just under the Go
    # job, and that is the point to stop: a third shard would only make Go the bottleneck.
    #
    # ⚠ Free on a public repo, where standard-runner minutes are not billed — two runners
    # cost the same as one and finish sooner. Do NOT copy this pattern into a private repo
    # without re-checking that trade, where it doubles billed minutes to halve the wait.
    strategy:
      fail-fast: false # one shard's failures must not hide the other's
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: make fe-install
      # Generate the orval API client + tokens + routes (all gitignored). Without
      # this the Storybook/SPA builds can't resolve the generated endpoints on a
      # clean checkout — `make fe` does this in the frontend job, but fe-visual's
      # storybook-build does not.
      - run: make fe-codegen
      # Both drive the pinned Playwright Docker image (the reference rasterizer,
      # §5.2), so CI and local snapshots are byte-identical.
      - name: Visual + a11y over storybook-static
        run: make fe-visual PW_SHARD=--shard=${{ matrix.shard }}/2
      # ⚠ ONE shard runs e2e, not every shard. It is a 7-test 15s suite with its own
      # config and no sharding, so running it per-shard would duplicate it for nothing.
      - name: Wizard e2e smoke vs a mocked backend
        if: matrix.shard == 1
        run: make e2e

  # The single required check. ALWAYS runs, so branch protection has one status that is
  # reliably present whether the jobs above ran or skipped.
  #
  # ⚠ It must inspect `needs.*.result` explicitly. A skipped dependency does NOT fail a job by
  # default, but neither does a FAILED one when `if: always()` is set — so a naive aggregate
  # would report success while a real job was red. Only `skipped` and `success` are accepted;
  # anything else (failure, cancelled) fails the gate.
  image:
    name: Image — builds on both release platforms
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    # ⚠ The only capped job here, because it is the only one that can run away: the arm64
    # half is QEMU-emulated and a first (uncached) build takes ~30 min. GitHub's default is
    # SIX HOURS, so a hang would burn a day of billed minutes before anyone noticed. 45
    # leaves headroom over the measured cold build without being an afternoon.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # QEMU is what makes the arm64 half real on an amd64 runner. Without it this job
      # would build amd64 twice and report green on exactly the failure it exists to catch.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # BOTH platforms, because the bug this job exists for was arch-specific and
      # release.yml publishes both. Load/push nothing — the build IS the assertion, and
      # the Dockerfile's own build-time proofs (yt-dlp --version, ffmpeg -version, and a
      # real whisper transcription) run inside it.
      #
      # ⚠ Cache scoped per platform. A shared key lets one arch's layers answer for the
      # other's, which is how an arch-specific break hides.
      - name: Build (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # ⚠ READ-ONLY cache, deliberately: there is `cache-from` and NO `cache-to`.
          # Measured — exporting it cost 462s of a 770s job, MORE than the 303s the arm64
          # layer it was caching takes to build, because `mode=max` ships every
          # intermediate layer including the 466MB whisper model. It also spends the 10GB
          # repo cache quota on ~2GB per run, evicting the Go and pnpm caches that do pay
          # for themselves.
          #
          # It still READS anything release.yml populates, so this is not "no caching" —
          # it is declining to pay export cost for a job whose expensive layer is invalidated
          # by the only file that triggers it. This job runs ONLY when the Dockerfile
          # changes, which busts that layer by definition, so a written cache would be
          # stale essentially every time it was read.
          cache-from: type=gha,scope=image-ci

  ci-ok:
    name: CI
    if: always()
    needs: [changes, go, store-postgres, frontend, playwright, image]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran must have passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
