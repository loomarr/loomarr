# CI — mirrors the harness contract (CLAUDE.md / design §16):
# check + openapi-verify + config-docs-verify + test-pg + fe + e2e/visual.
# Every gate here is a `make` target so local and CI never diverge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go — check + spec/config drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # `make lint` runs golangci-lint via `go run …@v2.12.2`. Its dependencies are NOT in
      # go.sum, so setup-go's cache — keyed on go.sum — never covers them, and every run
      # re-downloaded and recompiled the whole linter from source (visible in the logs as
      # `go: downloading lipgloss / fatih-color / gofrs-flock`).
      #
      # Cached here as a SEPARATE entry keyed on the pinned version: the module source, the
      # compiled objects, and golangci's own analysis cache. Keyed on the version alone, so
      # it survives every go.sum change and only re-warms on a linter bump.
      - name: Cache golangci-lint (module + build + analysis)
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod/github.com/golangci
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-v2.12.2-${{ hashFiles('go.sum') }}
          restore-keys: |
            golangci-${{ runner.os }}-v2.12.2-
      - run: make check
      - name: OpenAPI spec is committed and current
        run: make openapi-verify
      - name: Config docs are committed and current
        run: make config-docs-verify
      - name: Retired identifiers are gone from prose
        run: make retired-verify

  store-postgres:
    name: Store conformance (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # testcontainers uses the Docker daemon preinstalled on ubuntu-latest.
      - run: make test-pg

  frontend:
    name: Frontend — biome + typecheck + unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (pinned via web/package.json packageManager)
        run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: make fe-install
      - run: make fe
      - name: Token artifacts are committed and current
        run: make fe-tokens-verify

  playwright:
    name: Playwright — visual + a11y + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: make fe-install
      # Generate the orval API client + tokens + routes (all gitignored). Without
      # this the Storybook/SPA builds can't resolve the generated endpoints on a
      # clean checkout — `make fe` does this in the frontend job, but fe-visual's
      # storybook-build does not.
      - run: make fe-codegen
      # Both drive the pinned Playwright Docker image (the reference rasterizer,
      # §5.2), so CI and local snapshots are byte-identical.
      - name: Visual + a11y over storybook-static
        run: make fe-visual
      - name: Wizard e2e smoke vs a mocked backend
        run: make e2e
