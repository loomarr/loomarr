# CI — mirrors the harness contract (AGENTS.md / design §16):
# check + openapi-verify + config-docs-verify + test-pg + fe + e2e/visual.
# Every gate here is a `make` target so local and CI never diverge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue dispatches batches as `merge_group`, NOT `pull_request`. Without this
  # trigger the required `CI` check never runs for a queued PR and the queue stalls forever
  # waiting on a status that cannot arrive.
  merge_group:
  workflow_dispatch: # full release-candidate rerun on the exact main commit

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# A newer push to the same ref cancels the older in-flight run.
#
# ⚠ NEVER cancel a merge-queue run. `merge_group` refs are unique per batch so collisions are
# unlikely, but a cancelled queue run reports a non-success conclusion, which ejects the whole
# batch from the queue — turning a harmless double-push into a merge that silently does not
# happen. Only PR and branch runs are cancellable.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # Which trees moved. Everything else gates on this, so a docs-only PR costs one ~5s job
  # instead of ~14 runner-minutes verifying code nobody touched.
  #
  # ⚠ Filtering happens PER JOB, never with a workflow-level `paths:`. A workflow that does
  # not trigger reports no checks at all, so a required check sits "expected" forever and the
  # PR cannot merge. This way the run always happens; individual jobs skip.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      image: ${{ steps.filter.outputs.image }}
      docs: ${{ steps.filter.outputs.docs }}
      agent: ${{ steps.filter.outputs.agent }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the merge base to diff against
      # Plain git rather than a third-party action: this is ~15 lines of shell, and a
      # marketplace action here would be a new dependency (AGENTS.md) whose whole job is
      # `git diff --name-only`. It also fails SAFE — any error, or an unresolvable base,
      # falls through to running everything.
      - name: Which trees moved
        id: filter
        env:
          # ⚠ `merge_group` carries NEITHER `pull_request.base.sha` NOR `before`. Left to fall
          # through it hits the fail-safe below and every job runs — correct, but it makes the
          # queue cost a full ~14-minute matrix for a docs-only batch. `merge_group.base_sha`
          # is the main commit the batch is stacked on, which is exactly the right diff base.
          BASE: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
             || github.event_name == 'merge_group' && github.event.merge_group.base_sha
             || github.event.before }}
        run: |
          set -uo pipefail
          # No usable base (first push, force-push, a new branch): run everything. Skipping
          # because we could not work out what changed would be the wrong failure direction.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ($BASE) — running every job"
            { echo "go=true"; echo "web=true"; echo "image=true"; echo "docs=true"; echo "agent=true"; echo "android=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "changed files:"; echo "$changed"

          # Makefile and this workflow gate BOTH: they define how every job runs, so a change
          # to either has to be proven against everything.
          #
          # ⚠ `scripts/` is here because the Go job RUNS scripts from it — `make retired-verify`
          # is `./scripts/check-retired.sh`, and `make tags-verify` is `./scripts/check-tags.sh`.
          # Without it a PR that edited only a guard script skipped the one job that executes
          # it, so a broken guard merged unproven. `docs/help/` was already listed for being
          # retired-verify's INPUT; the script itself was the gap — the guard was covered
          # against the thing it reads but not against itself.
          #
          # ⚠ `docs/design.md` is here because the Go job ASSERTS ON IT. Two tests read it:
          # `TestPackageMapListsEveryPackage` (§14.2 lists every package) and
          # `TestArchDocs_NoDrift` (§2's generated package map matches the code). It was a
          # pre-existing gap for the first of those — a PR that hand-edited design.md could
          # break the §14.2 gate while skipping the only job that runs it. Same class as the
          # `scripts/` omission above: the guard was covered against its code input but not
          # against the document it reads.
          #
          # ⚠ `docs/dev/commands.md` is here for the same reason, one generator over:
          # it is GENERATED and the Go job verifies it (`make dev-docs-verify`). Its inputs —
          # the Makefile and this workflow — already trigger the job, but a hand-edit to the
          # generated file itself would otherwise sail past the only check that reads it.
          if echo "$changed" | grep -qE '\.go$|^go\.(mod|sum)$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^rust/|^internal/store/migrations/|^docs/help/|^docs/design\.md$|^docs/dev/commands\.md$|^scripts/|^Makefile$|^\.github/workflows/'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          # Prose. Cheap and fast, so it gates on the whole documentation set rather than
          # trying to be clever about which page changed.
          # `ci\.yml$`, not the whole workflows tree: the docs job lints prose and links (its
          # DOC_GLOBS/LINK_GLOBS never include .github/workflows), so only a ci.yml edit that
          # changes how the docs job itself runs needs to re-trigger it. release.yml / pages.yml
          # carry no prose this job checks. (Go keeps the broad glob — it actionlints every one.)
          if echo "$changed" | grep -qE '^docs/|^README\.md$|^CONTRIBUTING\.md$|^CLAUDE\.md$|^AGENTS\.md$|^CONTEXT\.md$|^PROGRESS\.md$|^design/.*\.md$|^\.agents/|^\.claude/|^docs-site/|^\.vale|^lychee\.toml$|^\.markdownlint|^\.github/workflows/ci\.yml$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          # The tool-neutral harness has a small macOS contract test below. Linux is already
          # exercised by `make check`; this output prevents unrelated product changes from
          # spending a macOS runner while keeping every harness input covered.
          if echo "$changed" | grep -qE '^scripts/|^Makefile$|^AGENTS\.md$|^CLAUDE\.md$|^\.agents/|^\.claude/|^\.node-version$|^docker/compose\.dev|^web/package\.json$|^web/apps/web/vite\.config\.ts$|^docs/dev/'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi
          # The Android TV client (§11, Shield). `api/openapi.yaml` gates it because the client is
          # GENERATED from that spec — the same reason `web/` regenerates its orval client — so a
          # backend field rename must fail the Android build rather than reach a television.
          # ⚠ `ci\.yml$`, not the whole `.github/workflows/` tree — same reasoning as the web
          # filter below. The Android job is defined only in ci.yml and consumes no other workflow,
          # so a release.yml / pages.yml edit cannot change the APK build and must not spend an
          # Android runner. `api/openapi.yaml` stays because the client is GENERATED from it.
          if echo "$changed" | grep -qE '^android/|^api/openapi\.yaml$|^Makefile$|^\.github/workflows/ci\.yml$'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
          # ⚠ `ci\.yml$`, not the whole `.github/workflows/` tree. The web family (frontend +
          # tuner + playwright x4) is defined ONLY in ci.yml, and nothing in it consumes another
          # workflow file — so an edit to release.yml / pages.yml / release-notes.yml has no way to
          # affect a web job and must not spend six runners rebuilding + re-Playwrighting the SPA.
          # The Go filter keeps the broad glob on purpose: `make ci-lint` actionlints EVERY workflow
          # and `cmd/releaseverify` reads release.yml, so those genuinely need any-workflow coverage.
          if echo "$changed" | grep -qE '^web/|^Makefile$|^\.github/workflows/ci\.yml$'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          # The IMAGE. Added after a Dockerfile change that could never have built for
          # arm64 sat undetected: `intel-media-va-driver` has no arm64 candidate, so apt
          # exited 100 — and release.yml builds linux/amd64,linux/arm64. Nothing caught it
          # because the image was built ONLY at release time, on a v* tag, which is the
          # worst moment to discover the build is broken.
          #
          # ⚠ On a PR this diffs against the MERGE BASE, not the previous push, so the
          # question is "did this PR touch the Dockerfile", not "did the last commit".
          # A PR that changed it in commit 1 keeps building the image for every later
          # push, which is correct — skipping would leave the PR's own change unproven.
          #
          # Match every source family the Dockerfile consumes. The Go stage copies the
          # repository and embeds docs/help; the frontend stage copies web, OpenAPI, and
          # the bundle guard. Restricting this to Dockerfile/Rust changes allowed a Go,
          # frontend, or embedded-help change to reach a tag before the production image
          # containing it had ever been built.
          if echo "$changed" | grep -qE '^Dockerfile$|^\.dockerignore$|^LICENSE$|^THIRD_PARTY_NOTICES\.md$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^rust/|^internal/store/migrations/|\.go$|^go\.(mod|sum)$|^docs/help/|^web/|^api/openapi\.yaml$|^scripts/check-fe-bundle\.mjs$'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  agent-harness-macos:
    name: Agent harness (macOS)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # This exercises the `lsof` process-ownership adapter. Linux runs the same harness through
      # `make check`, where `/proc` is available.
      - name: Worktree isolation, claims, leases, and process ownership
        run: make agent-harness-test

  windows-playout:
    name: Windows playout process tree
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # Linux's permanent cross-compile gate catches accidental Unix-only fields in generic
      # files. This native runner proves the Windows-only Job Object adapter actually assigns,
      # resumes, cancels, and reaps a descendant process rather than merely compiling.
      - name: Job Object owns the complete ffmpeg-shaped process tree
        run: go test ./internal/playout -run '^(TestCombinedProgressPreservesDiagnostics|TestProcessProgressTransport|TestProcessTree.*)$' -count=1
      - name: Complete Windows binary builds
        run: go build -o "${{ runner.temp }}\loomarr.exe" ./cmd/loomarr

  go:
    name: Go — check + spec/config drift (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # `make check` was 308–428s and the whole job 7.2–12.2 min — the critical path on every
    # Go-touching PR. `go test -race` is effectively all of it (measured 2026-08-09: `make
    # lint` is 5.4s warm, so splitting lint off would buy nothing; the 41 packages sum to
    # 436s and the runner has 4 cores). So the TESTS are what shards.
    #
    # ⚠ Sharding is the one change here that can quietly SHRINK the gate — a split that drops
    # a package leaves those tests unrun and every shard green. `make go-shard-verify` below
    # is the guard, and it is not optional.
    #
    # fmt/vet/lint re-run in every shard rather than being hoisted to one. That is deliberate:
    # it keeps CI invoking the same `make check` a developer runs, which is the whole point of
    # the harness contract, and the duplication is parallel so it costs no wall clock.
    strategy:
      fail-fast: false # one shard's failures must not hide the others'
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # ⚠ DELIBERATELY OFF — the step below owns every Go cache path in this job.
          # `cache: true` caches `~/go/pkg/mod` AND `~/.cache/go-build` keyed on go.sum,
          # which is the SAME `~/.cache/go-build` the unified cache rolls. Both on meant
          # restoring it twice and, whenever go.sum moved, SAVING it twice: measured
          # 2026-08-09, `Post Cache golangci` 83s ran alongside `Post Run actions/setup-go`
          # 91s in one job. Worse, setup-go's half is keyed on go.sum alone — exactly the
          # frozen-key bug the note below exists to prevent — so it re-froze a slice of the
          # very cache the rolling key was added to keep fresh.
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      # ONE cache for the whole Go toolchain: module downloads, build objects, and
      # golangci's analysis cache. `make lint` runs golangci-lint via `go run …@v2.12.2`,
      # whose dependencies are NOT in go.sum, so nothing keyed on go.sum alone ever covers
      # them (visible in the logs as `go: downloading lipgloss / fatih-color / gofrs-flock`)
      # — that is why the linter's module dir rides along here rather than in its own entry.
      #
      # ⚠ THE KEY MUST BE UNIQUE PER RUN, and this is not a style choice. `actions/cache`
      # NEVER overwrites an existing key — it skips the save when the key already hit. This
      # path holds `~/.cache/go-build`, whose contents track `.go` SOURCE, but the key used
      # to be `hashFiles('go.sum')`: so the entry was written once and then frozen while the
      # source moved under it. Measured — one 473MB entry created 2026-07-31T01:06 was still
      # being restored days and many source changes later, so `go test -race` recompiled
      # nearly everything on every run (~224s of the job). `github.run_id` guarantees a miss
      # on the exact key so the save always happens, while `restore-keys` still restores the
      # newest prior cache to compile against.
      #
      # ⚠ AND A ROLLING KEY MUST BE BOUNDED — the other half of the same trade, and the
      # failure mode the fix above created. A stable key never re-SAVES; a rolling key never
      # PRUNES. Neither actions/cache mode evicts anything, so this entry grew purely by
      # accretion: every run restored the previous one, added to it, and saved the union.
      # Measured 2026-08-09 it had reached **1.36 GB**, costing 85s to restore (74s of that
      # spent EXTRACTING, not downloading) plus 83–122s to save — ~168s of a ~10 min job
      # spent moving a tarball before a single test ran.
      #
      # The ISO week in the key is the bound. It rotates on its own, so there is no number
      # for anyone to remember to bump — this repo has been bitten repeatedly by
      # hand-maintained lists that drift — and it costs exactly one cold build per week. It
      # is in the restore-keys prefixes too, deliberately: a prefix that outlived the epoch
      # would restore the very accumulation the epoch exists to drop.
      - name: Cache epoch (bounds rolling-cache growth)
        id: epoch
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Go caches (modules + build + golangci)
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.cargo/registry
            ~/.cargo/git
            target
          # ⚠ THE SHARD IS PART OF THE KEY. Each shard compiles a DIFFERENT set of packages, so
          # a shared key would have them overwrite each other's build objects every run — each
          # shard restoring a cache built for the other's packages and recompiling its own.
          # It also makes the save well-defined: without it both shards race to write one key
          # and whichever lost simply skipped, so half the objects were never cached at all.
          key: go-rust-${{ runner.os }}-${{ steps.epoch.outputs.week }}-v2.12.2-s${{ matrix.shard }}-${{ hashFiles('go.sum', 'Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            go-rust-${{ runner.os }}-${{ steps.epoch.outputs.week }}-v2.12.2-s${{ matrix.shard }}-${{ hashFiles('go.sum', 'Cargo.lock') }}-
            go-rust-${{ runner.os }}-${{ steps.epoch.outputs.week }}-v2.12.2-s${{ matrix.shard }}-
      # ⚠ ffmpeg is NOT on the runner image, and several filler tests skip without it — the
      # language gate's span extraction (16kHz mono WAV, the shape whisper requires), the
      # silence guard, artwork rendering and the clip scan's probe. Measured on this runner
      # before adding this step: `ffmpeg: MISSING`, and the three `TestExtractSpanWAV_*`
      # tests reported SKIP while the job stayed green.
      #
      # A skip is visible in the log, so this was never a silent hole — but it did mean CI
      # could not catch a broken `-ar 16000`, which is exactly the flag those tests exist to
      # pin. The two backends carried byte-identical copies of that invocation with nothing
      # asserting it, so the gap was worth closing rather than documenting.
      #
      # ⚠ `ffmpeg` alone pulls `ffprobe` (same Debian source package), and both are needed:
      # the tests assert what the extracted file IS by probing it, not merely that ffmpeg
      # exited 0. `--no-install-recommends` keeps the codec/doc tail off a runner that only
      # has to decode and re-encode small synthetic WAVs.
      #
      # ⚠ The DEBS are cached, not the installed binaries. Copying `/usr/bin/ffmpeg` back into
      # place would leave its shared libraries behind — ffmpeg links a large tree (libav*,
      # libx264, …) spread across /usr/lib, so a binary-only cache produces a file that exists
      # and cannot run. Caching the .debs and letting apt install them keeps the package
      # manager's own dependency handling and skips only the download, which is the slow part.
      #
      # ⚠ Cache what APT ITSELF decides to fetch on THIS runner (~62.8 MB), not a computed
      # dependency closure. Measured while writing this: `apt-cache depends --recurse` over
      # ffmpeg resolves 298 packages / 244 MB, because the closure includes base packages the
      # runner image already has installed. Caching that would spend 244 MB of a 10GB repo-wide
      # budget to save 38 seconds — worse than no cache at all. `-d` into the apt archive dir
      # asks apt for the actual delta against what is already there.
      #
      # ⚠ A STABLE key, deliberately NOT the rolling `github.run_id` pattern the golangci and
      # gobuild caches above use. Those cache contents track something their key does not
      # (`~/.cache/go-build` tracks .go SOURCE), so they must re-save every run. This one's
      # contents are fully determined by the key — a fixed package set at a runner image
      # version — exactly like the pnpm caches, which are keyed on the lockfile alone. The
      # rolling pattern here would write a fresh copy EVERY run into the budget that
      # `cache-cleanup.yml` exists because the repo already blew through once.
      #
      # ⚠ The Ubuntu RELEASE is in the key because the package versions come from the runner
      # image's apt sources. Without it a runner image bump would restore debs built for the
      # previous release and the install would fail on unmet dependencies — a red CI whose
      # cause is a cache entry nobody edited.
      #
      # ⚠ Read from `/etc/os-release` into an output, NOT from `env.ImageOS`. That variable is
      # set by the hosted runner image rather than by Actions itself, so it is not a documented
      # context (editors flag it, and a self-hosted or changed image can leave it empty) — and
      # an empty segment does not fail, it silently produces ONE key shared across every image
      # version, which is precisely the collision this segment exists to prevent.
      - name: Resolve the runner's Ubuntu release (cache key input)
        id: os
        run: |
          . /etc/os-release
          test -n "$VERSION_ID"
          echo "release=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Cache ffmpeg packages
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-${{ runner.os }}-${{ steps.os.outputs.release }}-v1
      - name: Download ffmpeg packages
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          mkdir -p ~/ffmpeg-debs
          # -d downloads without installing. Copied out of apt's archive dir rather than
          # pointed there directly, because that path is root-owned and actions/cache runs
          # as the runner user.
          sudo apt-get install -y --no-install-recommends -d -o Dir::Cache::archives="$HOME/apt-debs" ffmpeg \
            || sudo apt-get install -y --no-install-recommends -d ffmpeg
          sudo find "$HOME/apt-debs" /var/cache/apt/archives -maxdepth 1 -name '*.deb' \
            -exec cp -n {} ~/ffmpeg-debs/ \; 2>/dev/null || true
          sudo chown -R "$USER" ~/ffmpeg-debs
          echo "cached $(find ~/ffmpeg-debs -name '*.deb' | wc -l) debs, $(du -sh ~/ffmpeg-debs | cut -f1)"
      # ⚠ apt-get install with the cached debs already in its archive dir, NOT `dpkg -i`. dpkg
      # processes files in glob order and fails on a package whose dependency has not been
      # unpacked yet; apt orders them itself. `--no-download` proves the cache is doing the
      # work — if a deb is missing this fails rather than quietly re-fetching it, which is how
      # a cache that stopped working would otherwise stay invisible.
      - name: Install ffmpeg (several filler tests skip without it)
        run: |
          sudo cp -n ~/ffmpeg-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install -y --no-install-recommends --no-download ffmpeg \
            || sudo apt-get install -y --no-install-recommends ffmpeg
      # ⚠ FAIL LOUDLY if the install silently stopped working. Without this the tests go back
      # to skipping and the job stays green — the exact "green but not covered" state this
      # step was added to end, and one nobody would notice because a skip looks like a pass
      # at a glance.
      - name: ffmpeg and ffprobe are on PATH
        run: |
          command -v ffmpeg
          command -v ffprobe
      # ⚠ RUN THE GUARD BEFORE THE SUITE, not after. It is the only thing standing between a
      # bad split and a green run over untested packages, and a guard that reports after the
      # tests have already "passed" is one cancelled job away from never running at all.
      - name: The shard split covers every package
        run: make go-shard-verify SHARDS=${{ strategy.job-total }}
      - run: make check GO_SHARD=${{ matrix.shard }}/${{ strategy.job-total }}
      # One shard certifies the RELEASE-profile worker against the deterministic real-codec
      # corpus. `make check` already covers debug Rust tests in both shards; this is the packaged
      # Go-to-Rust protocol, resource-boundary, and output-manifest gate operators run locally.
      - name: Rust image runtime certification
        if: matrix.shard == 1
        run: IMAGE_CERT_REPORT="$RUNNER_TEMP/image-certification.json" make image-cert
      - name: Keep the Rust image certification report
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-image-certification
          path: ${{ runner.temp }}/image-certification.json
          # An earlier `make check` failure means certification never ran; do not bury that cause
          # under a second artifact error. A certification failure itself still writes this report.
          if-no-files-found: ignore
          retention-days: 14
      # The drift checks are whole-repo and shard-independent: running them per shard would
      # just diff the same generated files N times. Shard 1 by the same convention that runs
      # e2e on one Playwright shard.
      - name: OpenAPI spec is committed and current
        if: matrix.shard == 1
        run: make openapi-verify
      - name: Config docs are committed and current
        if: matrix.shard == 1
        run: make config-docs-verify
      - name: The §2 package map is committed and current
        if: matrix.shard == 1
        run: make arch-docs-verify
      # The command reference is generated from this Makefile and these workflows, so it drifts
      # whenever either moves. It lives in the Go job because the generator is Go, and because
      # the `changes` filter already routes Makefile/workflow edits here.
      - name: Command reference is committed and current
        if: matrix.shard == 1
        run: make dev-docs-verify
      - name: Retired identifiers are gone from prose
        if: matrix.shard == 1
        run: make retired-verify
      # The workflow parsed as valid YAML and was still REJECTED by GitHub: expressions only
      # accept single quotes, and `join(needs.*.result, " ")` is a lex error the YAML parser
      # cannot see. Verified this target catches exactly that.
      #
      # ⚠ `make ci-lint` IS WEAKER ON A DEV MACHINE THAN IT IS HERE. actionlint shells out to
      # shellcheck for every `run:` block and SILENTLY SKIPS that half when shellcheck is not
      # installed — so the target exits 0 locally and fails here, which is exactly what
      # happened when the image filter was added (SC2129 on the grouped redirects). If this
      # step is red and your local run was green, install shellcheck before doubting CI.
      - name: Workflows are valid
        if: matrix.shard == 1
        run: make ci-lint
      # ⚠ SAVE ONLY ON main, which is why this is cache/save rather than the round-trip
      # `actions/cache`. A PR's cache is scoped to `refs/pull/N/merge` and can never be
      # restored again once that PR closes — cache reads are scoped to the branch and its
      # base — so every PR save wrote ~1.4GB that only ever became eviction pressure on the
      # caches that ARE read. That is the same 10GB-quota burn `cache-cleanup.yml` exists to
      # mop up after; not creating the garbage beats deleting it. PRs restore from main's
      # entry and skip the measured 83–122s save outright.
      #
      # `always()` so a RED gate still refreshes the build objects it already produced — the
      # next run should not recompile from cold merely because an assertion failed.
      - name: Save Go caches (main only)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  store-postgres:
    name: Store conformance (Postgres)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Off for the same reason as the `go` job: the step below owns both Go cache
          # paths, and leaving setup-go's on would restore/save `~/.cache/go-build` twice
          # under a go.sum-only (frozen) key.
          cache: false
          go-version: ${{ env.GO_VERSION }}
      # This job was compiling the store test binary from source every run. ⚠ SEPARATE KEY
      # from the `go` job above, and it must stay separate: this one builds WITHOUT -race,
      # and race and non-race objects are distinct entries, so sharing a key would have each
      # job evict the other's work on every run.
      #
      # Same rolling-key-plus-weekly-epoch pattern as the `go` job — see the long note there
      # for why the key must be both unique per run (or it freezes) and epoch-bounded (or it
      # snowballs). Modules ride along because setup-go no longer caches them.
      - name: Cache epoch (bounds rolling-cache growth)
        id: epoch
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Go caches (store conformance)
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-pg-${{ runner.os }}-${{ steps.epoch.outputs.week }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gobuild-pg-${{ runner.os }}-${{ steps.epoch.outputs.week }}-${{ hashFiles('go.sum') }}-
            gobuild-pg-${{ runner.os }}-${{ steps.epoch.outputs.week }}-
      # testcontainers uses the Docker daemon preinstalled on ubuntu-latest.
      - run: make test-pg
      # main only — see the `go` job's save step for why a PR-scoped save is pure eviction
      # pressure on caches that are still being read.
      - name: Save Go caches (main only)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  frontend:
    name: Frontend — biome + typecheck + unit + build (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # `make fe` was 394s and this job 7.0 min. The jsdom unit suite is the bulk of it ON THIS
    # RUNNER, which is the part worth spelling out: locally the whole suite is 33.5s (measured
    # 2026-08-09, 1307 tests over 166 files), and every other stage is small — biome 1.9s,
    # typecheck 3.6s, vite build 5.0s, storybook 10.3s. What makes it the bulk here is cores.
    # vitest is the most parallelism-hungry stage in the chain, and a 4-core runner is roughly
    # a sixth of the dev box it was measured on, so it degrades far more than the rest.
    #
    # Everything except the unit tests re-runs in both shards. That is the same trade as the Go
    # job: parallel, so it costs no wall clock, and it keeps CI running the same `make fe` a
    # developer runs rather than a bespoke decomposition of it.
    strategy:
      fail-fast: false # one shard's failures must not hide the others'
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (pinned via web/package.json packageManager)
        run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: make fe-install
      - run: make fe FE_SHARD=${{ matrix.shard }}/${{ strategy.job-total }}
      # Whole-repo and shard-independent — diffing the same generated token artifacts in every
      # shard would prove the same thing N times. Shard 1, matching the drift checks in the Go
      # job and e2e in the Playwright job.
      - name: Token artifacts are committed and current
        if: matrix.shard == 1
        run: make fe-tokens-verify

  playwright:
    name: Playwright — visual + a11y + e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Sharded purely for WALL-CLOCK. The shard COUNT below is the only number to change —
    # the denominator everywhere else derives from `strategy.job-total`, so editing
    # `matrix.shard` cannot leave a stale `/2` behind in the job name or the make invocation.
    #
    # ⚠ THE MEASUREMENTS IN A COMMENT EXPIRE, AND THIS ONE DID. It used to read "624 browser
    # screenshots … two shards put it at ~3.8 min … a third shard would only make Go the
    # bottleneck". Every clause had gone stale: measured 2026-08-09 the suite is 389 stories
    # × 2 viewports (~780 tests), ONE shard takes 8.4–9.1 min, and the Go job it was pegged
    # against runs 7.2–12.2 min — so "Go becomes the bottleneck" had been true for a long
    # time and the conclusion drawn from it was backwards. A stale comment cannot fail a
    # build, which is exactly why the numbers here carry the date they were taken.
    #
    # Four, not more: 4 puts the visual suite near ~4.5 min, under the Go job even after it
    # is sharded. Beyond that the per-shard fixed cost (checkout, pnpm install, codegen, a
    # storybook build) starts to dominate the screenshots the sharding is meant to split.
    #
    # ⚠ Free on a public repo, where standard-runner minutes are not billed — N runners cost
    # the same as one and finish sooner. Do NOT copy this pattern into a private repo without
    # re-checking that trade, where it multiplies billed minutes to divide the wait.
    #
    # ⚠ Every shard builds its own storybook-static, and that is DELIBERATE. Hoisting it into
    # one job + upload-artifact looks like the obvious de-duplication and is a net LOSS: the
    # builds run in PARALLEL, so they cost redundant work but zero wall clock, whereas an
    # artifact job adds a serial prefix that all N shards then wait on. Measured: the
    # storybook build is ~11s local, and the suite it feeds is minutes.
    strategy:
      fail-fast: false # one shard's failures must not hide the others'
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: make fe-install
      # Generate the orval API client + tokens + routes (all gitignored). Without
      # this the Storybook/SPA builds can't resolve the generated endpoints on a
      # clean checkout — `make fe` does this in the frontend job, but fe-visual's
      # storybook-build does not.
      - run: make fe-codegen
      # Both drive the pinned Playwright Docker image (the reference rasterizer,
      # §5.2), so CI and local snapshots are byte-identical.
      - name: Visual + a11y over storybook-static
        run: make fe-visual PW_SHARD=--shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # ⚠ ONE shard runs e2e, not every shard. It is a 7-test 15s suite with its own
      # config and no sharding, so running it per-shard would duplicate it for nothing.
      - name: Wizard e2e smoke vs a mocked backend
        if: matrix.shard == 1
        run: make e2e
      # ⚠ WITHOUT THIS, A RED VISUAL RUN TELLS YOU ALMOST NOTHING. Playwright writes an
      # `-actual.png`, `-expected.png` and `-diff.png` for every failed screenshot, and this
      # job used to throw all three away — the log kept only "N pixels (ratio X) are
      # different", which cannot distinguish an intended restyle from a genuinely broken
      # render. Diagnosing four red PRs on 2026-08-09 therefore meant cloning each branch,
      # installing the workspace and re-running the whole suite under Docker locally, purely
      # to look at images CI had already produced and discarded.
      #
      # That distinction is not academic here. One of those failures showed a flat amber
      # block where the baseline had artwork, which is exactly what this repo's broken-image
      # bug looks like — and was in fact the CORRECT `srcset` rung, because the story
      # fixtures use one flat colour per rung on purpose. Log text could never have settled
      # that; the PNG settled it in seconds.
      #
      # `failure()` so a green run uploads nothing: the suite writes ~90 PNGs for 10 failures
      # and there is no reason to spend storage on runs that had none. `if-no-files-found:
      # ignore` because a job can fail before Playwright writes anything at all (a bad
      # storybook build), and an upload step that errors on top of the real failure just
      # buries it.
      #
      # ⚠ The name MUST carry the shard, or the four shards race to upload one artifact name
      # and only one survives — silently, so the shard you actually wanted is the one missing.
      - name: Keep the failure images (visual + e2e)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failures-shard-${{ matrix.shard }}
          path: web/apps/web/test-results/
          if-no-files-found: ignore
          # Long enough to debug a PR over a weekend, short enough not to accumulate: these
          # are screenshots of a failing run, worthless once it is fixed.
          retention-days: 7

  # Performance certification needs a clean, representative runner. This used to follow a full
  # visual shard on Linux, where constrained Playwright WebKit can spend >1s replacing MediaSource
  # on one persistent video even while fresh-element calibration looks fast. Keep the zero-retry
  # matrix and absolute budgets, but run it natively on isolated macOS; shipping Safari still owns
  # the maintainer soak, while this exercises the matching engine family and replacement lifecycle.
  tuner:
    name: Tuner — Chromium + Firefox + WebKit
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: make fe-install
      - name: Install pinned browser engines
        run: cd web && pnpm --filter @loomarr/web exec playwright install chromium firefox webkit
      - name: 100-Channel controller matrix
        run: make tuner-e2e-host
      - name: Keep tuner failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tuner-failures
          path: web/apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The single required check. ALWAYS runs, so branch protection has one status that is
  # reliably present whether the jobs above ran or skipped.
  #
  # ⚠ It must inspect `needs.*.result` explicitly. A skipped dependency does NOT fail a job by
  # default, but neither does a FAILED one when `if: always()` is set — so a naive aggregate
  # would report success while a real job was red. `success` and `skipped` pass; `cancelled` is
  # tolerated (a superseded run or fail-fast collateral — the real failure still reports
  # `failure`); anything else (notably `failure`) fails the gate.
  image:
    name: Image — release build (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ${{ matrix.runner }}
    # Build each release architecture on a native four-core runner. The old combined amd64
    # job emulated arm64 through QEMU and spent ~30 minutes compiling the Rust worker; GitHub's
    # standard arm64 runner makes the same architecture proof without emulation. Keep this a
    # matrix so the two complete images build in parallel and one architecture cannot answer
    # for the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # Still cap either native build. GitHub's default is six hours; 45 minutes leaves ample
    # headroom for a completely cold Docker build without allowing a hung download to run all day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # BOTH matrix entries are required because the bug this job exists for was arch-specific
      # and release.yml publishes both. Load the one native image without pushing it: the
      # Dockerfile's own build-time proofs run inside it, then the next step inspects the actual
      # runtime filesystem and OCI labels rather than trusting Dockerfile prose.
      #
      # ⚠ READ the release cache but never write a CI copy. release.yml owns that multi-platform
      # cache and refreshes it only after publishing a real image. The former `image-ci` scope was
      # never written anywhere, despite the comment claiming this job consumed the release cache.
      - name: Build (${{ matrix.platform }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: loomarr-ci:verify
          # ⚠ READ-ONLY cache, deliberately: there is `cache-from` and NO `cache-to`.
          # Measured — exporting it cost 462s of a 770s job, MORE than the 303s the arm64
          # layer it was caching takes to build, because `mode=max` ships every
          # intermediate layer including the 466MB whisper model. It also spends the 10GB
          # repo cache quota on ~2GB per run, evicting the Go and pnpm caches that do pay
          # for themselves.
          #
          # It still READS anything release.yml populates, so this is not "no caching" —
          # it is declining to pay the export cost on every PR. Dockerfile and Rust changes
          # invalidate only their affected layers; unchanged release layers remain reusable.
          cache-from: type=gha,scope=release

      - name: Inspect packaged license and notice metadata
        shell: bash
        run: |
          set -euo pipefail
          image=loomarr-ci:verify
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.documentation" }}')" = \
            "https://github.com/mantonx/loomarr/blob/main/THIRD_PARTY_NOTICES.md"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')" = \
            "MIT AND GPL-3.0-or-later"
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/share/doc/loomarr/LICENSE" "$RUNNER_TEMP/LICENSE"
          docker cp "$container:/usr/share/doc/loomarr/THIRD_PARTY_NOTICES.md" "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"
          cmp LICENSE "$RUNNER_TEMP/LICENSE"
          cmp THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"

  docs:
    name: Docs — links + structure + prose
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Structure. Globs and rules both live in .markdownlint-cli2.jsonc, so no paths here.
      - name: Markdown structure
        run: npx --yes markdownlint-cli2@0.20.0

      # ⚠ --offline is deliberate and must stay. Checking external URLs on every PR imports
      # the whole internet's link rot as CI flake; the class that has actually broken in this
      # repo is relative links, twice. See lychee.toml.
      # ⚠ WIDER than the style checks above, deliberately. A broken link is objectively wrong
      # anywhere; a style rule is a preference worth applying only to prose someone reads cover
      # to cover. The narrow set missed a real break — archiving six plans left nine dangling
      # references in PROGRESS.md, .claude/commands/, design/ and two Go doc comments.
      # Keep in step with LINK_GLOBS in the Makefile.
      - name: Links (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline --no-progress
            README.md CONTRIBUTING.md CLAUDE.md AGENTS.md CONTEXT.md PROGRESS.md
            docs 'design/*.md' .agents .claude
          fail: true

      # Repo vocabulary only — no stock style package. See .vale.ini for why.
      - name: Prose
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3
        with:
          files: '["README.md", "CONTRIBUTING.md", "docs/help", "docs/install", "docs/dev"]'
          fail_on_error: true
          version: 3.17.1

      # The site must still build from the docs as committed. It renders docs/** IN PLACE, so
      # a moved or deleted page breaks the build here rather than on deploy.
      - name: Docs site builds
        working-directory: docs-site
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

  android:
    name: Android TV — lint + unit + assemble
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # JDK 21, not the newest available. AGP 8.x does not support JDK 26, and the failure mode is
      # confusing Kotlin/Gradle daemon errors rather than a version message — so the version is
      # pinned here to the same one `android/README.md` tells a developer to install.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # One target, so CI runs what a developer runs — the same contract every other job here
      # keeps by calling `make`.
      - run: make android
    # No emulator stage. An emulated boot is minutes of runner time and proves software decoding,
    # not the hardware decode/passthrough questions that actually need a device — so it would cost
    # a lot to answer nothing this gate is for.

  ci-ok:
    name: CI
    if: always()
    needs: [changes, agent-harness-macos, go, store-postgres, frontend, playwright, tuner, image, docs, android]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran must have passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              # `cancelled` is NOT a failure. It means one of two things, and neither is a defect
              # in this commit: (1) a newer push/merge superseded this run via `cancel-in-progress`
              # (the newer run is authoritative), or (2) a sibling job genuinely FAILED and
              # fail-fast cancelled the rest — but that real failure surfaces as `failure` on the
              # actual job, which the wildcard below still catches. Treating `cancelled` as red is
              # what left main showing a false red on every rapid merge (see the concurrency note
              # at the top of this file). A real regression always reports `failure`, never
              # `cancelled`, so accepting it here loses no coverage.
              cancelled) echo "note: a job was cancelled (superseded or fail-fast collateral) — not a failure" ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
