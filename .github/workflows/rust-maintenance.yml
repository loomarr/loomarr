name: Rust maintenance

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds to fuzz each target, at most 1800
        required: true
        default: "60"

permissions:
  contents: read

concurrency:
  group: rust-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Advisories, licences, and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check the production dependency graph
        run: cargo deny check advisories licenses sources
      - name: Check the fuzz dependency graph
        run: cargo deny --manifest-path rust/loomarr-image/fuzz/Cargo.toml check advisories licenses sources

  fuzz:
    name: Bounded protocol and decoder fuzz
    runs-on: ubuntu-24.04
    # Two targets at the 1800 s maximum are 60 minutes of fuzzing, plus toolchain, cargo-fuzz and
    # target builds.
    timeout-minutes: 80
    env:
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nightly Rust for libFuzzer
        run: rustup toolchain install nightly-2026-08-14 --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz the one-shot control and decoder boundary
        working-directory: rust/loomarr-image
        run: |
          seconds="${FUZZ_SECONDS:-60}"
          case "$seconds" in
            '' | *[!0-9]*) echo "::error::fuzz_seconds must be a whole number of seconds"; exit 1 ;;
          esac
          # libFuzzer reads -max_total_time=0 as no limit, so 0 is refused with the upper bound.
          if [ "$seconds" -lt 1 ] || [ "$seconds" -gt 1800 ]; then
            echo "::error::fuzz_seconds is 1 to 1800 so both targets fit the job timeout"
            exit 1
          fi
          for target in protocol_decoder subtitle_decoder; do
            cargo +nightly-2026-08-14 fuzz run "$target" -- -max_total_time="$seconds" -max_len=1048576
          done
      - name: Keep crash and timeout artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-image-fuzz-artifacts
          path: rust/loomarr-image/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
