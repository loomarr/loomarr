name: CI / Go — repository contracts

on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  run:
    name: Go — repository contracts (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Two runners for wall clock: this job sets PR time for Go changes. Shard 1 owns the compile-heavy
    # analysis, shard 2 the repository contracts, and every check runs in exactly one of them. The
    # follow-up checks are placed to even the shards. ci-lint, release-verify, agent-harness-test,
    # shellcheck, and the generated-docs checks are not here: CI policy runs them on every PR.
    strategy:
      fail-fast: false # one shard's failures must not hide the other's
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # Newest go-contracts cache by prefix. The Go cache warm workflow alone saves it, once per ISO
      # week and go.sum. The path list must match that job and merge-gate.yml exactly: GitHub
      # versions a cache by its paths.
      - name: Restore contract caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-contracts-${{ runner.os }}-
          restore-keys: |
            go-contracts-${{ runner.os }}-
      # On a cache miss this job's module cache is empty. Download the module graph here, in its own
      # named step, instead of leaving a cold-cache network fetch buried inside one check's
      # subprocess (#1834). The helper retries a proxy stream reset with the same bounded policy as
      # container pulls (#1900; run 38418263494 lost the job to one reset).
      - name: Download Go modules
        run: ./scripts/go-mod-download.sh
      - name: Static analysis
        if: matrix.shard == 1
        run: make vet vet-tags lint # serial: each already uses every core, and -j4 was slower
      - name: Repository contracts
        if: matrix.shard == 2
        run: make fmt privacy-verify tags-verify compose-verify go-race-verify eval-contract
        env:
          MAKEFLAGS: -j4 --output-sync=target # independent checks
      - name: The test lanes cover every package
        if: matrix.shard == 1
        run: make go-shard-verify SHARDS=2
      - name: OpenAPI spec is committed and current
        if: matrix.shard == 1
        run: make openapi-verify
      - name: Retired identifiers are gone from prose
        if: matrix.shard == 2
        run: make retired-verify
      - name: Observability artifacts are provisionable
        if: matrix.shard == 2
        run: make observability-verify
