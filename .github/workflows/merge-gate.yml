name: Merge gate

# The required `CI` check for a merge-queue candidate, so a queued PR merges in minutes. It proves
# the one thing the pull request's own run cannot: that the PR still compiles on top of the main it
# is about to join. The complete gate set runs beside it in ci.yml as `CI assurance`, which finishes
# after the merge and files an issue if a merged commit fails (docs/contributing/ci.md).
#
# This is a separate workflow because ci.yml's merge-group runs share one concurrency group, and the
# gate must never wait behind them.
on:
  merge_group:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  run:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the queue base to diff against
      - name: Does this candidate change Go
        id: go
        run: ./scripts/ci-merge-gate-select.sh merge_group "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.go.outputs.changed == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # Newest go-contracts cache by prefix: Go's own caches ignore whatever is stale. The path list
      # must match ci-go-contracts.yml exactly, lint cache included: GitHub versions a cache by its
      # paths.
      - name: Restore Go caches
        if: steps.go.outputs.changed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-contracts-${{ runner.os }}-
          restore-keys: |
            go-contracts-${{ runner.os }}-
      - name: The merged tree compiles, tests included
        if: steps.go.outputs.changed == 'true'
        run: make vet
