name: Visual baselines

# Regenerates the committed Linux screenshot baselines (the visual suite's and the e2e suite's) for
# one pull request's branch, on a runner, so a baseline update never runs Playwright on a
# workstation (docs/contributing/testing.md). It runs on its own for every push to a same-repository
# pull request whose changes the visual or e2e suite renders, and by hand through workflow_dispatch.
# It commits only the PNGs the update rewrote, then releases the checks GitHub holds on that commit.
#
# None of the branch's code runs here with a write token. The render runs in
# visual-baselines-render.yml, dispatched at the pull request's own branch, where pnpm install,
# Storybook, and Playwright run read-only in the branch's Actions cache scope, as its CI does. Each
# job here holds only what it needs: the push job verifies that the render run is the one this run
# dispatched, at the resolved commit, then copies in its PNG bytes and commits them with git. Inputs
# reach a shell only through env.
#
# Forks never get here: the resolve job refuses a pull request from another repository before any
# job holds a write token, and GitHub gives a fork's pull_request run a read-only token anyway. This
# is pull_request, never pull_request_target.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "web/**"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose branch gets regenerated baselines
        required: true
        type: string
      # Empty, the render rewrites only the baselines whose comparison failed. A regex narrows the
      # visual render to the matching tests and rewrites all of their baselines, for an intended
      # change too subtle to fail the comparison (#1956).
      force:
        description: Optional Playwright --grep regex of story or test names to re-render and commit even under the threshold
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One run per pull request at a time. A newer push cancels the render of the older head, whose
# pixels could no longer be pushed anyway; a second manual dispatch waits instead. The bot's own
# baseline commit gets a group of its own: its held run, once released below, must not cancel the
# run that released it, and its resolve job skips it.
concurrency:
  group: visual-baselines-${{ inputs.pr || github.event.pull_request.number }}${{ github.actor == 'github-actions[bot]' && '-bot' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve the pull request's branch
    # A fork's pull request, and the bot's own baseline commit, never start a render.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}
      render: ${{ steps.pr.outputs.render }}
    steps:
      # Only the CI impact classifier is read from this checkout, and it keeps no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # Refuses a fork, a closed pull request, and the default branch: the push below may only
      # land on an open pull request's own branch in this repository. A dispatch must come from the
      # default branch. On a push, the pull request's changes go through scripts/ci-impact.sh, and
      # only a change that selects the visual or e2e suite renders; a classifier failure renders.
      - name: Resolve and vet the pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::dispatch Visual baselines from $DEFAULT_BRANCH, not $REF"
            exit 1
          fi
          if [[ ! $PR =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::pr must be a pull request number, got '$PR'"
            exit 1
          fi
          gh pr view "$PR" --repo "$REPO" \
            --json state,isCrossRepository,headRefName,headRefOid,headRepository,headRepositoryOwner \
            > "$RUNNER_TEMP/pr.json"
          state=$(jq -r .state "$RUNNER_TEMP/pr.json")
          cross=$(jq -r .isCrossRepository "$RUNNER_TEMP/pr.json")
          head_repo=$(jq -r '"\(.headRepositoryOwner.login)/\(.headRepository.name)"' "$RUNNER_TEMP/pr.json")
          branch=$(jq -r .headRefName "$RUNNER_TEMP/pr.json")
          sha=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")
          if [ "$state" != OPEN ]; then
            echo "::error::#$PR is $state; only an open pull request gets regenerated baselines"
            exit 1
          fi
          queued=$(gh api graphql --jq .data.repository.pullRequest.isInMergeQueue \
            -f query="{repository(owner:\"${REPO%%/*}\",name:\"${REPO#*/}\"){pullRequest(number:$PR){isInMergeQueue}}}")
          if [ "$queued" != false ]; then
            echo "::error::#$PR is in the merge queue, which locks its branch; take it out of the queue first"
            exit 1
          fi
          if [ "$cross" != false ] || [ "${head_repo,,}" != "${REPO,,}" ]; then
            echo "::error::#$PR comes from $head_repo, not $REPO; fork branches are refused"
            exit 1
          fi
          if [ "$branch" = "$DEFAULT_BRANCH" ] || ! git check-ref-format --branch "$branch" >/dev/null; then
            echo "::error::#$PR has head branch '$branch', which this workflow will not push to"
            exit 1
          fi
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::#$PR has an unreadable head commit '$sha'"
            exit 1
          fi
          render=true
          if [ "$EVENT" = pull_request ]; then
            if gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/files.txt" &&
              ./scripts/ci-impact.sh < "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/impact.txt"; then
              if ! grep -qxE 'visual=true|e2e=true' "$RUNNER_TEMP/impact.txt"; then
                render=false
              fi
            else
              echo "::warning::could not classify the changes of #$PR; rendering anyway"
            fi
          fi
          { echo "branch=$branch"; echo "sha=$sha"; echo "render=$render"; } >> "$GITHUB_OUTPUT"
          if [ "$render" = true ]; then
            echo "Regenerating baselines for #$PR: $branch at $sha" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "#$PR changes nothing the visual or e2e suite renders; nothing to regenerate." >> "$GITHUB_STEP_SUMMARY"
          fi

  render:
    name: Render on the pull request's branch
    needs: resolve
    if: needs.resolve.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.render.outputs.run_id }}
    steps:
      # The render run is named after this run's id and attempt, so it is found by that name and
      # not by whichever run on the branch happens to be newest. A branch cut before the render
      # workflow existed cannot run it and must be rebased onto the default branch first. `force`
      # is passed only when set, so an unforced dispatch still works on a branch whose render
      # workflow predates that input.
      - name: Dispatch the render and wait for it
        id: render
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          REQUEST: ${{ github.run_id }}-${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          inputs=(-f sha="$HEAD_SHA" -f request="$REQUEST")
          if [ -n "$FORCE" ]; then
            inputs+=(-f force="$FORCE")
            echo "Forcing a rewrite of every baseline of the tests matching: $FORCE" >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! gh workflow run visual-baselines-render.yml --repo "$REPO" --ref "$BRANCH" "${inputs[@]}"; then
            echo "::error::could not dispatch the render on $BRANCH; rebase it onto the default branch so it has visual-baselines-render.yml"
            exit 1
          fi
          run_id=""
          for _ in $(seq 1 24); do
            run_id=$(gh run list --repo "$REPO" --workflow visual-baselines-render.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 20 --json databaseId,displayTitle \
              | jq -r --arg title "Render visual baselines $REQUEST" 'map(select(.displayTitle == $title)) | .[0].databaseId // ""')
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::the render was dispatched on $BRANCH but its run never appeared"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Render: $SERVER_URL/$REPO/actions/runs/$run_id" | tee -a "$GITHUB_STEP_SUMMARY"
          until [ "$(gh api "repos/$REPO/actions/runs/$run_id" --jq .status)" = completed ]; do
            sleep 30
          done
          conclusion=$(gh api "repos/$REPO/actions/runs/$run_id" --jq .conclusion)
          if [ "$conclusion" != success ]; then
            echo "::error::the render run finished as $conclusion: $SERVER_URL/$REPO/actions/runs/$run_id"
            exit 1
          fi

  commit:
    name: Commit the changed baselines
    needs: [resolve, render]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # The token stays in this checkout for the push. Nothing from the branch runs here, and the
      # baselines go straight into the index: writing them through the worktree would follow any
      # symlink the branch tracks, and a filter in .gitattributes would run on `git add`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.branch }}
      # The branch controls the render workflow's contents, so its run proves nothing by itself.
      # GitHub's own record of it must name this run's request, the render workflow, the resolved
      # branch and commit, and success; only then is its artifact read.
      - name: Verify the render run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          RENDER_RUN: ${{ needs.render.outputs.run_id }}
          REQUEST: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! $RENDER_RUN =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the render job reported no run id, got '$RENDER_RUN'"
            exit 1
          fi
          gh api "repos/$REPO/actions/runs/$RENDER_RUN" > "$RUNNER_TEMP/render.json"
          if ! jq -e --arg repo "$REPO" --arg branch "$BRANCH" --arg sha "$HEAD_SHA" \
            --arg title "Render visual baselines $REQUEST" '
              .path == ".github/workflows/visual-baselines-render.yml"
              and .event == "workflow_dispatch"
              and .status == "completed" and .conclusion == "success"
              and .repository.full_name == $repo and .head_repository.full_name == $repo
              and .head_branch == $branch and .head_sha == $sha
              and .display_title == $title' "$RUNNER_TEMP/render.json" > /dev/null; then
            echo "::error::run $RENDER_RUN is not the successful render of $BRANCH at $HEAD_SHA that this run dispatched"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/visual-baselines
          run-id: ${{ needs.render.outputs.run_id }}
          github-token: ${{ github.token }}
      # A plain push: if the branch moved since it was rendered, the push or the check below fails
      # rather than committing pixels from an older tree onto a newer one.
      - name: Commit and push only the changed baselines
        id: commit
        shell: bash
        env:
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RENDER_RUN: ${{ needs.render.outputs.run_id }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/visual-baselines"
          allowed='^web/apps/web/tests/(visual|e2e)/[A-Za-z0-9._-]+\.spec\.ts-snapshots/[A-Za-z0-9._-]+\.png$'
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ] || [ "$(cat "$in/commit")" != "$HEAD_SHA" ]; then
            echo "::error::$BRANCH is no longer $HEAD_SHA, the commit that was rendered; a newer run renders it"
            exit 1
          fi
          if [ ! -s "$in/changed.txt" ]; then
            echo "No baseline changed for #$PR at $HEAD_SHA; nothing pushed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            if [[ ! $path =~ $allowed ]] || [ ! -f "$in/files/$path" ] || [ -L "$in/files/$path" ]; then
              echo "::error::refusing baseline '$path'"
              exit 1
            fi
            mode=$(git ls-files --stage -- "$path" | cut -d' ' -f1)
            if [ -n "$mode" ] && [ "$mode" != 100644 ]; then
              echo "::error::refusing to replace '$path', which the branch tracks as mode $mode"
              exit 1
            fi
            blob=$(git hash-object -w --no-filters -- "$in/files/$path")
            git update-index --add --cacheinfo "100644,$blob,$path"
          done < "$in/changed.txt"
          (cd "$in/files" && find . -type f -printf '%P\n') | sort > "$RUNNER_TEMP/artifact.txt"
          sort "$in/changed.txt" > "$RUNNER_TEMP/manifest.txt"
          if ! cmp -s "$RUNNER_TEMP/artifact.txt" "$RUNNER_TEMP/manifest.txt"; then
            echo "::error::the artifact holds files its manifest does not list"
            exit 1
          fi
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged.txt"
          if [ -n "$(comm -23 "$RUNNER_TEMP/staged.txt" "$RUNNER_TEMP/manifest.txt")" ]; then
            echo "::error::the index has changes beyond the listed baselines"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/staged.txt" ]; then
            echo "No baseline changed for #$PR at $HEAD_SHA; nothing pushed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(wc -l < "$RUNNER_TEMP/staged.txt")
          printf '%s\n' \
            "test(visual): regenerate Linux baselines for #$PR" \
            "" \
            "Baselines only: $count PNGs rewritten by the Visual baselines workflow," \
            "run $RUN_URL (attempt $RUN_ATTEMPT), rendered from $HEAD_SHA by render run $RENDER_RUN." \
            > "$RUNNER_TEMP/commit-message.txt"
          if [ -n "$FORCE" ]; then
            printf '%s\n' "" "Forced: every baseline of the tests matching this regex was rewritten:" "$FORCE" \
              >> "$RUNNER_TEMP/commit-message.txt"
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --no-verify --file="$RUNNER_TEMP/commit-message.txt"
          git push origin "HEAD:refs/heads/$BRANCH"
          { echo "pushed=true"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
          echo "Pushed $count baselines to $BRANCH as $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release the checks held on the new head
    needs: [resolve, commit]
    if: needs.commit.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      # The push above starts the pull request's `pull_request` runs (CI, CodeQL, this workflow),
      # but their actor is github-actions[bot], which the repository's "approval for first-time
      # contributors" rule treats as a first-time contributor: GitHub parks every one at
      # action_required, and the parked CI keeps the pull request out of the merge queue. This step
      # approves exactly those runs: the commit this run pushed, in this repository, started by the
      # bot. A fork's run is never one of them. If no CI run appears for the commit at all, it
      # dispatches CI with `scope=full` (the release path's manual entry point,
      # docs/contributing/releasing.md), whose `CI` job then reports the required check.
      - name: Approve the bot commit's held runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          HEAD_SHA: ${{ needs.commit.outputs.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! $HEAD_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the commit job reported no pushed commit, got '$HEAD_SHA'"
            exit 1
          fi
          for _ in $(seq 1 24); do
            gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" > "$RUNNER_TEMP/runs.json"
            if jq -e '.workflow_runs | any(.path == ".github/workflows/ci.yml")' "$RUNNER_TEMP/runs.json" > /dev/null; then
              break
            fi
            sleep 5
          done
          jq -r --arg repo "$REPO" --arg sha "$HEAD_SHA" '.workflow_runs[]
            | select(.event == "pull_request" and .conclusion == "action_required"
              and .head_sha == $sha and .repository.full_name == $repo
              and .head_repository.full_name == $repo
              and .triggering_actor.login == "github-actions[bot]")
            | .id' "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/held.txt"
          failed=0
          while IFS= read -r id; do
            if gh api --method POST "repos/$REPO/actions/runs/$id/approve" > /dev/null; then
              echo "Approved held run $SERVER_URL/$REPO/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::could not approve held run $SERVER_URL/$REPO/actions/runs/$id; approve it in the Actions tab"
              failed=1
            fi
          done < "$RUNNER_TEMP/held.txt"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          if jq -e '.workflow_runs | any(.path == ".github/workflows/ci.yml")' "$RUNNER_TEMP/runs.json" > /dev/null; then
            exit 0
          fi
          echo "No pull_request CI run appeared for $HEAD_SHA; dispatching CI instead." | tee -a "$GITHUB_STEP_SUMMARY"
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH" -f scope=full
          run_url=""
          for _ in $(seq 1 24); do
            run_url=$(gh run list --repo "$REPO" --workflow ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 20 --json headSha,url \
              | jq -r --arg sha "$HEAD_SHA" 'map(select(.headSha == $sha)) | .[0].url // ""')
            if [ -n "$run_url" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_url" ]; then
            echo "::error::CI was dispatched for $BRANCH but no run for $HEAD_SHA appeared"
            exit 1
          fi
          echo "CI for $HEAD_SHA: $run_url" | tee -a "$GITHUB_STEP_SUMMARY"
