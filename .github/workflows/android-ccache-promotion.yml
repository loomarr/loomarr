# Publish a merge queue's verified compiler results into main's cache scope without rebuilding.
name: Android ccache promotion

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: android-ccache-promotion-main
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified Android compiler cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Locate the exact merge-queue producer
        id: producer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: ./scripts/android-ccache-promotion.sh locate >> "$GITHUB_OUTPUT"
      - name: Download the immutable compiler-cache transfer
        if: steps.producer.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.producer.outputs.artifact-name }}
          path: ${{ runner.temp }}/loomarr-android-ccache-transfer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.producer.outputs.run-id }}
      - name: Validate the producer binding and cache contents
        id: cache
        if: steps.producer.outputs.found == 'true'
        run: >-
          ./scripts/android-ccache-promotion.sh restore
          "$RUNNER_TEMP/loomarr-android-ccache-transfer"
          "$RUNNER_TEMP/loomarr-android-ccache"
          "$GITHUB_SHA"
          "${{ steps.producer.outputs.run-id }}"
          android-tv-ccache-v2-Linux-ccache-4.14-
          >> "$GITHUB_OUTPUT"
      - name: Publish the verified generation in the default-branch cache scope
        if: steps.producer.outputs.found == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/loomarr-android-ccache
          key: ${{ steps.cache.outputs.cache-key }}
      - name: Retire the transfer and superseded main cache generations
        if: steps.producer.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.producer.outputs.artifact-id }}
          KEEP_KEY: ${{ steps.cache.outputs.cache-key }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$REPO/actions/artifacts/$ARTIFACT_ID"
          inventory="$RUNNER_TEMP/android-ccache-inventory.json"
          gh api "repos/$REPO/actions/caches?per_page=100&ref=refs/heads/main" > "$inventory"
          ids=$(./scripts/android-ccache-promotion.sh retention-plan \
            "$inventory" refs/heads/main android-tv-ccache-v2-Linux-ccache-4.14- "$KEEP_KEY")
          while read -r id; do
            [[ -n "$id" ]] || continue
            gh api -X DELETE "repos/$REPO/actions/caches/$id"
          done <<< "$ids"
