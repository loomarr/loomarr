name: Rust image benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Measured runs per Image role after one warm-up
        required: true
        default: "3"

permissions:
  contents: read

concurrency:
  group: image-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: AVIF ladders (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      # This invokes the same release build and Go command as local development. It is deliberately
      # not a required PR check: shared-runner timing is comparative evidence, not correctness.
      - name: Measure complete AVIF ladders
        env:
          IMAGE_BENCH_RUNS: ${{ inputs.runs }}
          IMAGE_BENCH_REPORT: ${{ runner.temp }}/image-benchmark-${{ matrix.platform }}.json
        run: make image-bench
      - name: Compare AVIF process and thread shapes
        env:
          IMAGE_BENCH_RUNS: ${{ inputs.runs }}
          IMAGE_BENCH_ROLES: poster
          IMAGE_BENCH_CPU_PROFILES: "2,4"
          IMAGE_BENCH_REPORT_DIR: ${{ runner.temp }}/image-parallelism-${{ matrix.platform }}
        run: make image-parallelism-bench
      - name: Keep the machine-readable report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-image-benchmark-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/image-benchmark-${{ matrix.platform }}.json
            ${{ runner.temp }}/image-parallelism-${{ matrix.platform }}/*.json
          if-no-files-found: ignore
          retention-days: 30
