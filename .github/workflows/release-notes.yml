# Publish a GitHub Release with notes when a version tag is pushed.
#
# DELIBERATELY SEPARATE from release.yml. That workflow is locked to ONE hardened job — build,
# sign (keyless cosign), and promote the image — and `internal/releaseverify` REJECTS any second
# job or extra step in it, because every addition is attack surface on the signing identity
# (`packages: write` + `id-token: write`). Release-notes creation needs none of that power, only
# `contents: write`, so it lives here in its own workflow with the minimum permission. The two run
# in parallel off the same `v*` tag and never share a token.
#
# Notes begin with GitHub's exact list of merged PRs since the previous tag. OpenRouter assigns only
# those verified PR numbers to a fixed set of sections; repository code rejects missing, duplicate,
# invented, or malformed classifications and renders GitHub's real titles/authors/links. A curated
# `docs/release/<tag>.md` header still supplies framing a machine cannot infer. A tag with a `-`
# (e.g. `v0.1.0-beta.1`) is marked a prerelease.
name: Release notes

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release; nothing else

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-notes:
    name: Publish GitHub Release notes
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate validated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_RELEASE_API_KEY: ${{ secrets.OPENROUTER_RELEASE_API_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: ./scripts/generate-release-notes.sh "$TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          # Prerelease when the SemVer tag carries a pre-release suffix (e.g. -beta.1).
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh "${args[@]}"
