name: CI / Frontend

on:
  workflow_call:
    # Turbo Remote Cache, the same four optional secrets as ci-clients.yml: the typecheck and
    # package-test tasks here hash the same as the client lanes', so the two workflows share results.
    # A run without TURBO_TOKEN uses no remote cache.
    secrets:
      TURBO_API:
        required: false
      TURBO_TEAM:
        required: false
      TURBO_TOKEN:
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  run:
    name: Frontend — ${{ matrix.shard == 7 && 'biome + build' || matrix.shard == 8 && 'typecheck + package tests' || format('web unit ({0}/6)', matrix.shard) }}
    runs-on: ubuntu-latest
    # `make fe` was 394s and this job 7.0 min. The jsdom unit suite is the bulk of it ON THIS
    # RUNNER, which is the part worth spelling out: locally the whole suite is 33.5s (measured
    # 2026-08-09, 1307 tests over 166 files), and every other stage is small — biome 1.9s,
    # typecheck 3.6s, vite build 5.0s, storybook 10.3s. What makes it the bulk here is cores.
    # vitest is the most parallelism-hungry stage in the chain, and a 4-core runner is roughly
    # a sixth of the dev box it was measured on, so it degrades far more than the rest.
    #
    # Eight entries split `make fe` between them. 1-6 each run codegen and a sixth of the web unit
    # tests (`make fe-unit`). 7 runs codegen and the static checks and builds (`make fe-checks`), 8
    # the typecheck and the package tests through Turbo (`make fe-typecheck fe-packages`). Only
    # codegen repeats, because each entry needs the generated files. Repeating the other stages in
    # every shard cost about 2m20s of a 4m40s job. Expressions have no arithmetic, so the /6 is
    # literal: change it together with the matrix and the entry 7 and 8 conditions.
    #
    # The typecheck and the package tests share entry 8 because Turbo's `test` depends on each
    # package's `typecheck`: split across two runners, a cache miss would typecheck the packages on
    # both.
    strategy:
      fail-fast: false # one shard's failures must not hide the others'
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (pinned via web/package.json packageManager)
        run: corepack enable
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: make fe-install
      - if: matrix.shard <= 6
        run: make fe-unit FE_SHARD=${{ matrix.shard }}/6
      - if: matrix.shard == 7
        run: make fe-checks
      # Whole-repo and shard-independent — diffing the same generated token artifacts in every
      # shard would prove the same thing N times. Entry 7, with the other whole-repo checks.
      - name: Token artifacts are committed and current
        if: matrix.shard == 7
        run: make fe-tokens-verify
      # The only step that runs Turbo, so the only one with the Remote Cache settings; `make
      # fe-install` runs dependency install scripts and never sees them. TURBO_CACHE is the
      # ci-clients.yml expression: the merge queue and main write, every other run reads.
      - name: Typecheck and test the packages
        if: matrix.shard == 8
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: ${{ (github.event_name == 'merge_group' || github.ref == 'refs/heads/main') && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
        run: make fe-typecheck fe-packages
      # ⚠ main only (#1679). A cache is readable only from its own ref and the default branch, and
      # every queue batch has a unique `gh-readonly-queue/…` ref, so a queue save is written once
      # and read by nothing. A pull-request or branch save is a ~350 MB per-ref copy too.
      # The `CI / Go cache warm` workflow seeds the store on main for each lockfile; a PR that changes the
      # lockfile restores the newest main store through the `pnpm-<os>-` prefix.
      - name: Save pnpm store (main only)
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
