name: Android TV beta

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android SemVer name, such as 0.1.0-beta.1
        required: true
        type: string
      renderer:
        description: Shipping renderer; React Native remains build-only until adoption is recorded
        required: true
        default: compose
        type: choice
        options:
          - compose
          - react-native
      publish_to_play:
        description: Publish through the Play Developer API after the manual bootstrap
        required: true
        default: false
        type: boolean
      track:
        description: Testing track; Production is deliberately unavailable
        required: true
        default: internal
        type: choice
        options:
          - internal
          - closed-beta

concurrency:
  group: android-beta-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    name: Build and optionally publish Android TV beta
    runs-on: ubuntu-latest
    environment: android-beta
    env:
      LOOMARR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      LOOMARR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      LOOMARR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      LOOMARR_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
      ANDROID_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/android-release
      LOOMARR_ANDROID_RENDERER: ${{ inputs.renderer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate main and its Android CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/validate-android-release-source.sh

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: inputs.renderer == 'react-native'
        with:
          node-version: "22"

      - name: Install the React Native workspace
        if: inputs.renderer == 'react-native'
        run: |
          corepack enable
          make fe-install

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-release-${{ inputs.renderer }}-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'web/apps/tv/**', 'web/packages/**', 'web/scripts/**', 'web/pnpm-lock.yaml') }}
          restore-keys: android-release-${{ inputs.renderer }}-${{ runner.os }}-

      - name: Derive the one release identity
        env:
          REQUESTED_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          code=$(./scripts/android-version-code.sh "$REQUESTED_VERSION_NAME")
          echo "LOOMARR_ANDROID_VERSION_NAME=$REQUESTED_VERSION_NAME" >> "$GITHUB_ENV"
          echo "LOOMARR_ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Materialize the upload keystore in runner temp
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/loomarr-upload.p12"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "LOOMARR_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build and verify the signed AAB
        run: ./scripts/build-android-beta.sh

      - name: Enforce the React Native adoption gate before Play publication
        if: inputs.renderer == 'react-native' && inputs.publish_to_play
        env:
          REACT_NATIVE_ADOPTED: ${{ vars.ANDROID_REACT_NATIVE_ADOPTED }}
        run: test "$REACT_NATIVE_ADOPTED" = true

      - name: Retain the signed AAB and release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: loomarr-android-tv-${{ inputs.version_name }}
          path: .artifacts/android-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the protected Play testing track
        if: inputs.publish_to_play
        env:
          ANDROID_RELEASE_TRACK: ${{ inputs.track }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          service_account="$RUNNER_TEMP/google-play-service-account.json"
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$service_account"
          aab=$(find "$ANDROID_RELEASE_OUTPUT_DIR" -maxdepth 1 -type f -name '*.aab' -print -quit)
          manifest=${aab%.aab}.json
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH="$service_account" \
            ./scripts/publish-android-beta.sh "$aab" "$manifest"

      - name: Remove credential files
        if: always()
        run: |
          rm -f -- "$LOOMARR_ANDROID_KEYSTORE_PATH" "$RUNNER_TEMP/google-play-service-account.json"
