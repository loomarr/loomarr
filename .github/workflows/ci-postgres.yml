name: CI / Store conformance (Postgres)

on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  run:
    name: Store conformance (Postgres, ${{ matrix.lane }})
    runs-on: ubuntu-latest
    # One suite per runner (#1570): each still runs alone (-p=1) under the race detector, so the
    # gate's isolation holds while the suites stop queuing behind each other. The matrix is
    # the gate's completeness: releaseverify requires exactly these suites, and fail-fast off so a
    # failure never hides a sibling's result.
    strategy:
      fail-fast: false
      matrix:
        lane: ["platform/store", "playout/backendtransition", "app", "filler/records"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Off for the same reason as the `go` job: the step below owns both Go cache
          # paths, and leaving setup-go's on would restore/save `~/.cache/go-build` twice
          # under a go.sum-only (frozen) key.
          cache: false
          go-version: ${{ env.GO_VERSION }}
      # This job was compiling the store test binary from source every run. ⚠ SEPARATE KEY
      # from the `go` job above, and it must stay separate: this one builds WITHOUT -race,
      # and race and non-race objects are distinct entries, so sharing a key would have each
      # job evict the other's work on every run.
      #
      # Restore only, like the `go` job (see its note): the `postgres` lane of the `CI / Go cache
      # warm` workflow is this cache's one writer, once per ISO week and go.sum. Modules ride
      # along because setup-go does not cache them.
      - name: Cache epoch (bounds rolling-cache growth)
        id: epoch
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Go caches (store conformance)
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-pg-${{ runner.os }}-${{ steps.epoch.outputs.week }}-${{ hashFiles('go.sum') }}-warm
          restore-keys: |
            gobuild-pg-${{ runner.os }}-${{ steps.epoch.outputs.week }}-
      # testcontainers uses the Docker daemon preinstalled on ubuntu-latest.
      - run: make test-pg TEST_PG_SUITE=${{ matrix.lane }}
