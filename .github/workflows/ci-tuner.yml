name: CI / Tuner — Chromium + Firefox + WebKit

on:
  workflow_call:
    # Defaults reproduce the merge-queue run exactly (whole matrix, one repetition). Only the manual
    # `tuner` dispatch scope in ci.yml passes anything else; scripts/tuner-args.sh validates them.
    inputs:
      project:
        type: string
        default: all
      repeat_each:
        type: string
        default: "1"
      # Flake quarantine (#1570 step 3, scripts/flake-quarantine.tsv). `exclude`: a test listed with
      # an OPEN issue leaves the required matrix and runs afterwards in the non-blocking quarantine
      # step. `off`: the manual tuner scope runs everything as required, to measure a flake.
      quarantine:
        type: string
        default: exclude

permissions:
  contents: read
  issues: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  run:
    name: Tuner — Chromium + Firefox + WebKit
    # Performance certification needs a clean, representative runner. This used to follow a full
    # visual shard on Linux, where constrained Playwright WebKit can spend >1s replacing MediaSource
    # on one persistent video even while fresh-element calibration looks fast. Keep the zero-retry
    # matrix and absolute budgets, but run it natively on isolated macOS; shipping Safari still owns
    # the maintainer soak, while this exercises the matching engine family and replacement lifecycle.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: make fe-install
      - name: Install pinned browser engines
        run: cd web && pnpm --filter @loomarr/web exec playwright install chromium firefox webkit
      - name: Resolve the flake quarantine
        env:
          GH_TOKEN: ${{ github.token }}
          TUNER_QUARANTINE: ${{ inputs.quarantine }}
        run: make tuner-quarantine
      - name: 100-Channel controller matrix
        env:
          TUNER_PROJECT: ${{ inputs.project }}
          TUNER_REPEAT_EACH: ${{ inputs.repeat_each }}
          TUNER_QUARANTINE: ${{ inputs.quarantine }}
        run: make tuner-e2e-host
      - name: Keep tuner failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tuner-failures
          path: web/apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      # The quarantined tests still run on every tuner change and still report, but they cannot
      # fail the job. A test rejoins the required step above when its issue closes.
      - name: Quarantined tests (non-blocking)
        id: quarantined
        if: inputs.quarantine == 'exclude'
        continue-on-error: true
        run: make tuner-e2e-quarantine
      - name: Keep quarantined failure evidence
        if: steps.quarantined.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tuner-quarantine-failures
          path: web/apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
