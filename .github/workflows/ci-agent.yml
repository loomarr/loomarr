name: CI / Agent harness (macOS)

on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  run:
    name: Agent harness (macOS)
    # Ordinary PR pushes get fast Linux feedback. Scarce macOS evidence is admitted by the
    # bounded-concurrency merge queue, then retained on main and deliberate manual certification.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Dependency-aware verification resolves the reverse Go import graph even when its
      # behavioral harness substitutes fake `go` and `make` commands for the final execution.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # This exercises the `lsof` process-ownership adapter. Linux runs the same harness through
      # comprehensive verification, where `/proc` is available.
      - name: Worktree isolation, claims, leases, and process ownership
        run: make agent-harness-test
      # The watermark goldens are rendered on amd64; this arm64 runner proves every architecture
      # renders the same pixels (#4646).
      - name: Watermark render on arm64
        run: go test ./internal/playout/watermark/...
      # releaseverify runs the CI shell scripts under this runner's bash 3.2 and BSD tools (#4641).
      # The runner ships Make 3.81; GNU Make 4.x is a documented requirement, and the three skipped tests probe Make 4 behaviour, which Linux CI covers.
      - name: Release scripts on bash 3.2
        run: go test -skip '^(TestParseTimeMakeExecutionProbesAreRealGNUmakeRedCases|TestVerifyCIContainerDownloadsAllowsHarmlessTargetAndPatternSpecificAssignments|TestVerifyCIContainerDownloadsRejectsTargetAndPatternSpecificShellAssignments)$' ./internal/platform/releaseverify/
