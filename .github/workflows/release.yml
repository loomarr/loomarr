# Release — on a semver tag (v1.2.3), build and publish both image variants to
# GHCR, multi-arch (amd64 + arm64), with SBOM + build provenance + keyless cosign
# signatures. The Dockerfile FE stage embeds the SPA, so the published image is
# UI-complete (design §16).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write # push images to GHCR
  id-token: write # keyless cosign signing (OIDC)

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }} # ghcr.io/mantonx/loomarr

jobs:
  images:
    name: Build & publish images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The default runtime image → :latest / :X.Y.Z
          - variant: core
            target: runtime
            suffix: ""
          # The ingest-tooling image → :filler / :X.Y.Z-filler
          - variant: filler
            target: filler
            suffix: "-filler"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          # Only cut moving/latest tags for the core variant's semver tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ matrix.variant == 'core' }}
            type=raw,value=filler,enable=${{ matrix.variant == 'filler' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
