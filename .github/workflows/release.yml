# Release — on a semver tag (v1.2.3), build and publish both image variants to
# GHCR, multi-arch (amd64 + arm64), with SBOM + build provenance + keyless cosign
# signatures. The Dockerfile FE stage embeds the SPA, so the published image is
# UI-complete (design §16).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read # require a successful main CI run for the tagged commit
  packages: write # push images to GHCR
  id-token: write # keyless cosign signing (OIDC)

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }} # ghcr.io/mantonx/loomarr

jobs:
  # ONE image, deliberately — there is no variant matrix any more.
  #
  # ⚠ This job could never have succeeded as written. It carried a second matrix leg
  # building `--target filler`, and the Dockerfile has no `filler` stage (`grep '^FROM'`
  # yields fe, build, runtime). The ingest tooling — yt-dlp, ffmpeg, deno, whisper — all
  # ships in the single runtime image (§14/§16), so the variant it targeted stopped
  # existing without this file being told. It went unnoticed because release.yml runs
  # only on a `v*` tag and no such tag had ever been cut: the first real release would
  # have published the core image and then gone red, which is the worst moment to find
  # out. Whatever else changes here, do not reintroduce a target the Dockerfile lacks.
  images:
    name: Build & publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate the release tag and source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag is not SemVer: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "release tag must point at the current main commit" >&2
            exit 1
          fi
          conclusion="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.created_at) | last | .conclusion // ""')"
          if [[ "$conclusion" != success ]]; then
            echo "tagged main commit does not have a successful push CI run (found: ${conclusion:-none})" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
