# Release — on a semver tag (v1.2.3), build and publish both image variants to
# GHCR, multi-arch (amd64 + arm64), with SBOM + build provenance + keyless cosign
# signatures. The Dockerfile FE stage embeds the SPA, so the published image is
# UI-complete (design §16).
name: Release

on:
  push:
    tags: ["v*"]

# A recreated tag cannot race another publisher for the same immutable image
# name. Queue rather than cancel so every attempt reaches an auditable result.
concurrency:
  # Global, not per tag. Two stable tags finishing out of order could otherwise move
  # `latest` backwards even though each immutable SemVer tag is individually protected.
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # require a successful main CI run for the tagged commit
  packages: write # push images to GHCR
  id-token: write # keyless cosign signing (OIDC)

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }} # ghcr.io/mantonx/loomarr

jobs:
  # ONE image, deliberately — there is no variant matrix any more.
  #
  # ⚠ This job could never have succeeded as written. It carried a second matrix leg
  # building `--target filler`, and the Dockerfile has no `filler` stage (`grep '^FROM'`
  # yields fe, build, runtime). The ingest tooling — yt-dlp, ffmpeg, deno, whisper — all
  # ships in the single runtime image (§14/§16), so the variant it targeted stopped
  # existing without this file being told. It went unnoticed because release.yml runs
  # only on a `v*` tag and no such tag had ever been cut: the first real release would
  # have published the core image and then gone red, which is the worst moment to find
  # out. Whatever else changes here, do not reintroduce a target the Dockerfile lacks.
  images:
    name: Build & publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate the release tag and source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/validate-release-source.sh

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect the immutable version tag
        shell: bash
        run: ./scripts/check-release-image-absence.sh "${IMAGE}:${GITHUB_REF_NAME#v}"

      # Push only a canonical digest. Public SemVer/latest tags do not exist yet:
      # the helper below creates them only after keyless signing and an
      # identity-bound verification of that exact digest.
      - name: Build and push digest only
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Sign, verify, and promote the release image
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          PUBLISH_LATEST: ${{ !contains(github.ref_name, '-') }}
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: ./scripts/publish-release-image.sh
