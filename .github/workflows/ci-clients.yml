name: CI / Shared clients — lint + test + browser/iOS/Android/TV bundles

on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  run:
    name: Shared clients — ${{ matrix.lane }}
    runs-on: ubuntu-latest
    # One job took 4m38s and set the pace of every web PR. The static checks, each app's tests, and
    # each app's bundles run on their own runners: a change to a shared package reruns its tests
    # and its dependents' (2m21s for both apps on one runner). The lanes key their caches apart
    # because only one Metro or Turbo cache would survive a shared key.
    strategy:
      fail-fast: false # one lane's failures must not hide the others'
      matrix:
        lane: [checks, mobile-tests, tv-tests, mobile, tv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (pinned via web/package.json packageManager)
        run: corepack enable
      # The Frontend job's store: the same path and key, so the lanes add no copy of it to the quota.
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Restore Metro and Turbo work
        id: clients-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/metro-cache
            web/.turbo
          key: clients-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            clients-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-
            clients-${{ matrix.lane }}-${{ runner.os }}-
      - run: make fe-install
      - name: Verify the affected client graph
        if: matrix.lane == 'checks'
        env:
          TMPDIR: ${{ runner.temp }}
          TURBO_TELEMETRY_DISABLED: "1"
        run: make clients-checks
      - name: Typecheck and test the client
        if: endsWith(matrix.lane, '-tests')
        env:
          TMPDIR: ${{ runner.temp }}
          TURBO_TELEMETRY_DISABLED: "1"
        run: make clients-tests CLIENTS_APP=${{ matrix.lane == 'tv-tests' && 'tv' || 'mobile' }}
      - name: Bundle the client
        if: matrix.lane == 'mobile' || matrix.lane == 'tv'
        env:
          TMPDIR: ${{ runner.temp }}
          TURBO_TELEMETRY_DISABLED: "1"
        run: make clients-bundles CLIENTS_APP=${{ matrix.lane }}
      # ⚠ Never from the merge queue (#1679): a queue batch's unique ref makes the save unreadable.
      - name: Save Metro and Turbo work (not from the merge queue)
        if: github.event_name != 'merge_group' && steps.clients-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/metro-cache
            web/.turbo
          key: ${{ steps.clients-cache.outputs.cache-primary-key }}
