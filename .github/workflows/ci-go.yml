name: CI / Go tests

on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  run:
    name: Go — race-policy tests (${{ matrix.lane }})
    # Every event runs on GitHub-hosted runners. Merge-group and main-push runs once went to two
    # self-hosted runners (#1570) that were never Loomarr's to use; with up to eight merge groups
    # building, their queue reached 200 jobs and post-merge assurance fell hours behind.
    runs-on: ubuntu-latest
    # The weighted package plan budgets each lane's test step from #1570's ten-minute Go-only queue
    # target (`scripts/go-shard.sh --budgets`). This timeout is the backstop: crossing the
    # operator-facing 15-minute budget fails loud instead of delaying the queue.
    timeout-minutes: 15
    # This job is test-only. Repository-wide contracts run once in `go-contracts`, in parallel;
    # repeating Rust, lint, vet, harness, cross-compilation, and release checks in every lane spent
    # runner time and inflated each lane's cache without adding assurance.
    #
    # TWO measured-weight ordinary lanes plus three serial `certification` lanes, which hold the media
    # certification packages and CPU-heavy packages that need a runner to themselves (scripts/
    # go-certification-lanes.tsv; store, schedule and demolibrary moved there when their shared
    # lanes passed the timeout, and the split is balanced on measured weights, #2716). Merge-group run
    # 35472062915 showed the former three-way alphabetical split at 1430/657/583 package-seconds and
    # a 31m10s critical path. The weights in scripts/go-race-weights.tsv are measured seconds
    # regenerated from hosted runs (`make go-race-weights`); longest-processing-time assignment
    # models the current tree at 1796/1796 aggregate package-seconds per ordinary lane and
    # 517/450-second worker makespans (#1570). The sharder emits that measured order and the
    # race-policy filter preserves it; restoring lexical order made heavy packages start more than
    # six minutes late in merge-group run 35510845578. `make go-shard-verify` rejects coverage,
    # bounded-worker latency, or balance drift and proves the six lanes remain an exact partition.
    #
    # -race is also SCOPED (scripts/go-race-policy.sh): a short, verified opt-out set of
    # concurrency-free config/table-test packages runs without the detector. `make go-race-verify`
    # keeps that list honest; it is fail-safe (race stays ON for anything not explicitly opted out).
    #
    # ⚠ Sharding is the one change here that can quietly SHRINK the gate — a split that drops
    # a package leaves those tests unrun and every shard green. `make go-shard-verify` below
    # is the guard, and it is not optional.
    #
    strategy:
      fail-fast: false # one lane's failures must not hide the others'
      matrix:
        lane: ["1/2", "2/2", "certification-1/3", "certification-2/3", "certification-3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # ⚠ DELIBERATELY OFF — the step below owns every Go cache path in this job.
          # `cache: true` caches `~/go/pkg/mod` AND `~/.cache/go-build` keyed on go.sum,
          # which is the SAME `~/.cache/go-build` the unified cache rolls. Both on meant
          # restoring it twice and, whenever go.sum moved, SAVING it twice: measured
          # 2026-08-09, `Post Cache golangci` 83s ran alongside `Post Run actions/setup-go`
          # 91s in one job. Worse, setup-go's half is keyed on go.sum alone — exactly the
          # frozen-key bug the note below exists to prevent — so it re-froze a slice of the
          # very cache the rolling key was added to keep fresh.
          cache: false
      # Composition tests acquire the real debug image worker through internal/testkit. Install
      # the pinned toolchain but deliberately do not cache Cargo/target here: the old combined
      # cache reached 1.36GB and cost longer to restore/save than the focused build. Static Rust
      # checks and release certification still run once in `go-contracts`. GitHub-hosted images
      # ship rustup on PATH. The components are rust-toolchain.toml's: without them each test
      # process's first cargo call installs them, and two packages doing that at once fail with
      # "failed to install component: 'clippy-preview…', detected conflict" (cmd/image-cert, #2716).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      # Each test shard keeps only its Go module and compiler caches. Lint and static Rust checks
      # run in `go-contracts`, so restoring their caches here would spend time and storage on
      # inputs this job never reads.
      #
      # ⚠ RESTORE ONLY. The `CI / Go cache warm` workflow is this cache's one writer: on the first main push
      # of each ISO week (and after a go.sum change) it compiles every lane's test binaries and
      # saves `…-<go.sum hash>-warm`. This job never saves. ci.yml never runs on a main push, so
      # a save here only ever fired on a manual dispatch on main, and it wrote a second ~2.5 GB
      # copy of every lane beside the warm one. Pull-request runs could not read their own saves
      # once the PR closed, and merge-queue runs cannot read theirs at all (#1679).
      #
      # The ISO week in the key bounds growth: Go's build cache only accretes, and a weekly
      # epoch drops the accumulation for one cold build per week. It is in the restore prefix
      # too, so a cache from an earlier epoch is never restored. Within the week the warm copy
      # still serves the race-instrumented standard library and every dependency; only packages
      # changed since it was built recompile.
      - name: Cache epoch (bounds rolling-cache growth)
        id: epoch
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Go test caches (modules + build)
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # ⚠ THE LANE IS PART OF THE KEY. Each lane compiles a DIFFERENT set of packages, so
          # a shared key would have them overwrite each other's build objects every run — each
          # lane restoring a cache built for another lane's packages and recompiling its own.
          # It also makes the save well-defined: without it all lanes race to write one key
          # and every loser simply skips, so most objects are never cached at all.
          key: go-test-${{ runner.os }}-${{ steps.epoch.outputs.week }}-${{ matrix.lane }}-${{ hashFiles('go.sum') }}-warm
          restore-keys: |
            go-test-${{ runner.os }}-${{ steps.epoch.outputs.week }}-${{ matrix.lane }}-
      # On a cache miss (new epoch, or go.sum changed) this lane's module cache is empty, so the
      # FIRST `go list ./...` this lane runs downloads the whole module graph live. Every other
      # package in the lane only resolves its own direct deps, but internal/platform/releaseverify's
      # TestGoImpactSelector shells out to scripts/go-impact.sh, which runs `go list ./...` over
      # every package in the repository — the one place in this lane that needs the FULL graph
      # in one call. Fetching it here, in its own named step with the whole job's time budget
      # behind it, turns a cold-cache network hiccup into a clear "Download Go modules" failure
      # instead of a cryptic exit status buried inside that one test (#1834). The helper retries a
      # proxy stream reset with the same bounded policy as container pulls (#1900).
      - name: Download Go modules
        run: ./scripts/go-mod-download.sh
      # Exercise the deployed media toolchain. Distribution FFmpeg versions have different
      # MPEG-TS startup latency; both executables must match the production image's pins.
      # Cache the immutable archive by digest and verify every hit before extraction.
      - name: Resolve production FFmpeg pin
        id: ffmpeg-pin
        run: ./scripts/ci-ffmpeg.sh metadata >> "$GITHUB_OUTPUT"
      - name: Restore production FFmpeg archive
        id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/loomarr-ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-pin.outputs.sha256 }}
      - name: Download production FFmpeg
        run: ./scripts/ci-ffmpeg.sh download "$HOME/.cache/loomarr-ffmpeg"
      - name: Install production FFmpeg
        run: |
          ./scripts/ci-ffmpeg.sh install "$HOME/.cache/loomarr-ffmpeg" "$RUNNER_TEMP/loomarr-ffmpeg"
          echo "$RUNNER_TEMP/loomarr-ffmpeg" >> "$GITHUB_PATH"
      - name: Verify production FFmpeg on PATH
        run: |
          test "$(command -v ffmpeg)" = "$RUNNER_TEMP/loomarr-ffmpeg/ffmpeg"
          test "$(command -v ffprobe)" = "$RUNNER_TEMP/loomarr-ffmpeg/ffprobe"
          ffmpeg -version
          ffprobe -version
      - run: make test GO_TEST_LANE=${{ matrix.lane }}
        # The lane runner pins ordinary packages to -p=4 and every reviewed serial `certification`
        # lanes to -p=1. It rejects caller-controlled GOFLAGS and retains race coverage.
      # ⚠ main only (#1679). A cache is readable from its own ref and the default branch, so a
      # pull-request, branch or merge-queue save is a per-ref copy that no other run reads.
      # The `CI / Go cache warm` workflow seeds this archive on main; this save only covers a dispatch on
      # main that finds it missing.
      - name: Save production FFmpeg archive (main only)
        if: github.ref == 'refs/heads/main' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/loomarr-ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
