packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  esbuild: true
  # @scarf/scarf is analytics/telemetry pulled in transitively — deny its build.
  "@scarf/scarf": false
  # msw's build script is `msw init` — it copies the browser SERVICE WORKER into a public
  # directory. Loomarr uses `setupServer` (Node) in vitest, which intercepts in-process and
  # needs no worker file, so the script has nothing to do here. Denied rather than left
  # unanswered: pnpm treats an unresolved entry as an install ERROR, not a warning, and
  # `pnpm codegen` runs a dep check — so an undecided build script fails codegen outright.
  msw: false

minimumReleaseAgeExclude:
  - brace-expansion@1.1.18

# esbuild (used by tsx + vitest + vite) ships a platform binary via a postinstall
# build script; pnpm blocks build scripts by default. Approve exactly this one.
onlyBuiltDependencies:
  - esbuild

# Transitive advisories we pin past. Both arrive ONLY through orval's codegen chain
# (orval → @orval/core → @ibm-cloud/openapi-ruleset → spectral), so neither is in the
# shipped artifact — what ships is the built SPA embedded in the Go binary, and orval
# runs at build time. Pinned anyway: a dev-only advisory still runs on developer and CI
# machines, and leaving it open trains us to ignore the alert list.
# Both stay within the major their dependents ask for, so no API break.
overrides:
  # GHSA: code injection via `_.template` + prototype pollution in `_.unset`/`_.omit`.
  lodash: "^4.18.1"
  # GHSA-2v37-7h3g-55p8 (high): predictable output in nanoid when given a non-integer
  # size (a randomness weakness); affects <3.3.17, patched in 3.3.17. Arrives via
  # postcss ← vite (the build/storybook toolchain), so build-time only and absent from
  # the shipped SPA — pinned anyway to keep the alert list actionable. Same-major bump.
  nanoid: "^3.3.17"
  # GHSA-5p4m-2wfm-xmqj (high): quadratic CPU consumption in `!!omap` resolution
  # (CVE-2026-59870), a newer DoS than the merge-key one and NOT backported to 4.2.x —
  # affects >=4.0.0 <4.3.1, patched in 4.3.1. Bumped from the prior `^4.2.0` pin.
  js-yaml: "^4.3.1"
  # GHSA-7p8r-x3mc-p8w7 (high): fast-uri host confusion via a backslash authority
  # introducer — a follow-on to the earlier 3.1.3 delimiter bug, now affecting
  # >=3.0.0 <3.1.5; patched in 3.1.5 (was 3.1.4). Arrives transitively through ajv@8
  # (JSON-schema validation in the codegen/OpenAPI chain). Range-scoped so it only
  # rewrites the vulnerable versions, not a future fast-uri major ajv might ask for.
  "fast-uri@>=3.0.0 <3.1.5": "3.1.5"
  # GHSA-rgw5-rvv9-x895 (high): unbounded intermediate arrays in brace-expansion — a DoS
  # that BYPASSES the earlier CVE-2026-14257 mitigation, so 5.0.8 is no longer enough;
  # affects >=4.0.0 <5.0.9, patched in 5.0.9 (was 5.0.8). Arrives via minimatch from
  # BOTH build-time chains — orval's codegen (@ibm-cloud/openapi-ruleset) and
  # @storybook/react-vite's glob — so like the three above it is absent from the shipped
  # SPA; verified by grepping internal/web/dist/assets for it. Scoped to the 5.x line
  # because that is what minimatch@10 asks for (`^5.0.5`).
  #
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
  # ⚠ **The 1.x copy DOES have a fix on its own major, and this comment used to say it did
  # not.** The old text read "1.1.16 … has no fix on its own major — 1.1.12 is the patch for
  # the OTHER advisory", and concluded the only options were leaving it vulnerable or
  # breaking minimatch@3's `^1.1.7` by forcing ^5. Both halves were wrong: **1.1.18 carries
  # CVE-2026-14257's actual fix** (`EXPANSION_MAX_LENGTH` / the `maxLength` option, bounding
  # total output characters) and is a same-major bump that `^1.1.7` accepts.
  #
  # Verified by extracting the published tarballs rather than trusting a version range:
  # 1.1.16 has ZERO `maxLength` guards, 1.1.18 has 21, 5.0.8 has 17. The advisory's own
  # remediation text names that guard, which is what makes the check unambiguous — the
  # 1.1.15 → 1.1.16 diff is a recursion-to-loop change for a DIFFERENT (stack-exhaustion)
  # issue, and mistaking it for this one is the trap this note exists to close.
  #
  # Arrives via minimatch@3 ← @stoplight/spectral-core ← orval, so build-time only and
  # absent from the shipped SPA — but "unreachable" is a reason to fix it calmly, not a
  # reason to leave a known-vulnerable version pinned when the patch is free.
  "brace-expansion@>=1.0.0 <1.1.18": "1.1.18"
