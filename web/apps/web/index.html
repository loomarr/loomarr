<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Loomarr</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Start the session gate in parallel with the module graph. The API mutator adopts
         this exact Response once, so there is still only one /v1/auth/me request. -->
    <script>
      const initialAuthResponse = fetch("/v1/auth/me", { credentials: "include" });
      initialAuthResponse.catch(() => {});
      globalThis.__loomarrInitialAuthResponse = initialAuthResponse;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
