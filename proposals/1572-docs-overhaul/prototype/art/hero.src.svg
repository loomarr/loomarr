<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t">
  <title id="t">Loomarr: always something on. A retro television showing the Loomarr test card on channel 3.</title>
  <!-- Every colour is a brand token: brand-contract.json chroma for the test card, design-system
       semantic tokens for surfaces and text. Light values here; dark values in the media query. -->
  <style>
    /*FONTS*/
    .bg { fill: #F7F8FA }            /* surface.canvas */
    .ink { fill: #17191D }           /* content.primary */
    .sub { fill: #515866 }           /* content.secondary */
    .amber { fill: #795000 }         /* action.primary */
    .set { fill: #E7EAF0; stroke: #D2D6DE; stroke-width: 2 }  /* surface.elevated, border.decorative */
    .bezel { fill: #17191D }
    .knob { fill: #D2D6DE }
    .glowstop { stop-color: #FFB020 }
    .word { font: 700 64px 'Geist', sans-serif; letter-spacing: 0.12em }
    .tag { font: 400 26px 'Geist', sans-serif }
    .mono { font: 600 22px 'Geist Mono', monospace; letter-spacing: 0.08em }
    .ch { font: 700 30px 'Geist Mono', monospace }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B0C0E } .ink { fill: #E7EAF0 } .sub { fill: #8B93A3 } .amber { fill: #FFB020 }
      .set { fill: #1B1E24; stroke: #2A2E37 } .bezel { fill: #000000 } .knob { fill: #2A2E37 }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" class="glowstop" stop-opacity="0.35"/>
      <stop offset="1" class="glowstop" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="742" y="92" width="336" height="236" rx="28"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.10"/>
    </pattern>
  </defs>

  <rect class="bg" width="1200" height="420"/>

  <!-- Wordmark and promise -->
  <text class="word ink" x="80" y="176">LOOMARR</text>
  <text class="tag sub" x="82" y="226">Describe a TV channel in a sentence.</text>
  <text class="tag sub" x="82" y="262">Loomarr builds it, plays it, and keeps it running.</text>
  <text class="mono amber" x="82" y="330">ALWAYS SOMETHING ON</text>

  <!-- Warm glow behind the set -->
  <ellipse cx="910" cy="215" rx="330" ry="220" fill="url(#glow)"/>

  <!-- The set: cabinet, screen, knobs, legs -->
  <rect class="set" x="700" y="58" width="420" height="304" rx="40"/>
  <rect class="bezel" x="732" y="82" width="356" height="256" rx="34"/>
  <g clip-path="url(#screen)">
    <!-- Test card: the seven brand chroma bars, then the castellation and ground strip -->
    <rect x="742" y="92" width="48" height="170" fill="#FFB020"/>
    <rect x="790" y="92" width="48" height="170" fill="#F5D90A"/>
    <rect x="838" y="92" width="48" height="170" fill="#3DD68C"/>
    <rect x="886" y="92" width="48" height="170" fill="#4CC9E8"/>
    <rect x="934" y="92" width="48" height="170" fill="#D6409F"/>
    <rect x="982" y="92" width="48" height="170" fill="#E5484D"/>
    <rect x="1030" y="92" width="48" height="170" fill="#8B93A3"/>
    <rect x="742" y="262" width="336" height="22" fill="#0B0C0E"/>
    <rect x="742" y="262" width="48" height="22" fill="#D6409F"/>
    <rect x="838" y="262" width="48" height="22" fill="#4CC9E8"/>
    <rect x="934" y="262" width="48" height="22" fill="#F5D90A"/>
    <rect x="1030" y="262" width="48" height="22" fill="#FFB020"/>
    <rect x="742" y="284" width="336" height="44" fill="#0B0C0E"/>
    <rect x="762" y="294" width="92" height="26" rx="6" fill="#FFB020"/>
    <text class="ch" x="774" y="317" fill="#0B0C0E">CH 3</text>
    <rect x="742" y="92" width="336" height="236" fill="url(#scan)"/>
  </g>
  <circle class="knob" cx="1100" cy="130" r="0"/>
  <rect class="set" x="760" y="362" width="18" height="30" rx="4"/>
  <rect class="set" x="1042" y="362" width="18" height="30" rx="4"/>
</svg>
