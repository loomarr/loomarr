<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
  <title id="t">A broadcast tower sending a signal, over a programme guide timeline built from the test-card colours.</title>
  <style>
    /*FONTS*/
    .bg { fill: #F7F8FA } .line { fill: none; stroke: #17191D; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round }
    .wave { fill: none; stroke: #08657A; stroke-width: 3; stroke-linecap: round }
    .rail { fill: #E7EAF0 } .now { fill: #795000 } .sub { fill: #515866 }
    .mono { font: 600 11px 'Geist Mono', monospace; letter-spacing: 0.06em }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B0C0E } .line { stroke: #E7EAF0 } .wave { stroke: #4CC9E8 } .rail { fill: #1B1E24 }
      .now { fill: #FFB020 } .sub { fill: #8B93A3 }
    }
  </style>
  <rect class="bg" width="320" height="200" rx="16"/>
  <!-- Tower -->
  <path class="line" d="M160 118 L142 150 M160 118 L178 150 M151 134 h18 M146 142 h28 M160 60 v58"/>
  <circle cx="160" cy="58" r="6" fill="#FFB020"/>
  <path class="wave" d="M146 44 a20 20 0 0 0 0 28 M174 44 a20 20 0 0 1 0 28"/>
  <path class="wave" d="M134 34 a36 36 0 0 0 0 48 M186 34 a36 36 0 0 1 0 48" opacity="0.7"/>
  <path class="wave" d="M122 24 a52 52 0 0 0 0 68 M198 24 a52 52 0 0 1 0 68" opacity="0.4"/>
  <!-- Guide timeline: programme blocks in chroma, a now-line in amber -->
  <rect class="rail" x="24" y="160" width="272" height="20" rx="6"/>
  <rect x="28" y="164" width="70" height="12" rx="3" fill="#4CC9E8"/>
  <rect x="102" y="164" width="22" height="12" rx="3" fill="#D6409F"/>
  <rect x="128" y="164" width="96" height="12" rx="3" fill="#3DD68C"/>
  <rect x="228" y="164" width="18" height="12" rx="3" fill="#F5D90A"/>
  <rect x="250" y="164" width="42" height="12" rx="3" fill="#8B93A3"/>
  <rect class="now" x="170" y="154" width="3" height="32" rx="1.5"/>
  <text class="mono sub" x="24" y="196">NOW</text>
</svg>
