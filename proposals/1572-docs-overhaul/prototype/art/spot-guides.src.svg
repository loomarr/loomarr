<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
  <title id="t">A remote control pressing channel up, from channel 3 to channel 4.</title>
  <style>
    /*FONTS*/
    .bg { fill: #F7F8FA } .line { fill: none; stroke: #17191D; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round }
    .body { fill: #E7EAF0; stroke: #17191D; stroke-width: 3 } .screen { fill: #17191D }
    .amber { fill: #FFB020 } .btn { fill: #D2D6DE } .ink0 { fill: #0B0C0E }
    .mono { font: 700 26px 'Geist Mono', monospace }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B0C0E } .line { stroke: #E7EAF0 } .body { fill: #1B1E24; stroke: #E7EAF0 }
      .screen { fill: #000000 } .btn { fill: #2A2E37 }
    }
  </style>
  <rect class="bg" width="320" height="200" rx="16"/>
  <!-- Small set, now on channel 4 -->
  <rect class="body" x="150" y="40" width="140" height="104" rx="18"/>
  <rect class="screen" x="162" y="50" width="116" height="84" rx="12"/>
  <rect x="172" y="60" width="16" height="44" fill="#FFB020"/><rect x="188" y="60" width="16" height="44" fill="#F5D90A"/>
  <rect x="204" y="60" width="16" height="44" fill="#3DD68C"/><rect x="220" y="60" width="16" height="44" fill="#4CC9E8"/>
  <rect x="236" y="60" width="16" height="44" fill="#D6409F"/><rect x="252" y="60" width="16" height="44" fill="#E5484D"/>
  <rect class="amber" x="172" y="110" width="52" height="18" rx="4"/>
  <text class="mono ink0" x="177" y="126" style="font-size:15px">CH 4</text>
  <path class="line" d="M190 160 v14 M250 160 v14"/>
  <!-- Remote, tilted, thumb on channel up -->
  <g transform="rotate(-18 80 110)">
    <rect class="body" x="52" y="46" width="58" height="128" rx="22"/>
    <circle class="btn" cx="81" cy="72" r="9"/>
    <rect class="amber" x="68" y="96" width="26" height="20" rx="6"/>
    <path d="M74 110 l7 -8 l7 8" fill="none" stroke="#0B0C0E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="btn" x="68" y="122" width="26" height="20" rx="6"/>
    <circle class="btn" cx="72" cy="156" r="4"/><circle class="btn" cx="90" cy="156" r="4"/>
  </g>
  <!-- Signal from remote to set -->
  <path class="line" d="M118 78 q10 -8 20 0 M112 66 q20 -16 40 0" style="stroke:#FFB020"/>
</svg>
