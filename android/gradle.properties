# ⚠ These limits exist because an unbounded Gradle build took this machine down.
#
# Gradle defaults `max-workers` to the CPU count — 24 on the dev box — and each worker may fork a
# JVM. Add the Kotlin daemon's own heap, an Android emulator (~2GB), the backend, the frontend dev
# server and a browser, and 31GB is gone. The failure is a hard freeze, not a build error.
#
# The numbers below are deliberately modest. An Android module this size does not benefit from 24
# workers, and the difference between a 20s and a 30s build is not worth an unusable machine.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=false

# The Kotlin daemon forks SEPARATELY from the Gradle daemon and defaults to a share of system RAM,
# so it needs its own ceiling — capping only org.gradle.jvmargs bounds half the problem.
kotlin.daemon.jvmargs=-Xmx1536m

org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
