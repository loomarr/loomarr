groups:
  - name: loomarr.recording
    interval: 30s
    rules:
      - record: loomarr:http_requests:rate5m
        expr: sum(rate(loomarr_http_requests_total[5m]))
      - record: loomarr:http_errors:ratio5m
        expr: sum(rate(loomarr_http_requests_total{code=~"5.."}[5m])) / clamp_min(sum(rate(loomarr_http_requests_total[5m])), 0.001)
      - record: loomarr:http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(loomarr_http_request_duration_seconds_bucket[5m])))
      - record: loomarr:outbound_errors:ratio5m
        expr: sum(rate(loomarr_outbound_requests_total{code=~"5..|error"}[5m])) / clamp_min(sum(rate(loomarr_outbound_requests_total[5m])), 0.001)
      - record: loomarr:database_pool_utilization:ratio
        expr: max(loomarr_database_connections{state="in_use"}) / clamp_min(max(loomarr_database_max_open_connections), 1)
