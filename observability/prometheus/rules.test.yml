rule_files:
  - alerts.yml
  - recording-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'loomarr_metrics_scrape_errors_total{source="titles"}'
        values: '0+1x20'
      - series: 'loomarr_scheduler_job_executions_total{job="reconcile",result="timeout",trigger="scheduled"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LoomarrMetricsScrapeErrors
        exp_alerts:
          - exp_labels:
              alertname: LoomarrMetricsScrapeErrors
              severity: warning
              source: titles
            exp_annotations:
              summary: Loomarr could not collect live store metrics
              description: Inspect Loomarr logs and database health; one or more scrape-time store queries failed.
      - eval_time: 10m
        alertname: LoomarrSchedulerJobFailing
        exp_alerts:
          - exp_labels:
              alertname: LoomarrSchedulerJobFailing
              severity: warning
              job: reconcile
            exp_annotations:
              summary: Loomarr scheduled Job is failing
              description: Job reconcile has failed, timed out, or panicked in the last 15 minutes.
