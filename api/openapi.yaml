      tags:
        - filler
  /v1/filler/discover:
    get:
      description: "Admin only (§10, V33). Searches archive.org by keyword and returns candidates WITHOUT downloading anything — the operator is deciding what to fetch, and making them download to find out would defeat the point. Results carry only what the source's search index knows: no duration, no tags, and no licence (see below). Feed an id to POST /v1/filler/ingest to actually fetch it. Synchronous: one upstream request, no job to poll."
      operationId: discover-filler
      parameters:
        - description: Words to search for, e.g. "1980s cereal commercial"
          explode: false
          in: query
          name: q
          required: true
          schema:
            description: Words to search for, e.g. "1980s cereal commercial"
            minLength: 2
            type: string
        - description: Max results (default 25)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results (default 25)
            format: int64
            maximum: 25
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Search archive.org for clips to add
      tags:
        - filler
  /v1/filler/ingest:
    post:
      operationId: ingest-filler
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestFillerInputBody"
