components:
  schemas:
    AppliedRelaxation:
      additionalProperties: false
      properties:
        from:
          type: string
        kind:
          type: string
        to:
          type: string
      required:
        - kind
        - from
        - to
      type: object
    ApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        status:
          type: string
      required:
        - status
        - enqueued
      type: object
    AudiencePolicy:
      additionalProperties: false
      properties:
        ceiling:
          type: string
        unrated:
          type: string
      type: object
    BootstrapInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BootstrapInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: The owning admin's password (bcrypt-hashed at rest).
          type: string
        username:
          description: The owning admin's local username.
          type: string
      required:
        - username
        - password
      type: object
    BootstrapOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BootstrapOutputBody.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        name:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - role
      type: object
    ChannelDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChannelDTO.json
          format: uri
          readOnly: true
          type: string
        group:
          examples:
            - Kids
          type: string
        id:
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          description: Guide channel number
          examples:
            - 42
          format: int64
          type: integer
        policy:
          $ref: "#/components/schemas/ChannelPolicy"
          description: Programming policy (scope/audience/separation/ordering/seasonal) + applied relaxations
        programCount:
          description: Real playable programs in the desired lineup
          format: int64
          type: integer
        slotCount:
          description: Total slots incl. filler/flex placeholders
          format: int64
          type: integer
        status:
          description: Loomarr-side channel status (§9)
          enum:
            - building
            - live
            - drifted
            - detached
          type: string
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
        tunarrId:
          description: Server-assigned Tunarr channel id; empty until first reconcile
          type: string
      required:
        - id
        - name
        - number
        - strategy
        - status
        - programCount
        - slotCount
        - policy
      type: object
    ChannelNowNext:
      additionalProperties: false
      properties:
        channelId:
          description: Loomarr channel id
          type: string
        next:
          $ref: "#/components/schemas/NowNextEntry"
        now:
          $ref: "#/components/schemas/NowNextEntry"
      required:
        - channelId
      type: object
    ChannelPolicy:
      additionalProperties: false
      properties:
        applied:
          items:
            $ref: "#/components/schemas/AppliedRelaxation"
          type:
            - array
            - "null"
        audience:
          $ref: "#/components/schemas/AudiencePolicy"
        ordering:
          type: string
        scope:
          $ref: "#/components/schemas/ScopePolicy"
        seasonal:
          $ref: "#/components/schemas/SeasonalPolicy"
        separation:
          $ref: "#/components/schemas/SeparationPolicy"
      type: object
    ClipDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClipDTO.json
          format: uri
          readOnly: true
          type: string
        aiTagged:
          type: boolean
        audience:
          enum:
            - kids
            - family
            - general
            - late_night
            - ""
          type: string
        category:
          type: string
        durationMs:
          format: int64
          type: integer
        era:
          format: int64
          type: integer
        kind:
          enum:
            - commercial
            - bumper
            - station_id
            - psa
            - trailer
            - interstitial
          type: string
        name:
          type: string
        source:
          type: string
        tagged:
          description: Whether the clip has all match tags (era+audience+category)
          type: boolean
        tunarrProgramId:
          type: string
      required:
        - tunarrProgramId
        - name
        - kind
        - durationMs
        - aiTagged
        - tagged
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateChannelInputBody.json
          format: uri
          readOnly: true
          type: string
        group:
          examples:
            - Kids
          type: string
        id:
          description: Loomarr channel id (caller-assigned, stable)
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        logo:
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          examples:
            - 42
          format: int64
          minimum: 1
          type: integer
        series:
          $ref: "#/components/schemas/SeriesStruct"
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
      required:
        - id
        - name
        - number
        - strategy
      type: object
    DenyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyInputBody.json
          format: uri
          readOnly: true
          type: string
        reason:
          type: string
      type: object
    DenyOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    DocSummary:
      additionalProperties: false
      properties:
        slug:
          examples:
            - troubleshooting
          type: string
        title:
          examples:
            - Troubleshooting
          type: string
      required:
        - slug
        - title
      type: object
    EnqueueInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnqueueInputBody.json
          format: uri
          readOnly: true
          type: string
        mediaType:
          enum:
            - movie
            - series
          type: string
        name:
          type: string
        seasons:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        tmdbId:
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - mediaType
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GenreFilter:
      additionalProperties: false
      properties:
        exclude:
          items:
            type: string
          type:
            - array
            - "null"
        include:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    GetDocOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetDocOutputBody.json
          format: uri
          readOnly: true
          type: string
        markdown:
          type: string
        slug:
          type: string
        title:
          type: string
      required:
        - slug
        - title
        - markdown
      type: object
    HostedModelView:
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        recommended:
          description: Rule-selected top pick (cheap + tool-capable)
          type: boolean
        tools:
          description: Provider advertises tool-calling for this model
          type: boolean
        why:
          description: Rule-derived rationale (from live pricing/context/tools metadata)
          type: string
      required:
        - id
        - label
      type: object
    HostedProviderView:
      additionalProperties: false
      properties:
        active:
          description: This is the currently-selected provider
          type: boolean
        baseUrl:
          type: string
        key:
          description: Loomarr provider id (openrouter|custom)
          type: string
        keyConfigured:
          description: A key is stored for this provider (value never returned)
          type: boolean
        keysUrl:
          description: Where to obtain an API key
          type: string
        label:
          type: string
        models:
          items:
            $ref: "#/components/schemas/HostedModelView"
          type:
            - array
            - "null"
        modelsLive:
          description: Models were fetched live from the provider (false = curated fallback)
          type: boolean
        note:
          type: string
      required:
        - key
        - label
        - baseUrl
        - keysUrl
        - keyConfigured
        - active
        - modelsLive
        - models
      type: object
    ImportCandidate:
      additionalProperties: false
      properties:
        disabled:
          description: Disabled on the media server.
          type: boolean
        id:
          description: Media-server user id — the value POST /v1/users/import takes.
          type: string
        imported:
          description: Already allowlisted in Loomarr.
          type: boolean
        isAdmin:
          description: Admin on the media server; import may map this to a Loomarr admin.
          type: boolean
        name:
          type: string
      required:
        - id
        - name
        - isAdmin
        - disabled
        - imported
      type: object
    ImportCandidatesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ImportCandidatesOutputBody.json
          format: uri
          readOnly: true
          type: string
        candidates:
          items:
            $ref: "#/components/schemas/ImportCandidate"
          type:
            - array
            - "null"
      required:
        - candidates
      type: object
    ImportUsersInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ImportUsersInputBody.json
          format: uri
          readOnly: true
          type: string
        ids:
          description: Media-server user ids to allowlist.
          items:
            type: string
          type:
            - array
            - "null"
        makeAdmin:
          description: Grant admin to imported users that are media-server admins (default member).
          type: boolean
      required:
        - ids
      type: object
    ImportUsersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ImportUsersOutputBody.json
          format: uri
          readOnly: true
          type: string
        imported:
          description: How many rows were created/updated.
          format: int64
          type: integer
      required:
        - imported
      type: object
    IngestFillerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/IngestFillerInputBody.json
          format: uri
          readOnly: true
          type: string
        urls:
          description: YouTube playlist/video or Archive.org collection/item URLs
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - urls
      type: object
    IngestFillerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/IngestFillerOutputBody.json
          format: uri
          readOnly: true
          type: string
        jobId:
          description: Watch /v1/events for filler_ingest frames carrying this id
          type: string
      required:
        - jobId
      type: object
    Intent:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Intent.json
          format: uri
          readOnly: true
          type: string
        description:
          type: string
        era:
          type: string
        maxAcquisitions:
          format: int64
          type: integer
        mustExclude:
          items:
            type: string
          type:
            - array
            - "null"
        mustInclude:
          items:
            type: string
          type:
            - array
            - "null"
        runtimeTargetMin:
          format: int64
          type: integer
        tone:
          type: string
      required:
        - description
      type: object
    LLMModelView:
      additionalProperties: false
      properties:
        approxVramGiB:
          format: double
          type: number
        fit:
          description: fits|tight|wont_fit against detected VRAM
          type: string
        label:
          type: string
        pulled:
          description: Already present in the local Ollama
          type: boolean
        recommended:
          type: boolean
        runtimeOk:
          description: Detected Ollama version supports this model
          type: boolean
        tag:
          type: string
        why:
          type: string
      required:
        - tag
        - label
        - approxVramGiB
        - fit
        - pulled
        - runtimeOk
        - recommended
        - why
      type: object
    ListChannelsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListChannelsOutputBody.json
          format: uri
          readOnly: true
          type: string
        channels:
          items:
            $ref: "#/components/schemas/ChannelDTO"
          type:
            - array
            - "null"
      required:
        - channels
      type: object
    ListDocsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListDocsOutputBody.json
          format: uri
          readOnly: true
          type: string
        docs:
          items:
            $ref: "#/components/schemas/DocSummary"
          type:
            - array
            - "null"
      required:
        - docs
      type: object
    ListFillerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListFillerOutputBody.json
          format: uri
          readOnly: true
          type: string
        clips:
          items:
            $ref: "#/components/schemas/ClipDTO"
          type:
            - array
            - "null"
      required:
        - clips
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListOutputBody.json
          format: uri
          readOnly: true
          type: string
        titles:
          items:
            $ref: "#/components/schemas/TitleDTO"
          type:
            - array
            - "null"
      required:
        - titles
      type: object
    ListProposalsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListProposalsOutputBody.json
          format: uri
          readOnly: true
          type: string
        proposals:
          items:
            $ref: "#/components/schemas/ProposalDTO"
          type:
            - array
            - "null"
      required:
        - proposals
      type: object
    ListUserSessionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListUserSessionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        sessions:
          items:
            $ref: "#/components/schemas/SessionBody"
          type:
            - array
            - "null"
      required:
        - sessions
      type: object
    ListUsersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListUsersOutputBody.json
          format: uri
          readOnly: true
          type: string
        users:
          items:
            $ref: "#/components/schemas/UserBody"
          type:
            - array
            - "null"
      required:
        - users
      type: object
    LivetvConnectOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LivetvConnectOutputBody.json
          format: uri
          readOnly: true
          type: string
        alreadyWired:
          description: Nothing changed — Tunarr was already wired (§6 idempotent)
          type: boolean
        listingAdded:
          description: An xmltv guide was registered this call
          type: boolean
        tunerAdded:
          description: An m3u tuner was registered this call
          type: boolean
      required:
        - tunerAdded
        - listingAdded
        - alreadyWired
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LoginInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          format: password
          type: string
        username:
          type: string
      required:
        - username
        - password
      type: object
    MeBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MeBody.json
          format: uri
          readOnly: true
          type: string
        autoApprove:
          type: boolean
        disabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        quota:
          format: int64
          type: integer
        role:
          enum:
            - admin
            - member
          type: string
      required:
        - id
        - name
        - role
        - disabled
        - quota
        - autoApprove
      type: object
    NowNextEntry:
      additionalProperties: false
      properties:
        gap:
          description: A flex/commercial-pod gap rather than a program
          type: boolean
        startMs:
          description: Epoch ms; airtime as Tunarr scheduled it
          format: int64
          type: integer
        stopMs:
          format: int64
          type: integer
        title:
          type: string
        tmdbId:
          description: Joins to a provisioning key (movie:tmdb:<id>) when known
          type: string
      required:
        - title
        - startMs
        - stopMs
        - gap
      type: object
    NowNextOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/NowNextOutputBody.json
          format: uri
          readOnly: true
          type: string
        channels:
          items:
            $ref: "#/components/schemas/ChannelNowNext"
          type:
            - array
            - "null"
      required:
        - channels
      type: object
    PatchClipInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PatchClipInputBody.json
          format: uri
          readOnly: true
          type: string
        audience:
          enum:
            - kids
            - family
            - general
            - late_night
            - ""
          type: string
        category:
          type: string
        era:
          format: int64
          type: integer
        kind:
          enum:
            - commercial
            - bumper
            - station_id
            - psa
            - trailer
            - interstitial
            - ""
          type: string
      type: object
    PatchUserInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PatchUserInputBody.json
          format: uri
          readOnly: true
          type: string
        autoApprove:
          type: boolean
        disabled:
          type: boolean
        quota:
          format: int64
          type: integer
        role:
          enum:
            - admin
            - member
          type: string
      type: object
    PodEntryDTO:
      additionalProperties: false
      properties:
        durationMs:
          format: int64
          type: integer
        isFallbackCard:
          description: The embedded default bumper card — the bottom of the fallback ladder
          type: boolean
        kind:
          enum:
            - commercial
            - bumper
            - station_id
            - psa
            - trailer
            - interstitial
          type: string
        name:
          type: string
        tunarrProgramId:
          description: Empty for the embedded fallback bumper card, which is not a Tunarr program
          type: string
      required:
        - name
        - kind
        - durationMs
        - isFallbackCard
      type: object
    PreviewPodsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PreviewPodsOutputBody.json
          format: uri
          readOnly: true
          type: string
        entries:
          items:
            $ref: "#/components/schemas/PodEntryDTO"
          type:
            - array
            - "null"
        matchLevel:
          description: How far down the fallback ladder assembly went (§10)
          enum:
            - exact
            - widened
            - audience
            - bumper_card
          type: string
        totalMs:
          format: int64
          type: integer
      required:
        - entries
        - totalMs
        - matchLevel
      type: object
    Proposal:
      additionalProperties: false
      properties:
        acquisitions:
          items:
            $ref: "#/components/schemas/ProposalItem"
          type:
            - array
            - "null"
        alternates:
          items:
            $ref: "#/components/schemas/ProposalItem"
          type:
            - array
            - "null"
        intent:
          $ref: "#/components/schemas/Intent"
        lineup:
          items:
            $ref: "#/components/schemas/ProposalItem"
          type:
            - array
            - "null"
        policy:
          $ref: "#/components/schemas/ChannelPolicy"
        rationale:
          type: string
        scores:
          $ref: "#/components/schemas/Scores"
      required:
        - intent
        - lineup
        - acquisitions
        - alternates
        - scores
      type: object
    ProposalDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ProposalDTO.json
          format: uri
          readOnly: true
          type: string
        approvedBy:
          type: string
        createdBy:
          type: string
        denyReason:
          type: string
        id:
          type: string
        jobId:
