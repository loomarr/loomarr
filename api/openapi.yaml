                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: How well the catalog covers this channel's breaks
      tags:
        - channels
        - filler
  /v1/channels/{id}/icon:
    get:
      description: "Public, no credential: Tunarr and the media server fetch this machine-to-machine while building the guide. 404 when the channel uses a TMDB/URL logo or none. Cached for a day; the ?v= cache-bust changes on re-upload."
