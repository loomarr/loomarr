            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read one help page as markdown
      tags:
        - help
  /v1/filler:
    get:
      description: Filter by kind/era/audience/category.
      operationId: list-filler
      parameters:
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - commercial
              - bumper
              - station_id
              - psa
              - trailer
              - interstitial
            type: string
        - explode: false
          in: query
          name: era
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: audience
          schema:
            enum:
              - kids
              - family
              - general
              - late_night
            type: string
        - explode: false
          in: query
          name: category
          schema:
            type: string
        - description: Only commercials missing match tags
          explode: false
          in: query
          name: untagged
          schema:
            description: Only commercials missing match tags
            type: boolean
        - description: Case-insensitive substring match on the clip name
          explode: false
          in: query
          name: q
          schema:
            description: Case-insensitive substring match on the clip name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List filler clips
      tags:
        - filler
  /v1/filler/bulk/remove:
    post:
      description: "Admin only (§10 V35). ⚠ A TOMBSTONE, not a delete: the clip stops appearing in the catalog and stops being used in commercial breaks, and **the file is left exactly where it is**. Nothing in Loomarr deletes an operator's media. It survives re-scans, which a row delete could not — the next scan would find the file and put it back. Pass `restore:true` to undo."
      operationId: bulk-remove-filler
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRemoveFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a selection from the catalog
      tags:
        - filler
  /v1/filler/bulk/tag:
    post:
      description: "Admin only (§10 V35) — the Catalog tab's bulk bar. Each tag field is INDEPENDENT: omitting one leaves it alone, so setting only the audience never blanks the era. Selected clips that no longer exist are counted as `missing` rather than failing the batch, because a selection races a re-scan."
      operationId: bulk-tag-filler
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTagFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retag a selection of clips
      tags:
        - filler
  /v1/filler/discover:
    get:
      description: "Admin only (§10, V33). Searches archive.org by keyword and returns candidates WITHOUT downloading anything — the operator is deciding what to fetch, and making them download to find out would defeat the point. Results carry only what the source's search index knows: no tags, no licence (see below), and no duration or quality — those cost a metadata call per row, so ask GET /v1/filler/discover/stats for the rows you are showing. Feed an id to POST /v1/filler/ingest to actually fetch it. Synchronous: one upstream request, no job to poll."
      operationId: discover-filler
      parameters:
        - description: Words to search for, e.g. "1980s cereal commercial". Mutually exclusive with the collection parameter.
          explode: false
          in: query
          name: q
          schema:
            description: Words to search for, e.g. "1980s cereal commercial". Mutually exclusive with the collection parameter.
            minLength: 2
            type: string
        - description: "An archive.org collection to list: a URL, a /details/<id> path, or a bare identifier. Mutually exclusive with the q parameter."
          explode: false
          in: query
          name: collection
          schema:
            description: "An archive.org collection to list: a URL, a /details/<id> path, or a bare identifier. Mutually exclusive with the q parameter."
            type: string
        - description: Max results (default 25)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results (default 25)
            format: int64
            maximum: 25
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Search archive.org for clips to add
      tags:
        - filler
  /v1/filler/discover/stats:
    get:
      description: "Admin only (§10, V35). Fills in the duration and quality a search deliberately omits. ⚠ This is ONE UPSTREAM CALL PER ID and archive.org is slow (median 1.8s, and it gets slower if asked for more at once), so send only the ids currently on screen — a full page of 25 measured 22.6s. An id archive.org cannot answer for is ABSENT from the response rather than zero: 0 would be indistinguishable from a genuinely empty clip."
      operationId: discover-filler-stats
      parameters:
        - description: Comma-separated result ids to describe
          explode: false
          in: query
          name: id
          required: true
          schema:
            description: Comma-separated result ids to describe
            items:
              type: string
            maxItems: 25
            type:
              - array
              - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverStatsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Runtime and quality for specific search results
      tags:
        - filler
  /v1/filler/file:
    post:
      description: "Admin only (§10 V38). Admits held clips to the playable catalog — they become matchable into pods. With `asSuggested`, each clip's OWN ungrounded era guess is confirmed as it files (the mock's \"File all as suggested\"), which `bulk/tag` cannot express because it applies one era to the whole selection. Filing by hand CLEARS the auto-filed marker: a human looked."
      operationId: file-filler-clips
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: File held clips into the catalog
      tags:
        - filler
  /v1/filler/fit:
    get:
      description: "The override picker's per-channel note (§10 V35). For every channel: which rung of the §10 ladder this clip would be drawn from, or WHY it would never be picked, plus the operator's pin/exclude state. Computed from the SAME predicates assembly uses, through the same per-channel selection as the pod preview — a note that disagrees with what airs is a confident wrong answer about why a channel looks the way it does. Read-only. ⚠ A PINNED clip reports no rung and no reason: a pin is placed ahead of the ladder, so it has none. ⚠ Every channel is listed, including paused ones — pinning to a paused channel is a decision that takes effect when it resumes."
      operationId: clip-channel-fit
      parameters:
        - description: The clip's path (its identity, §10)
          explode: false
          in: query
          name: clip
          required: true
          schema:
            description: The clip's path (its identity, §10)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipFitOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Where this clip lands on each channel's ladder
      tags:
        - filler
        - channels
  /v1/filler/hold:
    post:
      description: "Admin only (§10 V38). The undo for auto-filing: a clip Loomarr filed without asking goes back to Incoming and stops being matched into pods. ⚠ It does NOT remove the clip or touch the file — that is \"Remove from catalog\", a different action with a different promise."
      operationId: hold-filler-clips
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send clips back to the review queue
      tags:
        - filler
  /v1/filler/hover/{hash}:
    get:
      description: Any authenticated user. A few seconds of silent animation, so a grid of stills can answer "is this actually the advert it says it is?" without opening anything.
      operationId: filler-hover
      parameters:
        - description: The clip's content hash (from ClipDTO)
          in: path
          name: hash
          required: true
          schema:
            description: The clip's content hash (from ClipDTO)
            examples:
              - 9f2b1c4e8a7d6503
            type: string
      responses:
        "200":
          content:
            image/webp:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: An animated WebP.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A clip's hover preview
      tags:
        - filler
  /v1/filler/incoming:
    get:
      description: "Admin only (§10 V35) — the Filler page's Incoming tab. Two halves in ONE read: clips whose tags need a human (an AI era the tagger could not ground in the clip's text, or a commercial with no match tags), and compilations mid-split. ⚠ No confidence score is returned, because nothing measures one — `reason` reports the real state instead."
      operationId: filler-incoming
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillerIncomingOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What has been downloaded but isn't filed yet
      tags:
        - filler
  /v1/filler/ingest:
    post:
      operationId: ingest-filler
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download clips into the drop-folder (admin; needs the vendored yt-dlp + ffmpeg)
      tags:
        - filler
  /v1/filler/media/{hash}:
    get:
      description: Any authenticated user. The clip itself, so an operator can watch one before deciding about it. Range-capable, so a <video> element can seek. The exact media type comes from a short server-side allowlist keyed by extension.
      operationId: filler-media
      parameters:
        - description: The clip's content hash (from ClipDTO)
          in: path
          name: hash
          required: true
          schema:
            description: The clip's content hash (from ClipDTO)
            examples:
              - 9f2b1c4e8a7d6503
            type: string
      responses:
        "200":
          content:
            audio/*:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
            video/*:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The clip's own bytes.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A clip's own bytes
      tags:
        - filler
  /v1/filler/pool:
    get:
      description: How well the catalog can fill breaks across the whole install (§10 V35) — the Filler page's pool strip. Counts what exists (clips, commercials, duration-eligible, untagged) and lists every live channel's coverage, WORST FIRST. The per-channel answers are the SAME `Coverage` computation `/v1/channels/{id}/filler/coverage` returns, called once per channel, so this page and the channel page cannot disagree — there is no aggregate ladder to drift from the real one. Read-only, so any authenticated user may call it.
      operationId: filler-pool
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Catalog-wide filler health
      tags:
        - filler
  /v1/filler/pulls:
    get:
      description: Admin only (§10 V35). `status` filters (pending | approved | dismissed); omit it for all. Decided pulls are KEPT — the queue's History answers what was agreed to and who said so.
      operationId: list-filler-pulls
      parameters:
        - description: Omit for all
          explode: false
          in: query
          name: status
          schema:
            description: Omit for all
            enum:
              - pending
              - approved
              - dismissed
              - ""
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFillerPullsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List pulls awaiting a decision
      tags:
        - filler
    post:
      description: "Admin only (§10 V35). Composes a plan across the ENABLED filler sources and writes it to the approval queue. ⚠ **Downloads nothing** — that is the whole point: the machine proposes, a human commits. Refused with 409 when every source the plan would need is switched off, naming the switch to flip rather than writing a pull that could never run."
      operationId: propose-filler-pull
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeFillerPullInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Propose a pull
      tags:
        - filler
  /v1/filler/pulls/{id}/approve:
    post:
      description: "Admin only (§10 V35). THE gate: this is the only path on which a pull downloads anything, and it enqueues through the EXISTING ingest job rather than a route of its own. The body carries the operator's edits — rows dropped, and a note narrowing what to fetch. Dropped rows are recorded, not erased. Approving an already-decided pull is a 409, so a double-click cannot enqueue twice."
      operationId: approve-filler-pull
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveFillerPullInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a pull — the commit point
      tags:
        - filler
  /v1/filler/pulls/{id}/dismiss:
    post:
      description: Admin only (§10 V35). Records the decision and downloads nothing. The row is kept.
      operationId: dismiss-filler-pull
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Decline a pull
      tags:
        - filler
  /v1/filler/sources:
    get:
      description: Admin only. Derived from the configured drop-folder and library scan plus live per-source clip counts — there is no sources table (§10). A source the install could use but has not configured is returned with configured:false rather than omitted.
      operationId: list-filler-sources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillerSourcesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Where the clip catalog comes from
      tags:
        - filler
    post:
      description: Admin only (§10 V35). Registers an archive.org collection so pulls and searches can use it. Registering DOWNLOADS NOTHING — it records that this source exists and is allowed; fetching is the ingest path, and a composed multi-source pull goes through the approval gate.
      operationId: add-filler-source
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFillerSourceInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteSourceDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Register a remote collection to pull filler from
      tags:
        - filler
  /v1/filler/sources/fetch:
    post:
      description: Admin only. Runs the same sync as POST /v1/filler/sync — the Sources tab's per-row `Fetch now`. Separate operation id so the UI's affordance is nameable, same work.
      operationId: fetch-filler-source
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchFillerSourceOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Re-scan the catalog now
      tags:
        - filler
  /v1/filler/sources/{id}:
    delete:
      description: Admin only (§10 V35). ⚠ Clips it already brought in are NOT deleted — they are real files, already tagged and possibly pinned into a channel, and forgetting where something came from is not a reason to throw it away. Only the registered remotes can be deleted; the derived folder and library rows describe configuration, which is changed in Settings.
      operationId: delete-filler-source
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Forget a registered remote collection
      tags:
        - filler
    patch:
      description: "Admin only (§10 V35, extended V38c). Off means Loomarr stops scanning, searching and downloading from this source. ⚠ It does NOT remove clips already in the catalog, and it is not a delete: the source keeps its licence and fetch history, so switching it back on resumes rather than restarts. `folder` writes the drop-folder setting; any other id writes that source's own row. ⚠ `fetchEverySeconds` is three-state — omit or send null to inherit the global, 0 to never auto-fetch this source, or a positive number of seconds. Library sources became switchable in V38c, when §10 restored them to being scanned."
      operationId: set-filler-source-enabled
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFillerSourceEnabledInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetFillerSourceEnabledOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Switch a source on or off, and tune how often it is fetched
      tags:
        - filler
  /v1/filler/split:
    post:
      description: "Admin only (§10, V34). The clip is identified by `path` in the body (§10 V45a). Runs detection — chapters → blackdetect/silencedetect → transcript rescue for over-long segments — as a background job (progress on /v1/events as filler_split frames), producing a PERSISTED split proposal. Nothing enters the catalog: review is not optional, because detection quality is a property of the source."
      operationId: split-filler
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Propose splits for a compilation clip
      tags:
        - filler
  /v1/filler/splits/{proposalId}:
    get:
      description: Admin only (§10, V34). The review surface's source of truth on SSE reconnect — the same pattern as /v1/proposals/{id}.
      operationId: get-filler-split
      parameters:
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitProposal"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read a split proposal
      tags:
        - filler
  /v1/filler/splits/{proposalId}/confirm:
    post:
      description: "Admin only (§10, V34). The body is the operator's confirmed cut list — the proposal as returned, possibly edited (cuts moved/merged/dropped; era suggestions accepted or rejected; dedup-flagged segments kept or skipped). Only now do segments become catalog clips: cut with ffmpeg stream copy, and the original compilation row removed — its identity is a path that now means twenty clips, not one."
      operationId: confirm-filler-split
      parameters:
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmFillerSplitInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmFillerSplitOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Commit a reviewed split
      tags:
        - filler
  /v1/filler/sync:
    post:
      description: Admin only (§10).
      operationId: sync-filler
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sync the clip catalog from the media server
      tags:
        - filler
  /v1/filler/tag:
    post:
      description: Admin only. Text-signal classification (§10).
      operationId: tag-filler
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: AI-tag untagged clips
      tags:
        - filler
  /v1/filler/tags:
    patch:
      description: Admin only. The clip is identified by `path` in the body (§10 V45a).
      operationId: tag-filler-clip
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchClipInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a clip's tags
      tags:
        - filler
  /v1/filler/thumb/{hash}:
    get:
      description: Any authenticated user. The extracted frame ClipDTO.thumbnail points at.
      operationId: filler-thumb
      parameters:
        - description: The clip's content hash (from ClipDTO)
          in: path
          name: hash
          required: true
          schema:
            description: The clip's content hash (from ClipDTO)
            examples:
              - 9f2b1c4e8a7d6503
            type: string
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: A JPEG still.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A clip's thumbnail frame
      tags:
        - filler
  /v1/filler/watch:
    get:
      description: "The Filler page header's live status (§10 V38c): how many sources are on, how many clips the catalog holds, when anything last arrived, and a health verdict. ⚠ The verdict is computed on the SERVER — the rule ('every source dark', 'nothing has arrived in days') is domain logic, and deriving it in the client would also have left members with a permanently grey indicator, since the sources listing is admin-only. Read-only and member-visible: it names no paths, targets or ids — only counts and a verdict."
      operationId: filler-watch
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillerWatchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Is filler working right now
      tags:
        - filler
  /v1/guide:
    get:
      description: "Per-channel programme timelines across [from, to), for Loomarr's own time grid. Commercial pods, pending acquisitions and flex are all returned with a `kind` discriminator rather than being filtered or collapsed to a boolean, so the grid can draw them distinctly. Times are absolute epoch ms; a block already in progress reports its real start. NOT the XMLTV guide a media server reads — that is /playout/guide.xml. Read-only: any authenticated user (§8.1 viewer-facing)."
      operationId: channel-guide
      parameters:
        - description: Window start, epoch ms. Defaults to now.
          explode: false
          in: query
          name: from
          schema:
            description: Window start, epoch ms. Defaults to now.
            format: int64
            type: integer
        - description: Window end, epoch ms. Defaults to 4 hours after the window start.
          explode: false
          in: query
          name: to
          schema:
            description: Window end, epoch ms. Defaults to 4 hours after the window start.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every channel's timeline over a window
      tags:
        - channels
  /v1/jobs:
    get:
      description: Admin only. The scheduler's named jobs with their effective interval, last/next run, result, and running state (§18.1). All timing is server-authored.
      operationId: jobs-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List background jobs
      tags:
        - jobs
  /v1/jobs/{name}/pause:
    post:
      description: "Admin only. Pausing stops a job running on its schedule (§18.1); it stays listed, keeps its cron, and reports no next run. Run now still works on a paused job — pause stops the schedule, not the task. A job this backend cannot run at all (a non-empty disabledReason) returns 409: that is an environment fact, not an operator preference."
      operationId: jobs-pause
      parameters:
        - description: Job name (the stable id from GET /v1/jobs)
          in: path
          name: name
          required: true
          schema:
            description: Job name (the stable id from GET /v1/jobs)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobsPauseInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Pause or resume a job
      tags:
        - jobs
  /v1/jobs/{name}/run:
    post:
      description: "Admin only. Triggers a scheduled job off-cycle (§18.1). Idempotent-ish: a job already due/running is not double-run (the scheduler lease guards it). A job this backend cannot run (a non-empty disabledReason) returns 409."
      operationId: jobs-run
      parameters:
        - description: The job's stable id (from GET /v1/jobs)
          in: path
          name: name
          required: true
          schema:
            description: The job's stable id (from GET /v1/jobs)
            type: string
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run a job now
      tags:
        - jobs
  /v1/library/collections:
    get:
      operationId: listLibraryCollections
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List media-server collections
      tags:
        - library
  /v1/playout/guide.xml:
    get:
      operationId: playout-guide
      responses:
        "200":
          content:
            application/xml:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: XMLTV listings for every internally-played channel.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Playout XMLTV guide (device-authed)
      tags:
        - playout
  /v1/playout/hls/{id}/master.m3u8:
    get:
      operationId: playout-hls-master
      parameters:
        - description: Loomarr channel id
          in: path
          name: id
          required: true
          schema:
            description: Loomarr channel id
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/vnd.apple.mpegurl:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The HLS master playlist for the in-app and native players.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Channel HLS master playlist (signed-URL authed)
      tags:
        - playout
  /v1/playout/hls/{id}/{asset}:
    get:
      operationId: playout-hls-asset
      parameters:
        - description: Loomarr channel id
          in: path
          name: id
          required: true
          schema:
            description: Loomarr channel id
            examples:
              - ch_abc123
            type: string
        - description: A file beside the master playlist — a segment, or the media playlist
          in: path
          name: asset
          required: true
          schema:
            description: A file beside the master playlist — a segment, or the media playlist
            examples:
              - seg-7.ts
            type: string
      responses:
        "200":
          content:
            application/vnd.apple.mpegurl:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
            video/mp2t:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: A segment, or the media playlist beside the master.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Channel HLS segment or media playlist (signed-URL authed)
      tags:
        - playout
  /v1/playout/playlist/{id}:
    get:
      operationId: playout-playlist
      parameters:
        - description: Loomarr channel id
          in: path
          name: id
          required: true
          schema:
            description: Loomarr channel id
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The ffconcat playlist the parent ffmpeg reads to sequence programs.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Channel ffconcat playlist (device-authed)
      tags:
        - playout
  /v1/playout/program/{id}:
    get:
      operationId: playout-program
      parameters:
        - description: Loomarr channel id
          in: path
          name: id
          required: true
          schema:
            description: Loomarr channel id
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            video/mp2t:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: One program's transport stream; the concat demuxer re-opens this per program.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One program's MPEG-TS (device-authed)
      tags:
        - playout
  /v1/playout/sessions:
    get:
      description: "Per-channel encoder state for the dashboard: viewers, resolved encoder, realtime speed and buffer-ahead. Admin only. The `playout` SSE frame carries the same snapshot for liveness; this endpoint is the source of truth on reconnect."
      operationId: get-playout-telemetry
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayoutTelemetry"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Live internal-playout encoder telemetry (admin)
      tags:
        - dashboard
  /v1/playout/status:
    get:
      description: "A read-only health projection of live internal playout: per (channel, target) encoder + realtime-speed verdict (ok|degraded|stalled), plus the GPU/VRAM and resident-LLM contention picture that a black-frame diagnosis needs. Admin only. Changes nothing."
      operationId: get-playout-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayoutStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Playout status — why a channel is (or isn't) playing (admin)
      tags:
        - dashboard
  /v1/playout/stream/{id}:
    get:
      operationId: playout-stream
      parameters:
        - description: Loomarr channel id
          in: path
          name: id
          required: true
          schema:
            description: Loomarr channel id
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            video/mp2t:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: A continuous transport stream of whatever the channel is playing now.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Channel MPEG-TS stream (device-authed)
      tags:
        - playout
  /v1/playout/tuner.m3u:
    get:
      operationId: playout-tuner
      responses:
        "200":
          content:
            application/vnd.apple.mpegurl:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The M3U tuner list a media server registers as a Live TV source.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Playout tuner M3U (device-authed)
      tags:
        - playout
  /v1/programming/vocabulary:
    get:
      description: "The WHEN/WHAT/HOW curation-rule presets (§6.6): each token with its label and the value the BE lowers it to. The rules editor renders its picker from this and lowers identically to the server — so a hand-authored rule and an LLM-authored one are byte-identical, and the FE no longer hand-mirrors the lowering table. Read-only; any authenticated user."
      operationId: get-programming-vocabulary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vocabulary"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The closed rule authoring vocabulary
      tags:
        - channels
  /v1/proposals:
    get:
      description: status=submitted is the approval queue.
      operationId: list-proposals
      parameters:
        - description: Filter by status; submitted = the approval queue
          explode: false
          in: query
          name: status
          schema:
            description: Filter by status; submitted = the approval queue
            enum:
              - submitted
              - approved
              - denied
            type: string
        - description: Scope to the caller's own proposals (the My requests surface). Resolved from the session, not from a user id.
          explode: false
          in: query
          name: mine
          schema:
            description: Scope to the caller's own proposals (the My requests surface). Resolved from the session, not from a user id.
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProposalsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List proposals by status
      tags:
        - proposals
    post:
      description: Any authenticated user (§8).
      operationId: submit-proposal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Intent"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Start a proposal job from an intent
      tags:
        - proposals
  /v1/proposals/approve:
    post:
      description: Admin only. Approves each id through the SAME single-approve gate (§8) — no batch path. Returns a per-id result so one already-handled proposal does not hide the rest.
      operationId: bulk-approve-proposals
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkApproveInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkApproveOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve several proposals (admin)
      tags:
        - proposals
  /v1/proposals/{id}:
    get:
      operationId: get-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a proposal + its job status
      tags:
        - proposals
  /v1/proposals/{id}/approve:
    post:
      description: Admin only. Enqueues acquisitions through the approval gate (§8).
      operationId: approve-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalEditDTO"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a proposal (admin)
      tags:
        - proposals
  /v1/proposals/{id}/deny:
    post:
      description: Admin only.
      operationId: deny-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DenyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DenyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Deny a proposal (admin)
      tags:
        - proposals
  /v1/search:
    get:
      operationId: search
      parameters:
        - description: Search terms
          explode: false
          in: query
          name: q
          schema:
            description: Search terms
            type: string
        - description: Corpus to search (default all). Clips are not searchable here — use /v1/filler?q=
          explode: false
          in: query
          name: scope
          schema:
            description: Corpus to search (default all). Clips are not searchable here — use /v1/filler?q=
            enum:
              - library
              - tmdb
              - all
            type: string
        - description: Max results (default 20)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results (default 20)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Federated search (library + TMDB)
      tags:
        - search
  /v1/sessions/{hash}:
    delete:
      operationId: revoke-session
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke one session (admin)
      tags:
        - users
  /v1/settings:
    get:
      description: Admin only. Every registry setting with resolved value (secrets masked), provenance, and audit (config-design §8).
      operationId: settings-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List settings
      tags:
        - settings
    patch:
      description: Admin only. Per-key results (saved | invalid | pinned); hot-applies on success (config-design §8).
      operationId: settings-patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatchInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPatchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update settings
      tags:
        - settings
  /v1/settings/secrets/{name}:
    get:
      description: Admin only. Returns a displayable generated secret's current value (API_TOKEN — config-design §4's eye toggle). SESSION_SECRET reports displayable:false and withholds the value. Reading never rotates.
      operationId: secret-reveal
      parameters:
        - description: Which generated secret to reveal.
          in: path
          name: name
          required: true
          schema:
            description: Which generated secret to reveal.
            enum:
              - session_secret
              - api_token
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRevealOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reveal a generated secret
      tags:
        - settings
  /v1/settings/secrets/{name}/regenerate:
    post:
      description: Admin only. Rotates SESSION_SECRET | API_TOKEN with the §4 side-effects; the new value is returned only if displayable.
      operationId: secret-regenerate
      parameters:
        - description: Which generated secret to rotate.
          in: path
          name: name
          required: true
          schema:
            description: Which generated secret to rotate.
            enum:
              - session_secret
              - api_token
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRegenerateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Regenerate a generated secret
      tags:
        - settings
  /v1/settings/{key}:
    delete:
      description: Admin only. Drops the stored override so the key reverts to env/default — the explicit clear, and the only way to unset a secret (config-design §8/§9).
      operationId: settings-clear
      parameters:
        - description: Registry key to clear, e.g. seerr.api_key.
          in: path
          name: key
          required: true
          schema:
            description: Registry key to clear, e.g. seerr.api_key.
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Clear a setting
      tags:
        - settings
  /v1/settings/{key}/env-override:
    put:
      description: Admin only. Sets or clears the durable claim that this key is app-managed even though its environment variable is set (config-design §3.1). Unlocking seeds the stored value from the env value it takes over, so nothing changes until the operator saves; a secret never seeds. 404 unknown key (bootstrap keys are not in the registry), 409 when the environment does not pin the key.
      operationId: settings-env-override
      parameters:
        - description: Registry key, e.g. seerr.url.
          in: path
          name: key
          required: true
          schema:
            description: Registry key, e.g. seerr.url.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsEnvOverrideInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Take a setting back from the environment
      tags:
        - settings
  /v1/setup/bootstrap:
    post:
      description: "First-run only: creates the owning local admin. Succeeds exactly once (409 once an admin exists). Unauthenticated by design — it is functional only while no admin exists (§11)."
      operationId: bootstrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create the first admin
      tags:
        - setup
  /v1/setup/livetv-reconnect:
    post:
      description: Admin only. Removes + re-adds Loomarr's Tunarr tuner in the media server and re-scans it, clearing a STALE channel→stream binding (the media server streaming a since-deleted channel id — 'guide right, plays wrong'). Use when a channel plays the wrong content in the media server but is correct in Tunarr (§6/§9).
      operationId: livetv-reconnect
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivetvReconnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Force-re-wire the Tunarr tuner
      tags:
        - setup
  /v1/setup/state:
    get:
      description: Unauthenticated. Reports only whether bootstrap has happened, so the frontend can route a first-run visitor to the wizard instead of a login they cannot pass (§7/§13). Exposes nothing that POST /v1/setup/bootstrap doesn't already reveal by answering 409-vs-created.
      operationId: setup-state
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Whether the install has an owning admin
      tags:
        - setup
  /v1/setup/status:
    get:
      description: Admin only. Per-integration pass/fail (§13).
      operationId: setup-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Connection checklist
      tags:
        - setup
  /v1/setup/test:
    post:
      description: Admin only. Powers the per-block Test buttons (config-design §8).
      operationId: setup-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsTestInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsTestOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run one connection check
      tags:
        - settings
  /v1/setup/tunarr-connect:
    post:
      description: Admin only. Ensures Tunarr's Emby/Jellyfin source (Loomarr's admin token) + enables/scans the movie/show libraries. One-time, idempotent (§6).
      operationId: tunarr-connect
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunarrConnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Wire the library as Tunarr's media source
      tags:
        - setup
  /v1/system/backups:
    get:
      description: Admin only. What the scheduled backup job has written into the configured directory, plus the schedule and retention in force. A directory that does not exist yet is an empty list, not an error — nothing written yet is the normal state of a fresh install.
      operationId: system-backups-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Backups on disk, newest first
      tags:
        - system
    post:
      description: Admin only. Writes one snapshot into the configured directory and prunes to the retention policy — the same work the scheduled job does, without waiting for it.
      operationId: system-backups-run
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupEntry"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Write a backup now
      tags:
        - system
  /v1/system/backups/{name}:
    get:
      description: Admin only. Streams one file from the backup directory, honouring Range so a large download can resume. See `system-database-backup` to write a new one.
      operationId: system-backups-download
      parameters:
        - description: Backup filename, as listed by system-backups-list
          in: path
          name: name
          required: true
          schema:
            description: Backup filename, as listed by system-backups-list
            examples:
              - loomarr-2026-08-08T02-00-00Z.db
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The backup file.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download an already-written backup
      tags:
        - system
  /v1/system/database:
    get:
      description: Admin only. Which backend is live, whether a migration is offered, and how far one has got — including per-table row counts and the parity verdict.
      operationId: system-database-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Active backend + migration progress
      tags:
        - system
  /v1/system/database/backup:
    post:
      description: Admin only. Writes a server-side snapshot into the configured backup directory. This is the gate the migrate call enforces — a backup is required, not suggested, because it is the only thing that makes the move reversible.
      operationId: system-database-backup
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseBackup"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Write the pre-migration backup
      tags:
        - system
  /v1/system/database/migrate:
    post:
      description: "Admin only. Refuses without a passing preflight and a backup. The source is only ever read: on any failure the install is still running on SQLite and nothing was lost. Progress streams over /v1/events as `database` frames."
      operationId: system-database-migrate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTargetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Copy every table into the target and verify parity
      tags:
        - system
  /v1/system/database/preflight:
    post:
      description: Admin only. Runs every check against the target and returns them all — a check that ran and failed comes back with ok:false rather than as an error, so the operator sees which one. Nothing is written to either database.
      operationId: system-database-preflight
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTargetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabasePreflightOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Probe a candidate PostgreSQL target
      tags:
        - system
  /v1/system/database/switchover:
    post:
      description: Admin only. Persists the new DATABASE_URL to the bootstrap file. Takes effect on restart; the SQLite file is left in place untouched, so reverting is a one-line change.
      operationId: system-database-switchover
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTargetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseSwitchoverOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Point the next boot at the migrated database
      tags:
        - system
  /v1/system/llm:
    get:
      description: "Admin only. Active provider + model; the local-model catalog (for Ollama: detected VRAM/version, fit verdicts, recommended default, pulled flags); and the hosted-provider catalog (base URLs, live model lists, keyConfigured). API keys are never returned (§8.1)."
      operationId: system-llm-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLLMStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: LLM host probe + model catalog
      tags:
        - system
  /v1/system/llm/discover:
    get:
      description: "Admin only. Returns the most-popular downloadable GGUF models (Hugging Face) that are COMPATIBLE with this machine, ranked best-first (§8.1): each repo's best-fitting quant is chosen against detected VRAM and repos where nothing fits are dropped. Each result carries a pullRef to hand to POST /pull. Tool-capability is confirmed only AFTER the model is pulled and probed. Best-effort: if the source is unreachable the list is empty (browse on huggingface.co)."
      operationId: system-llm-discover
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-discoverResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Compatible downloadable local models
      tags:
        - system
  /v1/system/llm/pull:
    post:
      description: Admin only. Local Ollama only (409 on a hosted provider). Starts a pull as a background job; percent-complete streams over /v1/events (§8.1). Idempotent.
      operationId: system-llm-pull
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMPullInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-pullResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download a local model
      tags:
        - system
  /v1/system/llm/select:
    post:
      description: "Admin only. Persists the choice and hot-swaps the running suggester with no restart (§8.1). Local model must be pulled (409 else). Hosted: an optional apiKey is validated live before committing (401 on a bad key) and stored as a secret, never echoed."
      operationId: system-llm-select
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMSelectInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLLMStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Select the active provider + model
      tags:
        - system
  /v1/system/llm/test:
    post:
      description: Admin only. Validates a hosted provider + API key WITHOUT swapping (§8.1). Returns ok + an error hint; a bad key is ok=false (not a 5xx).
      operationId: system-llm-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMTestInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-testResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Test a hosted provider + key
      tags:
        - system
  /v1/system/reload:
    post:
      description: Admin only. Re-runs the connection checks without restarting or tearing anything down — no downtime. Uses the same probe implementation as the wizard's checklist, so the two can never disagree.
      operationId: system-reload
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemReloadOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Re-probe every configured service
      tags:
        - system
  /v1/system/restart:
    get:
      description: Admin only. The live count of channels Loomarr is streaming (which drop for a few seconds; Tunarr-backed channels keep playing), plus any boot-time setting waiting on a restart. Read-only — this does not restart anything.
      operationId: system-restart-cost
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartCost"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What a restart would cost right now
      tags:
        - system
    post:
      description: Admin only. Drains connections, tears down playout, and rebuilds every subsystem in the same process (§9.2) — no supervisor required. Responds before the drain begins, because a client that never gets a reply cannot tell 'restarting' from 'crashed'.
      operationId: system-restart
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Restart Loomarr in place
      tags:
        - system
  /v1/system/services:
    get:
      description: Admin only. Runs the SAME connection checks as the wizard checklist and /v1/system/reload — one probe implementation, so the three surfaces cannot disagree about whether the media server is reachable. Polled by the Dashboard every 30s.
      operationId: system-services
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every configured integration and whether it answers
      tags:
        - system
  /v1/system/version:
    get:
      description: What the operator quotes in a bug report, plus the readiness /readyz reports. /healthz and /readyz stay unauthenticated for orchestrators; this is their typed, authenticated twin for the UI.
      operationId: system-version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemVersionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Version and readiness of this instance
      tags:
        - system
  /v1/taxonomy:
    get:
      description: The operator-editable tag graph the filler tagger grounds against and curation matches over (§10 V45a). Ordered by axis then slug. Read-only, so any authenticated user may call it.
      operationId: list-taxonomy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTaxonomyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The clip tag vocabulary (the taxonomy graph)
      tags:
        - filler
    post:
      description: Admin only. Reindexes the catalog's rolled-up tags (§10 V45a).
      operationId: create-taxon
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxonDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxonDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a taxon
      tags:
        - filler
  /v1/taxonomy/{slug}:
    delete:
      description: Admin only. Children are reparented to the grandparent; reindexes (§10 V45a).
      operationId: delete-taxon
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a taxon
      tags:
        - filler
    put:
      description: Admin only. Reindexes the catalog's rolled-up tags (§10 V45a).
      operationId: update-taxon
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxonDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxonDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a taxon
      tags:
        - filler
  /v1/titles:
    get:
      operationId: list-titles
      parameters:
        - description: Filter by state
          explode: false
          in: query
          name: state
          schema:
            description: Filter by state
            enum:
              - wanted
              - requested
              - downloading
              - available
              - unavailable
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List titles, optionally filtered by state
      tags:
        - titles
    post:
      description: Idempotent by external id (§4). Admin only.
      operationId: enqueue-title
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Enqueue/ensure a title
      tags:
        - titles
  /v1/titles/{key}:
    delete:
      description: Admin only.
      operationId: delete-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Give up / cancel a title
      tags:
        - titles
    get:
      operationId: get-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a title's provisioning state
      tags:
        - titles
