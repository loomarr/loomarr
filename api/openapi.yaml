components:
  schemas:
    AppliedRelaxation:
      additionalProperties: false
      properties:
        from:
          type: string
        kind:
          type: string
        to:
          type: string
      required:
        - kind
        - from
        - to
      type: object
    ApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        status:
          type: string
      required:
        - status
        - enqueued
      type: object
    AudiencePolicy:
      additionalProperties: false
      properties:
        ceiling:
          type: string
        unrated:
          type: string
      type: object
    ChannelDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChannelDTO.json
          format: uri
          readOnly: true
          type: string
        group:
          examples:
            - Kids
          type: string
        id:
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          description: Guide channel number
          examples:
            - 42
          format: int64
          type: integer
        policy:
          $ref: "#/components/schemas/ChannelPolicy"
          description: Programming policy (scope/audience/separation/ordering/seasonal) + applied relaxations
        programCount:
          description: Real playable programs in the desired lineup
          format: int64
          type: integer
        slotCount:
          description: Total slots incl. filler/flex placeholders
          format: int64
          type: integer
        status:
          description: Loomarr-side channel status (§9)
          enum:
            - building
            - live
            - drifted
            - detached
          type: string
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
        tunarrId:
          description: Server-assigned Tunarr channel id; empty until first reconcile
          type: string
      required:
        - id
        - name
        - number
        - strategy
        - status
        - programCount
        - slotCount
        - policy
      type: object
    ChannelPolicy:
      additionalProperties: false
      properties:
        applied:
          items:
            $ref: "#/components/schemas/AppliedRelaxation"
          type:
            - array
            - "null"
        audience:
          $ref: "#/components/schemas/AudiencePolicy"
        ordering:
          type: string
        scope:
          $ref: "#/components/schemas/ScopePolicy"
        seasonal:
          $ref: "#/components/schemas/SeasonalPolicy"
        separation:
          $ref: "#/components/schemas/SeparationPolicy"
      type: object
    ClipDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClipDTO.json
          format: uri
          readOnly: true
          type: string
        aiTagged:
          type: boolean
        audience:
          enum:
            - kids
            - family
            - general
            - late_night
            - ""
          type: string
        category:
          type: string
        durationMs:
          format: int64
          type: integer
        era:
          format: int64
          type: integer
        kind:
          enum:
            - commercial
            - bumper
            - station_id
            - psa
            - trailer
            - interstitial
          type: string
        name:
          type: string
        source:
          type: string
        tagged:
          description: Whether the clip has all match tags (era+audience+category)
          type: boolean
        tunarrProgramId:
          type: string
      required:
        - tunarrProgramId
        - name
        - kind
        - durationMs
        - aiTagged
        - tagged
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateChannelInputBody.json
          format: uri
          readOnly: true
          type: string
        group:
          examples:
            - Kids
          type: string
        id:
          description: Loomarr channel id (caller-assigned, stable)
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        logo:
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          examples:
            - 42
          format: int64
          minimum: 1
          type: integer
        series:
          $ref: "#/components/schemas/SeriesStruct"
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
      required:
        - id
        - name
        - number
        - strategy
      type: object
    DenyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyInputBody.json
          format: uri
          readOnly: true
          type: string
        reason:
          type: string
      type: object
    DenyOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    EnqueueInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnqueueInputBody.json
          format: uri
          readOnly: true
          type: string
        mediaType:
          enum:
            - movie
            - series
          type: string
        name:
          type: string
        seasons:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        tmdbId:
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - mediaType
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GenreFilter:
      additionalProperties: false
      properties:
        exclude:
          items:
            type: string
          type:
            - array
            - "null"
        include:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    HostedModelView:
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        recommended:
          description: Rule-selected top pick (cheap + tool-capable)
          type: boolean
        tools:
          description: Provider advertises tool-calling for this model
          type: boolean
        why:
          description: Rule-derived rationale (from live pricing/context/tools metadata)
          type: string
      required:
        - id
        - label
      type: object
    HostedProviderView:
      additionalProperties: false
      properties:
        active:
          description: This is the currently-selected provider
          type: boolean
        baseUrl:
          type: string
        key:
          description: Loomarr provider id (openrouter|openai|anthropic|groq|gemini)
          type: string
        keyConfigured:
          description: A key is stored for this provider (value never returned)
          type: boolean
        keysUrl:
          description: Where to obtain an API key
          type: string
        label:
          type: string
        models:
          items:
            $ref: "#/components/schemas/HostedModelView"
          type:
            - array
            - "null"
        modelsLive:
          description: Models were fetched live from the provider (false = curated fallback)
          type: boolean
        note:
          type: string
      required:
        - key
        - label
        - baseUrl
        - keysUrl
        - keyConfigured
        - active
        - modelsLive
        - models
      type: object
    LLMModelView:
      additionalProperties: false
      properties:
        approxVramGiB:
          format: double
          type: number
        fit:
          description: fits|tight|wont_fit against detected VRAM
          type: string
        label:
          type: string
        pulled:
          description: Already present in the local Ollama
          type: boolean
        recommended:
          type: boolean
        runtimeOk:
          description: Detected Ollama version supports this model
          type: boolean
        tag:
          type: string
        why:
          type: string
      required:
        - tag
        - label
        - approxVramGiB
        - fit
        - pulled
        - runtimeOk
        - recommended
        - why
      type: object
    ListChannelsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListChannelsOutputBody.json
          format: uri
          readOnly: true
          type: string
        channels:
          items:
            $ref: "#/components/schemas/ChannelDTO"
          type:
            - array
            - "null"
      required:
        - channels
      type: object
    ListFillerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListFillerOutputBody.json
          format: uri
          readOnly: true
          type: string
        clips:
          items:
            $ref: "#/components/schemas/ClipDTO"
          type:
            - array
            - "null"
      required:
        - clips
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListOutputBody.json
          format: uri
          readOnly: true
          type: string
        titles:
          items:
            $ref: "#/components/schemas/TitleDTO"
          type:
            - array
            - "null"
      required:
        - titles
      type: object
    ListProposalsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListProposalsOutputBody.json
          format: uri
          readOnly: true
          type: string
        proposals:
          items:
            $ref: "#/components/schemas/ProposalDTO"
          type:
            - array
            - "null"
      required:
        - proposals
      type: object
    ListUsersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListUsersOutputBody.json
          format: uri
          readOnly: true
          type: string
        users:
          items:
            $ref: "#/components/schemas/UserBody"
          type:
            - array
            - "null"
      required:
        - users
      type: object
    LivetvConnectOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LivetvConnectOutputBody.json
          format: uri
          readOnly: true
          type: string
        alreadyWired:
          description: Nothing changed — Tunarr was already wired (§6 idempotent)
          type: boolean
        listingAdded:
          description: An xmltv guide was registered this call
          type: boolean
        tunerAdded:
          description: An m3u tuner was registered this call
          type: boolean
      required:
        - tunerAdded
        - listingAdded
        - alreadyWired
      type: object
    PatchClipInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PatchClipInputBody.json
          format: uri
          readOnly: true
          type: string
        audience:
          enum:
            - kids
            - family
            - general
            - late_night
            - ""
          type: string
        category:
          type: string
        era:
          format: int64
          type: integer
      type: object
    PatchUserInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PatchUserInputBody.json
          format: uri
          readOnly: true
          type: string
        autoApprove:
          type: boolean
        disabled:
          type: boolean
        quota:
          format: int64
          type: integer
        role:
          enum:
            - admin
            - member
          type: string
      type: object
    ProposalDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ProposalDTO.json
          format: uri
          readOnly: true
          type: string
        approvedBy:
          type: string
        createdBy:
          type: string
        denyReason:
          type: string
        id:
          type: string
        jobId:
          type: string
        proposal: {}
        status:
          enum:
            - submitted
            - approved
            - denied
          type: string
      required:
        - id
        - jobId
        - status
        - proposal
      type: object
    Range:
      additionalProperties: false
      properties:
        from:
          format: int64
          type: integer
        to:
          format: int64
          type: integer
      type: object
    ScopePolicy:
      additionalProperties: false
      properties:
        collections:
          items:
            type: string
          type:
            - array
            - "null"
        era:
          $ref: "#/components/schemas/Range"
        genres:
          $ref: "#/components/schemas/GenreFilter"
        runtimeMax:
          format: int64
          type: integer
        seasons:
          $ref: "#/components/schemas/Range"
        series:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    SearchCandidate:
      additionalProperties: false
      properties:
        inLibrary:
          type: boolean
        libraryItemId:
          type: string
        mediaType:
          type: string
        name:
          type: string
        tmdbId:
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - mediaType
        - name
        - inLibrary
      type: object
    SearchOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SearchOutputBody.json
          format: uri
          readOnly: true
          type: string
        candidates:
          items:
            $ref: "#/components/schemas/SearchCandidate"
          type:
            - array
            - "null"
      required:
        - candidates
      type: object
    SeasonalPolicy:
      additionalProperties: false
      properties:
        holidays:
          items:
            type: string
          type:
            - array
            - "null"
        mode:
          type: string
        offSeason:
          type: string
      type: object
    SeparationPolicy:
      additionalProperties: false
      properties:
        blockMax:
          format: int64
          type: integer
        episodeNoRepeat:
          format: int64
          type: integer
        movieNoRepeat:
          format: int64
          type: integer
        seriesMinGap:
          format: int64
          type: integer
      type: object
    SeriesStruct:
      additionalProperties: false
      properties:
        key:
          description: provisioning key, e.g. series:tvdb:71663
          examples:
            - series:tvdb:71663
          type: string
        seasonMax:
          description: last season (inclusive; 0 = unbounded)
          format: int64
          type: integer
        seasonMin:
          description: first season (inclusive; 0 = unbounded)
          format: int64
          type: integer
        title:
          type: string
      required:
        - key
      type: object
    SetupCheck:
      additionalProperties: false
      properties:
        hint:
          description: Actionable hint when not OK (§13)
          type: string
        name:
          description: Integration key
          examples:
            - livetv
          type: string
        ok:
          type: boolean
      required:
        - name
        - ok
      type: object
    SetupStatusOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SetupStatusOutputBody.json
          format: uri
          readOnly: true
          type: string
        checks:
          items:
            $ref: "#/components/schemas/SetupCheck"
          type:
            - array
            - "null"
      required:
        - checks
      type: object
    SubmitInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SubmitInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          examples:
            - 90s action movies
          type: string
        era:
          type: string
        maxAcquisitions:
          format: int64
          type: integer
        mustExclude:
          items:
            type: string
          type:
            - array
            - "null"
        mustInclude:
          items:
            type: string
          type:
            - array
            - "null"
        tone:
          type: string
      required:
        - description
      type: object
    SubmitOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SubmitOutputBody.json
          format: uri
          readOnly: true
          type: string
        jobId:
          type: string
      required:
        - jobId
      type: object
    SyncFillerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SyncFillerOutputBody.json
          format: uri
          readOnly: true
          type: string
        added:
          format: int64
          type: integer
        pruned:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
        updated:
          format: int64
          type: integer
      required:
        - total
        - added
        - updated
        - pruned
      type: object
    System-llm-pullResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/System-llm-pullResponse.json
          format: uri
          readOnly: true
          type: string
        jobId:
          description: Poll progress on /v1/events (type=llm_pull)
          type: string
      required:
        - jobId
      type: object
    System-llm-testResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/System-llm-testResponse.json
          format: uri
          readOnly: true
          type: string
        error:
          type: string
        ok:
          type: boolean
      required:
        - ok
      type: object
    SystemLLMPullInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SystemLLMPullInputBody.json
          format: uri
          readOnly: true
          type: string
        model:
          description: Ollama model tag to download
          examples:
            - qwen3.5:9b
          type: string
      required:
        - model
      type: object
    SystemLLMSelectInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SystemLLMSelectInputBody.json
          format: uri
          readOnly: true
          type: string
        apiKey:
          description: Hosted API key (validated live, stored as a secret, never echoed). Omit to reuse a stored key.
          examples:
            - sk-or-v1-…
          type: string
        model:
          description: "Model tag/id to activate. Local: must be pulled. Hosted: any id the provider serves."
          examples:
            - openai/gpt-4o-mini
          type: string
        provider:
          description: "Provider: ollama (local) or a hosted key (openrouter|openai|anthropic|groq|gemini). Empty = ollama."
          examples:
            - openrouter
          type: string
      required:
        - model
      type: object
    SystemLLMStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SystemLLMStatus.json
          format: uri
          readOnly: true
          type: string
        catalog:
          description: Curated local models annotated for this machine
          items:
            $ref: "#/components/schemas/LLMModelView"
          type:
            - array
            - "null"
        gpuName:
          type: string
        hosted:
          description: Curated hosted providers + recommended models
          items:
            $ref: "#/components/schemas/HostedProviderView"
          type:
            - array
            - "null"
        local:
          description: True for local Ollama (probe + local catalog apply)
          type: boolean
        model:
          description: Currently active model tag/id
          type: string
        ollamaVersion:
          type: string
        provider:
          description: "Active provider: ollama|openai"
          type: string
        reachable:
          description: LLM host answered the probe
          type: boolean
        recommended:
          description: Best-fit local model tag for this machine
          type: string
        vramGiB:
          description: Detected GPU VRAM (0 = unknown/none)
          format: double
          type: number
      required:
        - provider
        - model
        - local
        - reachable
        - catalog
        - hosted
      type: object
    SystemLLMTestInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SystemLLMTestInputBody.json
          format: uri
          readOnly: true
          type: string
        apiKey:
          description: Key to test; omit to test a stored key
          examples:
            - sk-or-v1-…
          type: string
        provider:
          description: Hosted provider key to test (openrouter|openai|anthropic|groq|gemini)
          examples:
            - openrouter
          type: string
      required:
        - provider
      type: object
    TagFillerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TagFillerOutputBody.json
          format: uri
          readOnly: true
          type: string
        considered:
          format: int64
          type: integer
        partial:
          format: int64
          type: integer
        skipped:
          format: int64
          type: integer
        tagged:
          format: int64
          type: integer
      required:
        - considered
        - tagged
        - partial
        - skipped
      type: object
    TitleDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TitleDTO.json
          format: uri
          readOnly: true
          type: string
        key:
          description: Stable identity key
          examples:
            - movie:tmdb:1111867
          type: string
        libraryId:
          type: string
        mediaType:
          enum:
            - movie
            - series
          examples:
            - movie
          type: string
        name:
          examples:
            - In Flames
          type: string
        state:
          description: Provisioning state (§4)
          enum:
            - wanted
            - requested
            - downloading
            - available
            - unavailable
          type: string
        tmdbId:
          examples:
            - 1111867
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          examples:
            - 2023
          format: int64
          type: integer
      required:
        - key
        - mediaType
        - state
      type: object
    UserBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UserBody.json
          format: uri
          readOnly: true
          type: string
        autoApprove:
          type: boolean
        disabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        quota:
          format: int64
          type: integer
        role:
          enum:
            - admin
            - member
          type: string
      required:
        - id
        - name
        - role
        - disabled
        - quota
        - autoApprove
      type: object
info:
  description: "Turn a sentence into a self-maintaining Tunarr channel. Every /v1 route requires a session cookie or Authorization: Bearer API_TOKEN (§7)."
  title: Loomarr API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/channels:
    get:
      operationId: list-channels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List channels
      tags:
        - channels
    post:
      description: Admin only. From an approved proposal or hand-made.
      operationId: create-channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a channel
      tags:
        - channels
  /v1/channels/{id}:
    delete:
      description: Admin only. Detaches by default (§7).
      operationId: delete-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "Also delete the Tunarr channel (default: detach only, §7)"
          explode: false
          in: query
          name: purge
          schema:
            description: "Also delete the Tunarr channel (default: detach only, §7)"
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a channel
      tags:
        - channels
    get:
      operationId: get-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a channel definition + status
      tags:
        - channels
  /v1/channels/{id}/reconcile:
    post:
      description: Admin only. Idempotent (§9).
      operationId: reconcile-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Force desired→Tunarr reconciliation
      tags:
        - channels
  /v1/filler:
    get:
      description: Filter by kind/era/audience/category.
      operationId: list-filler
      parameters:
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - commercial
              - bumper
              - station_id
              - psa
              - trailer
              - interstitial
            type: string
        - explode: false
          in: query
          name: era
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: audience
          schema:
            enum:
              - kids
              - family
              - general
              - late_night
            type: string
        - explode: false
          in: query
          name: category
          schema:
            type: string
        - description: Only commercials missing match tags
          explode: false
          in: query
          name: untagged
          schema:
            description: Only commercials missing match tags
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List filler clips
      tags:
        - filler
  /v1/filler/sync:
    post:
      description: Admin only (§10).
      operationId: sync-filler
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sync the clip catalog from the media server
      tags:
        - filler
  /v1/filler/tag:
    post:
      description: Admin only. Text-signal classification (§10).
      operationId: tag-filler
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: AI-tag untagged clips
      tags:
        - filler
  /v1/filler/{id}:
    patch:
      description: Admin only.
      operationId: tag-filler-clip
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchClipInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a clip's tags
      tags:
        - filler
  /v1/search:
    get:
      operationId: search
      parameters:
        - description: Search terms
          explode: false
          in: query
          name: q
          schema:
            description: Search terms
            type: string
        - description: Corpus to search (default all)
          explode: false
          in: query
          name: scope
          schema:
            description: Corpus to search (default all)
            enum:
              - library
              - tmdb
              - clips
              - all
            type: string
        - description: Max results (default 20)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results (default 20)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Federated search (library + TMDB + clips)
      tags:
        - search
  /v1/setup/livetv-connect:
    post:
      description: Admin only. One-time, idempotent (§6).
      operationId: livetv-connect
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivetvConnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Wire Tunarr as a tuner + guide
      tags:
        - setup
  /v1/setup/status:
    get:
      description: Admin only. Per-integration pass/fail (§13).
      operationId: setup-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Connection checklist
      tags:
        - setup
  /v1/suggestions:
    get:
      description: status=submitted is the approval queue.
      operationId: list-proposals
      parameters:
        - description: Filter by status; submitted = the approval queue
          explode: false
          in: query
          name: status
          schema:
            description: Filter by status; submitted = the approval queue
            enum:
              - submitted
              - approved
              - denied
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProposalsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List proposals by status
      tags:
        - suggestions
    post:
      description: Any authenticated user (§8).
      operationId: submit-suggestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Start a suggestion job from an intent
      tags:
        - suggestions
  /v1/suggestions/{id}:
    get:
      operationId: get-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a proposal + its job status
      tags:
        - suggestions
  /v1/suggestions/{id}/approve:
    post:
      description: Admin only. Enqueues acquisitions through the approval gate (§8).
      operationId: approve-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a proposal (admin)
      tags:
        - suggestions
  /v1/suggestions/{id}/deny:
    post:
      description: Admin only.
      operationId: deny-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DenyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DenyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Deny a proposal (admin)
      tags:
        - suggestions
  /v1/system/llm:
    get:
      description: "Admin only. Active provider + model; the local-model catalog (for Ollama: detected VRAM/version, fit verdicts, recommended default, pulled flags); and the hosted-provider catalog (base URLs, live model lists, keyConfigured). API keys are never returned (§8.1)."
      operationId: system-llm-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLLMStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: LLM host probe + model catalog
      tags:
        - system
  /v1/system/llm/pull:
    post:
      description: Admin only. Local Ollama only (409 on a hosted provider). Starts a pull as a background job; percent-complete streams over /v1/events (§8.1). Idempotent.
      operationId: system-llm-pull
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMPullInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-pullResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download a local model
      tags:
        - system
  /v1/system/llm/select:
    post:
      description: "Admin only. Persists the choice and hot-swaps the running suggester with no restart (§8.1). Local model must be pulled (409 else). Hosted: an optional apiKey is validated live before committing (401 on a bad key) and stored as a secret, never echoed."
      operationId: system-llm-select
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMSelectInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLLMStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Select the active provider + model
      tags:
        - system
  /v1/system/llm/test:
    post:
      description: Admin only. Validates a hosted provider + API key WITHOUT swapping (§8.1). Returns ok + an error hint; a bad key is ok=false (not a 5xx).
      operationId: system-llm-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMTestInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-testResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Test a hosted provider + key
      tags:
        - system
  /v1/titles:
    get:
      operationId: list-titles
      parameters:
        - description: Filter by state
          explode: false
          in: query
          name: state
          schema:
            description: Filter by state
            enum:
              - wanted
              - requested
              - downloading
              - available
              - unavailable
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List titles, optionally filtered by state
      tags:
        - titles
    post:
      description: Idempotent by external id (§4). Admin only.
      operationId: enqueue-title
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Enqueue/ensure a title
      tags:
        - titles
  /v1/titles/{key}:
    delete:
      description: Admin only.
      operationId: delete-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Give up / cancel a title
      tags:
        - titles
    get:
      operationId: get-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a title's provisioning state
      tags:
        - titles
  /v1/users:
    get:
      operationId: list-users
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List users (admin)
      tags:
        - users
  /v1/users/{id}:
    patch:
      operationId: patch-user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a user's role/quota/disabled (admin)
      tags:
        - users
