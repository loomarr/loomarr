    post:
      description: Admin only. Rotates SESSION_SECRET | API_TOKEN | WEBHOOK_SECRET with the §4 side-effects; the new value is returned only if displayable.
      operationId: secret-regenerate
      parameters:
        - description: Which generated secret to rotate.
          in: path
          name: name
          required: true
