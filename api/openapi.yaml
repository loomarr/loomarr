info:
  description: "Turn a sentence into a self-maintaining Tunarr channel. Every /v1 route requires a session cookie or Authorization: Bearer API_TOKEN (§7)."
  title: Loomarr API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sign in with media-server credentials
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: End the current session
      tags:
        - auth
  /v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Current user, role, and quotas
      tags:
        - auth
  /v1/channels:
    get:
      operationId: list-channels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List channels
      tags:
        - channels
    post:
      description: Admin only. From an approved proposal or hand-made.
      operationId: create-channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a channel
      tags:
        - channels
  /v1/channels/now-next:
    get:
      description: "Per channel, the program currently airing and the one after it, read from Tunarr's generated guide (§6: Tunarr owns playout, so airtimes are its truth, never recomputed here). ONE upstream call serves every channel."
      operationId: channels-now-next
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowNextOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What is airing now and next
      tags:
        - channels
  /v1/channels/{id}:
    delete:
      description: Admin only. Detaches by default (§7).
      operationId: delete-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "Also delete the Tunarr channel (default: detach only, §7)"
          explode: false
          in: query
          name: purge
          schema:
            description: "Also delete the Tunarr channel (default: detach only, §7)"
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a channel
      tags:
        - channels
    get:
      operationId: get-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a channel definition + status
      tags:
        - channels
  /v1/channels/{id}/pods:
    get:
      description: Assembles the channel's filler pool WITHOUT touching Tunarr (§10, §12). Same code path and same seed as reconcile, so what you see is what the channel gets. Read-only, so any authenticated user may call it.
      operationId: preview-channel-pods
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPodsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
