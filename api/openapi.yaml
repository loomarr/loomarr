  /v1/guide:
    get:
      description: "Per-channel programme timelines across [from, to), for Loomarr's own time grid. Commercial pods, pending acquisitions and flex are all returned with a `kind` discriminator rather than being filtered or collapsed to a boolean, so the grid can draw them distinctly. Times are absolute epoch ms; a block already in progress reports its real start. NOT the XMLTV guide a media server reads — that is /playout/guide.xml. Read-only: any authenticated user (§8.1 viewer-facing)."
      operationId: channel-guide
      parameters:
        - description: Window start, epoch ms. Defaults to now.
          explode: false
          in: query
          name: from
          schema:
            description: Window start, epoch ms. Defaults to now.
            format: int64
            type: integer
        - description: Window end, epoch ms. Defaults to 4 hours after the window start.
          explode: false
          in: query
          name: to
          schema:
            description: Window end, epoch ms. Defaults to 4 hours after the window start.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every channel's timeline over a window
      tags:
        - channels
  /v1/jobs:
    get:
      description: Admin only. The scheduler's named jobs with their effective interval, last/next run, result, and running state (§18.1). All timing is server-authored.
      operationId: jobs-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List background jobs
      tags:
        - jobs
  /v1/jobs/{name}/pause:
    post:
      description: "Admin only. Pausing stops a job running on its schedule (§18.1); it stays listed, keeps its cron, and reports no next run. Run now still works on a paused job — pause stops the schedule, not the task. A job this backend cannot run at all (a non-empty disabledReason) returns 409: that is an environment fact, not an operator preference."
      operationId: jobs-pause
      parameters:
        - description: Job name (the stable id from GET /v1/jobs)
          in: path
          name: name
          required: true
          schema:
            description: Job name (the stable id from GET /v1/jobs)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobsPauseInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Pause or resume a job
      tags:
        - jobs
  /v1/jobs/{name}/run:
    post:
      description: "Admin only. Triggers a scheduled job off-cycle (§18.1). Idempotent-ish: a job already due/running is not double-run (the scheduler lease guards it). A job this backend cannot run (a non-empty disabledReason) returns 409."
      operationId: jobs-run
      parameters:
        - description: The job's stable id (from GET /v1/jobs)
          in: path
          name: name
          required: true
          schema:
            description: The job's stable id (from GET /v1/jobs)
            type: string
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run a job now
      tags:
        - jobs
  /v1/library/collections:
    get:
      operationId: listLibraryCollections
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionsOutputBody"
          description: OK
        default:
