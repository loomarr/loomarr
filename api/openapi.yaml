  /v1/channels/{id}/tracks:
    get:
      description: "Any signed-in user. The audio and subtitle tracks the CURRENTLY-AIRING programme actually carries — what the Watch tab's Audio/Subtitle pickers offer. These come from the media (an ffprobe of the airing file), not a fixed list and not a setting, so the choices are real. Best-effort: an empty list when nothing is airing or the probe can't run, never an error — a viewer still gets the channel's current default."
      operationId: channel-tracks
      parameters:
        - in: path
          name: id
          required: true
