                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read one help page as markdown
      tags:
        - help
  /v1/filler:
    get:
      description: Filter by kind/era/audience/category.
      operationId: list-filler
      parameters:
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - commercial
              - bumper
              - station_id
              - psa
              - trailer
              - interstitial
            type: string
        - explode: false
          in: query
          name: era
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: audience
          schema:
            enum:
              - kids
              - family
              - general
              - late_night
            type: string
        - explode: false
          in: query
          name: category
          schema:
            type: string
        - description: Only commercials missing match tags
          explode: false
          in: query
          name: untagged
          schema:
            description: Only commercials missing match tags
            type: boolean
        - description: Case-insensitive substring match on the clip name
          explode: false
          in: query
          name: q
          schema:
            description: Case-insensitive substring match on the clip name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFillerOutputBody"
