info:
  description: "Turn a sentence into a self-maintaining Tunarr channel. Every /v1 route requires a session cookie or Authorization: Bearer API_TOKEN (§7)."
  title: Loomarr API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sign in with media-server credentials
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: End the current session
      tags:
        - auth
  /v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Current user, role, and quotas
      tags:
        - auth
  /v1/auth/password:
    post:
      operationId: change-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change your own password
      tags:
        - auth
  /v1/channels:
    get:
      operationId: list-channels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List channels
      tags:
        - channels
    post:
      description: Admin only. From an approved proposal or hand-made.
      operationId: create-channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a channel
      tags:
        - channels
  /v1/channels/now-next:
    get:
      description: "Per channel, the program currently airing and the one after it, read from Tunarr's generated guide (§6: Tunarr owns playout, so airtimes are its truth, never recomputed here). ONE upstream call serves every channel."
      operationId: channels-now-next
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowNextOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What is airing now and next
      tags:
        - channels
  /v1/channels/{id}:
    delete:
      description: Admin only. Detaches by default (§7).
      operationId: delete-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "Also delete the Tunarr channel (default: detach only, §7)"
          explode: false
          in: query
          name: purge
          schema:
            description: "Also delete the Tunarr channel (default: detach only, §7)"
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a channel
      tags:
        - channels
    get:
      operationId: get-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a channel definition + status
      tags:
        - channels
    patch:
      description: Admin only. Partial update of operator-owned fields (name/number/group/strategy), the per-channel programming policy, and pause/resume via status. Renumber is unique-checked (409). Every edit auto-reconciles — there is no manual rebuild.
      operationId: update-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a channel
      tags:
        - channels
  /v1/channels/{id}/cycle:
    get:
      description: "The time-travel cycle preview (§8.1): what this channel would air at `at` (default now), and WHICH curation rule is active then. Runs the SAME pure lineup builder as reconcile — preview and reality cannot disagree — WITHOUT touching Tunarr or the store beyond a read. Makes first-match-by-priority rule resolution legible (\"at Saturday 9am, the Weekend TNG marathon rule is active\"). Read-only, so any authenticated user may call it; `at` may be past or future."
      operationId: preview-channel-cycle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "RFC3339 wall-clock to preview (default: now). May be past or future — 'what airs next Christmas morning?'"
          explode: false
          in: query
          name: at
          schema:
            description: "RFC3339 wall-clock to preview (default: now). May be past or future — 'what airs next Christmas morning?'"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewCycleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview what airs at a chosen time (curation rules)
      tags:
        - channels
  /v1/channels/{id}/icon-suggestions:
    get:
      description: Candidate poster images drawn from the channel's OWN lineup titles (§icon) — a Star Trek channel offers its five series' posters. Read-only, so any authenticated user may call it. 501 when TMDB isn't configured.
      operationId: channel-icon-suggestions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IconSuggestionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Suggest channel icons from the lineup
      tags:
        - channels
  /v1/channels/{id}/pods:
    get:
      description: Assembles the channel's SAVED filler pool WITHOUT touching Tunarr (§10, §12). Same code path and same seed as reconcile, so what you see is what the channel gets. Read-only, so any authenticated user may call it.
      operationId: preview-channel-pods
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodPoolDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview the commercial pool this channel would get
      tags:
        - channels
        - filler
  /v1/channels/{id}/pods/preview:
    post:
      description: Assembles the pool a DRAFT filler selection would produce, without persisting it (§10, §12) — the live sandbox on the channel's Filler section. Same assembler + seed as the saved preview and reconcile, so the sandbox shows exactly what will air once applied. Admin-only (an authoring tool); applying is a normal PATCH of policy.filler.
      operationId: preview-draft-channel-pods
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewDraftPodsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodPoolDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview a draft filler selection without saving it
      tags:
        - channels
        - filler
  /v1/channels/{id}/programming/preview:
    post:
      description: Previews what a DRAFT {lineup?, policy?} would air — the cycle slots (which rule wins at `at`, the rolling window) AND the assembled break pool — WITHOUT saving or touching Tunarr. Runs the same ComputeDesiredAt + pod assembler as reconcile, so the preview cannot drift from what applying it would ship. Omitted lineup/policy fall back to the saved value. Admin-only (an authoring tool).
      operationId: preview-channel-programming
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "RFC3339 wall-clock to preview (default: now). May be past or future."
          explode: false
          in: query
          name: at
          schema:
            description: "RFC3339 wall-clock to preview (default: now). May be past or future."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewProgrammingInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewProgrammingOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview an unsaved programming draft
      tags:
        - channels
  /v1/channels/{id}/reconcile:
    post:
      description: Admin only. Idempotent (§9).
      operationId: reconcile-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Force desired→Tunarr reconciliation
      tags:
        - channels
  /v1/channels/{id}/refine:
    post:
      description: Admin only. Describe a change; the LLM re-proposes using the channel's current lineup as context, grounded like any suggestion. Returns a jobId — poll /v1/suggestions for the proposal, review the diff, and approve to apply (patches THIS channel).
      operationId: refine-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineChannelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefineChannelOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Refine a channel with the LLM
      tags:
        - channels
        - suggestions
  /v1/channels/{id}/upcoming:
    get:
