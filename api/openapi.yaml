      operationId: fetch-filler-source
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchFillerSourceOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
