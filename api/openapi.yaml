components:
  schemas:
    ApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        status:
          type: string
      required:
        - status
        - enqueued
      type: object
    ChannelDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChannelDTO.json
          format: uri
          readOnly: true
          type: string
        group:
          examples:
            - Kids
          type: string
        id:
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          description: Guide channel number
          examples:
            - 42
          format: int64
          type: integer
        programCount:
          description: Real playable programs in the desired lineup
          format: int64
          type: integer
        slotCount:
          description: Total slots incl. filler/flex placeholders
          format: int64
          type: integer
        status:
          description: Loomarr-side channel status (§9)
          enum:
            - building
            - live
            - drifted
            - detached
          type: string
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
        tunarrId:
          description: Server-assigned Tunarr channel id; empty until first reconcile
          type: string
      required:
        - id
        - name
        - number
        - strategy
        - status
        - programCount
        - slotCount
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateChannelInputBody.json
          format: uri
          readOnly: true
          type: string
        group:
          examples:
            - Kids
          type: string
        id:
          description: Loomarr channel id (caller-assigned, stable)
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        logo:
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          examples:
            - 42
          format: int64
          minimum: 1
          type: integer
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
      required:
        - id
        - name
        - number
        - strategy
      type: object
    DenyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyInputBody.json
          format: uri
          readOnly: true
          type: string
        reason:
          type: string
      type: object
    DenyOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    EnqueueInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnqueueInputBody.json
          format: uri
          readOnly: true
          type: string
        mediaType:
          enum:
            - movie
            - series
          type: string
        name:
          type: string
        seasons:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        tmdbId:
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - mediaType
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ListChannelsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListChannelsOutputBody.json
          format: uri
          readOnly: true
          type: string
        channels:
          items:
            $ref: "#/components/schemas/ChannelDTO"
          type:
            - array
            - "null"
      required:
        - channels
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListOutputBody.json
          format: uri
          readOnly: true
          type: string
        titles:
          items:
            $ref: "#/components/schemas/TitleDTO"
          type:
            - array
            - "null"
      required:
        - titles
      type: object
    ListProposalsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListProposalsOutputBody.json
          format: uri
          readOnly: true
          type: string
        proposals:
          items:
            $ref: "#/components/schemas/ProposalDTO"
          type:
            - array
            - "null"
      required:
        - proposals
      type: object
    ListUsersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListUsersOutputBody.json
          format: uri
          readOnly: true
          type: string
        users:
          items:
            $ref: "#/components/schemas/UserBody"
          type:
            - array
            - "null"
      required:
        - users
      type: object
    LivetvConnectOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LivetvConnectOutputBody.json
          format: uri
          readOnly: true
          type: string
        alreadyWired:
          description: Nothing changed — Tunarr was already wired (§6 idempotent)
          type: boolean
        listingAdded:
          description: An xmltv guide was registered this call
          type: boolean
        tunerAdded:
          description: An m3u tuner was registered this call
          type: boolean
      required:
        - tunerAdded
        - listingAdded
        - alreadyWired
      type: object
    PatchUserInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PatchUserInputBody.json
          format: uri
          readOnly: true
          type: string
        autoApprove:
          type: boolean
        disabled:
          type: boolean
        quota:
          format: int64
          type: integer
        role:
          enum:
            - admin
            - member
          type: string
      type: object
    ProposalDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ProposalDTO.json
          format: uri
          readOnly: true
          type: string
        approvedBy:
          type: string
        createdBy:
          type: string
        denyReason:
          type: string
        id:
          type: string
        jobId:
          type: string
        proposal: {}
        status:
          enum:
            - submitted
            - approved
            - denied
          type: string
      required:
        - id
        - jobId
        - status
        - proposal
      type: object
    SearchCandidate:
      additionalProperties: false
      properties:
        inLibrary:
          type: boolean
        libraryItemId:
          type: string
        mediaType:
          type: string
        name:
          type: string
        tmdbId:
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - mediaType
        - name
        - inLibrary
      type: object
    SearchOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SearchOutputBody.json
          format: uri
          readOnly: true
          type: string
        candidates:
          items:
            $ref: "#/components/schemas/SearchCandidate"
          type:
            - array
            - "null"
      required:
        - candidates
      type: object
    SetupCheck:
      additionalProperties: false
      properties:
        hint:
          description: Actionable hint when not OK (§13)
          type: string
        name:
          description: Integration key
          examples:
            - livetv
          type: string
        ok:
          type: boolean
      required:
        - name
        - ok
      type: object
    SetupStatusOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SetupStatusOutputBody.json
          format: uri
          readOnly: true
          type: string
        checks:
          items:
            $ref: "#/components/schemas/SetupCheck"
          type:
            - array
            - "null"
      required:
        - checks
      type: object
    SubmitInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SubmitInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          examples:
            - 90s action movies
          type: string
        era:
          type: string
        maxAcquisitions:
          format: int64
          type: integer
        mustExclude:
          items:
            type: string
          type:
            - array
            - "null"
        mustInclude:
          items:
            type: string
          type:
            - array
            - "null"
        tone:
          type: string
      required:
        - description
      type: object
    SubmitOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SubmitOutputBody.json
          format: uri
          readOnly: true
          type: string
        jobId:
          type: string
      required:
        - jobId
      type: object
    TitleDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TitleDTO.json
          format: uri
          readOnly: true
          type: string
        key:
          description: Stable identity key
          examples:
            - movie:tmdb:1111867
          type: string
        libraryId:
          type: string
        mediaType:
          enum:
            - movie
            - series
          examples:
            - movie
          type: string
        name:
          examples:
            - In Flames
          type: string
        state:
          description: Provisioning state (§4)
          enum:
            - wanted
            - requested
            - downloading
            - available
            - unavailable
          type: string
        tmdbId:
          examples:
            - 1111867
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          examples:
            - 2023
          format: int64
          type: integer
      required:
        - key
        - mediaType
        - state
      type: object
    UserBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UserBody.json
          format: uri
          readOnly: true
          type: string
        autoApprove:
          type: boolean
        disabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        quota:
          format: int64
          type: integer
        role:
          enum:
            - admin
            - member
          type: string
      required:
        - id
        - name
        - role
        - disabled
        - quota
        - autoApprove
      type: object
info:
  description: "Turn a sentence into a self-maintaining Tunarr channel. Every /v1 route requires a session cookie or Authorization: Bearer API_TOKEN (§7)."
  title: Loomarr API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/channels:
    get:
      operationId: list-channels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List channels
      tags:
        - channels
    post:
      description: Admin only. From an approved proposal or hand-made.
      operationId: create-channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a channel
      tags:
        - channels
  /v1/channels/{id}:
    delete:
      description: Admin only. Detaches by default (§7).
      operationId: delete-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "Also delete the Tunarr channel (default: detach only, §7)"
          explode: false
          in: query
          name: purge
          schema:
            description: "Also delete the Tunarr channel (default: detach only, §7)"
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a channel
      tags:
        - channels
    get:
      operationId: get-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a channel definition + status
      tags:
        - channels
  /v1/channels/{id}/reconcile:
    post:
      description: Admin only. Idempotent (§9).
      operationId: reconcile-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Force desired→Tunarr reconciliation
      tags:
        - channels
  /v1/search:
    get:
      operationId: search
      parameters:
        - description: Search terms
          explode: false
          in: query
          name: q
          schema:
            description: Search terms
            type: string
        - description: Corpus to search (default all)
          explode: false
          in: query
          name: scope
          schema:
            description: Corpus to search (default all)
            enum:
              - library
              - tmdb
              - clips
              - all
            type: string
        - description: Max results (default 20)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results (default 20)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Federated search (library + TMDB + clips)
      tags:
        - search
  /v1/setup/livetv-connect:
    post:
      description: Admin only. One-time, idempotent (§6).
      operationId: livetv-connect
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivetvConnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Wire Tunarr as a tuner + guide
      tags:
        - setup
  /v1/setup/status:
    get:
      description: Admin only. Per-integration pass/fail (§13).
      operationId: setup-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Connection checklist
      tags:
        - setup
  /v1/suggestions:
    get:
      description: status=submitted is the approval queue.
      operationId: list-proposals
      parameters:
        - description: Filter by status; submitted = the approval queue
          explode: false
          in: query
          name: status
          schema:
            description: Filter by status; submitted = the approval queue
            enum:
              - submitted
              - approved
              - denied
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProposalsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List proposals by status
      tags:
        - suggestions
    post:
      description: Any authenticated user (§8).
      operationId: submit-suggestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Start a suggestion job from an intent
      tags:
        - suggestions
  /v1/suggestions/{id}:
    get:
      operationId: get-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a proposal + its job status
      tags:
        - suggestions
  /v1/suggestions/{id}/approve:
    post:
      description: Admin only. Enqueues acquisitions through the approval gate (§8).
      operationId: approve-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a proposal (admin)
      tags:
        - suggestions
  /v1/suggestions/{id}/deny:
    post:
      description: Admin only.
      operationId: deny-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DenyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DenyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Deny a proposal (admin)
      tags:
        - suggestions
  /v1/titles:
    get:
      operationId: list-titles
      parameters:
        - description: Filter by state
          explode: false
          in: query
          name: state
          schema:
            description: Filter by state
            enum:
              - wanted
              - requested
              - downloading
              - available
              - unavailable
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List titles, optionally filtered by state
      tags:
        - titles
    post:
      description: Idempotent by external id (§4). Admin only.
      operationId: enqueue-title
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Enqueue/ensure a title
      tags:
        - titles
  /v1/titles/{key}:
    delete:
      description: Admin only.
      operationId: delete-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Give up / cancel a title
      tags:
        - titles
    get:
      operationId: get-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a title's provisioning state
      tags:
        - titles
  /v1/users:
    get:
      operationId: list-users
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List users (admin)
      tags:
        - users
  /v1/users/{id}:
    patch:
      operationId: patch-user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserInputBody"
        required: true
      responses:
