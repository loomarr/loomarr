  /v1/docs/{slug}:
    get:
      description: "Returns raw markdown, not HTML: the frontend renders it and searches it client-side (§7.2), which needs the source rather than a rendered blob."
      operationId: get-doc
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            examples:
              - troubleshooting
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDocOutputBody"
          description: OK
        default:
