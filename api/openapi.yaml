components:
  schemas:
    EnqueueInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnqueueInputBody.json
          format: uri
          readOnly: true
          type: string
        mediaType:
          enum:
            - movie
            - series
          type: string
        name:
          type: string
        seasons:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        tmdbId:
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - mediaType
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListOutputBody.json
          format: uri
          readOnly: true
          type: string
        titles:
          items:
            $ref: "#/components/schemas/TitleDTO"
          type:
            - array
            - "null"
      required:
        - titles
      type: object
    TitleDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TitleDTO.json
          format: uri
          readOnly: true
          type: string
        key:
          description: Stable identity key
          examples:
            - movie:tmdb:1111867
          type: string
        libraryId:
          type: string
        mediaType:
          enum:
            - movie
            - series
          examples:
            - movie
          type: string
        name:
          examples:
            - In Flames
          type: string
        state:
          description: Provisioning state (§4)
          enum:
            - wanted
            - requested
            - downloading
            - available
            - unavailable
          type: string
        tmdbId:
          examples:
            - 1111867
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          examples:
            - 2023
          format: int64
          type: integer
      required:
        - key
        - mediaType
        - state
      type: object
info:
  description: "Turn a sentence into a self-maintaining Tunarr channel. Every /v1 route requires a session cookie or Authorization: Bearer API_TOKEN (§7)."
  title: Loomarr API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/titles:
    get:
      operationId: list-titles
      parameters:
        - description: Filter by state
          explode: false
          in: query
          name: state
          schema:
            description: Filter by state
            enum:
              - wanted
              - requested
              - downloading
              - available
              - unavailable
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List titles, optionally filtered by state
      tags:
        - titles
    post:
      description: Idempotent by external id (§4). Admin only.
      operationId: enqueue-title
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Enqueue/ensure a title
      tags:
        - titles
  /v1/titles/{key}:
    delete:
      description: Admin only.
      operationId: delete-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Give up / cancel a title
      tags:
        - titles
    get:
      operationId: get-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a title's provisioning state
      tags:
        - titles
