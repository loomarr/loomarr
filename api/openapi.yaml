components:
  schemas:
    ActiveRuleDTO:
      additionalProperties: false
      properties:
        id:
          description: Stable rule id ('' when no rule matched)
          type: string
        label:
          description: Human-readable rule name, or 'Base policy' when none matched
          type: string
        matched:
          description: Whether a curation rule matched (false = base whole-policy behavior)
          type: boolean
        priority:
          description: The rule's priority (higher wins overlaps); 0 for the base policy
          format: int64
          type: integer
      required:
        - id
        - label
        - priority
        - matched
      type: object
    AppliedRelaxation:
      additionalProperties: false
      properties:
        from:
          type: string
        kind:
          type: string
        to:
          type: string
      required:
        - kind
        - from
        - to
      type: object
    ApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        channelId:
          description: The channel this approval created or patched (§7). Empty only if channel creation failed — the approval itself still stands.
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        status:
          type: string
      required:
        - status
        - enqueued
      type: object
    AudiencePolicy:
      additionalProperties: false
      properties:
        ceiling:
          type: string
        unrated:
          type: string
      type: object
    AutoCurate:
      additionalProperties: false
      properties:
        maxTitles:
          format: int64
          type: integer
        minScorePct:
          format: int64
          type: integer
      type: object
    BootstrapInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BootstrapInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: The owning admin's password (bcrypt-hashed at rest).
          type: string
        username:
          description: The owning admin's local username.
          type: string
      required:
        - username
        - password
      type: object
    BootstrapOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BootstrapOutputBody.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        name:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - role
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChangePasswordInputBody.json
          format: uri
          readOnly: true
          type: string
        current:
          description: Your current password.
          format: password
          type: string
        next:
          description: The new password (min 8 characters).
          format: password
          minLength: 8
          type: string
      required:
        - current
        - next
      type: object
    ChannelDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChannelDTO.json
          format: uri
          readOnly: true
          type: string
        breakCount:
          description: Commercial-break gaps (§10) — NOT titles; a healthy break-heavy channel has a large breakCount and zero pendingCount
          format: int64
          type: integer
        group:
          examples:
            - Kids
          type: string
        id:
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        lineup:
          description: The channel's titles, in order (the intent-level lineup, not the expanded slots)
          items:
            $ref: "#/components/schemas/LineupEntryDTO"
          type:
            - array
            - "null"
        logo:
          description: Channel icon URL — pushed to Tunarr's channel icon (from TMDB, an upload, or set directly)
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          description: Guide channel number
          examples:
            - 42
          format: int64
          type: integer
        pendingCount:
          description: "Lineup titles not yet available — awaiting acquisition (coming-soon gaps + pod-fill placeholders). Health keys on this: pendingCount==0 means every title is ready, even on a channel full of commercial breaks."
          format: int64
          type: integer
        policy:
          $ref: "#/components/schemas/ChannelPolicy"
          description: Programming policy (scope/audience/separation/ordering/seasonal) + applied relaxations
        programCount:
          description: Real playable programs (available titles) in the desired lineup
          format: int64
          type: integer
        slotCount:
          description: Total desired slots incl. breaks + placeholders. NOT a readiness signal — use programCount/pendingCount (a break gap inflates this without any title pending). Kept for diagnostics.
          format: int64
          type: integer
        status:
          description: Loomarr-side channel status (§9)
          enum:
            - building
            - live
            - drifted
            - detached
            - paused
          type: string
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
        tunarrId:
          description: Server-assigned Tunarr channel id; empty until first reconcile
          type: string
      required:
        - id
        - name
        - number
        - strategy
        - status
        - programCount
        - pendingCount
        - breakCount
        - slotCount
        - policy
        - lineup
      type: object
    ChannelNowNext:
      additionalProperties: false
      properties:
        channelId:
          description: Loomarr channel id
          type: string
        next:
          $ref: "#/components/schemas/NowNextEntry"
        now:
          $ref: "#/components/schemas/NowNextEntry"
      required:
        - channelId
      type: object
    ChannelPolicy:
      additionalProperties: false
      properties:
        applied:
          items:
            $ref: "#/components/schemas/AppliedRelaxation"
          type:
            - array
            - "null"
        audience:
          $ref: "#/components/schemas/AudiencePolicy"
        autoCurate:
          $ref: "#/components/schemas/AutoCurate"
        filler:
          $ref: "#/components/schemas/FillerSelection"
        operatorSet:
          items:
            type: string
          type:
            - array
            - "null"
        ordering:
          type: string
        playout:
          $ref: "#/components/schemas/PlayoutPolicy"
        rules:
          items:
            $ref: "#/components/schemas/SchedulingRule"
          type:
            - array
            - "null"
        scope:
          $ref: "#/components/schemas/ScopePolicy"
        seasonal:
          $ref: "#/components/schemas/SeasonalPolicy"
        separation:
          $ref: "#/components/schemas/SeparationPolicy"
        window:
          description: A Go-duration string, e.g. "168h" (7 days) or "24h". Empty/omitted means no limit.
          examples:
            - 168h
            - 24h
          type: string
      type: object
    ClipDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClipDTO.json
          format: uri
          readOnly: true
          type: string
        aiTagged:
          type: boolean
        audience:
          enum:
            - kids
            - family
            - general
            - late_night
            - ""
          type: string
        category:
          type: string
        durationMs:
          format: int64
          type: integer
        era:
          format: int64
          type: integer
        kind:
          enum:
            - commercial
            - bumper
            - station_id
            - psa
            - trailer
            - interstitial
          type: string
        name:
          type: string
        source:
          type: string
        tagged:
          description: Whether the clip has all match tags (era+audience+category)
          type: boolean
        tunarrProgramId:
          type: string
      required:
        - tunarrProgramId
        - name
        - kind
        - durationMs
        - aiTagged
        - tagged
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateChannelInputBody.json
          format: uri
          readOnly: true
          type: string
        group:
          examples:
            - Kids
          type: string
        id:
          description: Loomarr channel id (stable). Optional — omit and the server assigns one (ch_…); pass one to keep a caller-assigned id.
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        logo:
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          examples:
            - 42
          format: int64
          minimum: 1
          type: integer
        series:
          $ref: "#/components/schemas/SeriesStruct"
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
      required:
        - name
        - number
        - strategy
      type: object
    CreateLocalUserInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateLocalUserInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          format: password
          minLength: 8
          type: string
        quota:
          description: Pending-acquisition cap; 0 = the default.
          format: int64
          type: integer
        role:
          description: Defaults to member.
          enum:
            - admin
            - member
          type: string
        username:
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    CycleSlotDTO:
      additionalProperties: false
      properties:
        episode:
          description: Series episode number (0 = movie/unknown)
          format: int64
          type: integer
        key:
          description: Provisioning key of the title (empty for a break)
          type: string
        kind:
          description: program = a playable title; pending = an acquisition not yet available; break = a commercial gap
          enum:
            - program
            - pending
            - break
          type: string
        part:
          description: Play order within a multi-part or franchise group (0 = standalone)
          format: int64
          type: integer
        season:
          description: Series season number (0 = movie/unknown)
          format: int64
          type: integer
        title:
          description: Display label; empty for a break gap
          type: string
      required:
        - kind
      type: object
    DenyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyInputBody.json
          format: uri
          readOnly: true
          type: string
        reason:
          type: string
      type: object
    DenyOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    DiscoverModelView:
      additionalProperties: false
      properties:
        downloads:
          description: Source popularity — a ranking tiebreak only; not shown to the user (§8.1)
          format: int64
          type: integer
        fit:
          description: fits|tight|wont_fit against detected VRAM
          type: string
        id:
          description: Source repo id, e.g. unsloth/Qwen3.5-4B-GGUF
          type: string
        label:
          description: Human-friendly name, e.g. Qwen3.5 4B
          type: string
        note:
          description: Plain-English why-pick-this hint derived from role + fit (§8.1). Presentation only; may be empty.
          type: string
        pullRef:
          description: Model ref to POST to /pull — the bare repo (e.g. hf.co/unsloth/Qwen3.5-4B-GGUF); Ollama pulls its latest tag
          type: string
        quant:
          description: The build we sized against — Ollama's latest resolves to it (e.g. Q4_K_M). Informational; the pull is by bare repo ref.
          type: string
        recommended:
          description: True for the single safe-default pick for this machine — the hero card (§8.1). At most one per list.
          type: boolean
        role:
          description: "Plain-English job in the user's choice: balanced|faster|higher_quality (§8.1)"
          type: string
        sizeGiB:
          description: Sized build's on-disk size (VRAM proxy) — what latest downloads
          format: double
          type: number
      required:
        - id
        - label
        - quant
        - pullRef
        - sizeGiB
        - fit
        - downloads
        - role
        - recommended
      type: object
    DocSummary:
      additionalProperties: false
      properties:
        slug:
          examples:
            - troubleshooting
          type: string
        title:
          examples:
            - Troubleshooting
          type: string
      required:
        - slug
        - title
      type: object
    EnqueueInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnqueueInputBody.json
          format: uri
          readOnly: true
          type: string
        mediaType:
          enum:
            - movie
            - series
          type: string
        name:
          type: string
        seasons:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        tmdbId:
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - mediaType
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FillerSelection:
      additionalProperties: false
      properties:
        audience:
          type: string
        categories:
          items:
            type: string
          type:
            - array
            - "null"
        era:
          $ref: "#/components/schemas/Range"
        excluded:
          items:
            type: string
          type:
            - array
            - "null"
        kinds:
          items:
            type: string
          type:
            - array
            - "null"
        pinned:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    GenreFilter:
      additionalProperties: false
      properties:
        exclude:
          items:
            type: string
          type:
            - array
            - "null"
        include:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    GetDocOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetDocOutputBody.json
          format: uri
          readOnly: true
          type: string
        markdown:
          type: string
        slug:
          type: string
        title:
          type: string
      required:
        - slug
        - title
        - markdown
      type: object
    HostedModelView:
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        recommended:
          description: Rule-selected top pick (cheap + tool-capable)
          type: boolean
        tools:
          description: Provider advertises tool-calling for this model
          type: boolean
        why:
          description: Rule-derived rationale (from live pricing/context/tools metadata)
          type: string
      required:
        - id
        - label
      type: object
    HostedProviderView:
      additionalProperties: false
      properties:
        active:
          description: This is the currently-selected provider
          type: boolean
        baseUrl:
          type: string
        key:
          description: Loomarr provider id (openrouter|custom)
          type: string
        keyConfigured:
          description: A key is stored for this provider (value never returned)
          type: boolean
        keysUrl:
          description: Where to obtain an API key
          type: string
        label:
          type: string
        models:
          items:
            $ref: "#/components/schemas/HostedModelView"
          type:
            - array
            - "null"
        modelsLive:
          description: Models were fetched live from the provider (false = curated fallback)
          type: boolean
        note:
          type: string
      required:
        - key
        - label
        - baseUrl
        - keysUrl
        - keyConfigured
        - active
        - modelsLive
        - models
      type: object
    HowVocab:
      additionalProperties: false
      properties:
        label:
          type: string
        ordering:
          $ref: "#/components/schemas/RuleOrdering"
        shortLabel:
          type: string
        token:
          type: string
        windowFull:
          type: boolean
      required:
        - token
        - label
        - shortLabel
        - ordering
        - windowFull
      type: object
    IconSuggestion:
      additionalProperties: false
      properties:
        title:
          examples:
            - "Star Trek: The Next Generation"
          type: string
        url:
          examples:
            - https://image.tmdb.org/t/p/w500/xyz.jpg
          type: string
      required:
        - title
        - url
      type: object
    IconSuggestionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/IconSuggestionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        suggestions:
          items:
            $ref: "#/components/schemas/IconSuggestion"
          type:
            - array
            - "null"
      required:
        - suggestions
      type: object
    ImportCandidate:
      additionalProperties: false
      properties:
        disabled:
          description: Disabled on the media server.
          type: boolean
        id:
          description: Media-server user id — the value POST /v1/users/import takes.
          type: string
        imported:
          description: Already allowlisted in Loomarr.
          type: boolean
        isAdmin:
          description: Admin on the media server; import may map this to a Loomarr admin.
          type: boolean
        name:
          type: string
      required:
        - id
        - name
        - isAdmin
        - disabled
        - imported
      type: object
    ImportCandidatesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ImportCandidatesOutputBody.json
          format: uri
          readOnly: true
          type: string
        candidates:
          items:
            $ref: "#/components/schemas/ImportCandidate"
          type:
            - array
            - "null"
      required:
        - candidates
      type: object
    ImportUsersInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ImportUsersInputBody.json
          format: uri
          readOnly: true
          type: string
        ids:
          description: Media-server user ids to allowlist.
          items:
            type: string
          type:
            - array
            - "null"
        makeAdmin:
          description: Grant admin to imported users that are media-server admins (default member).
          type: boolean
      required:
        - ids
      type: object
    ImportUsersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ImportUsersOutputBody.json
          format: uri
          readOnly: true
          type: string
        imported:
          description: How many rows were created/updated.
          format: int64
          type: integer
      required:
        - imported
      type: object
    IngestFillerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/IngestFillerInputBody.json
          format: uri
          readOnly: true
          type: string
        urls:
          description: YouTube playlist/video or Archive.org collection/item URLs
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - urls
      type: object
    IngestFillerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/IngestFillerOutputBody.json
          format: uri
          readOnly: true
          type: string
        jobId:
          description: Watch /v1/events for filler_ingest frames carrying this id
          type: string
      required:
        - jobId
      type: object
    Intent:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Intent.json
          format: uri
          readOnly: true
          type: string
        currentLineup:
          items:
            $ref: "#/components/schemas/LineupContext"
          type:
            - array
            - "null"
        description:
          type: string
        era:
          type: string
        maxAcquisitions:
          format: int64
          type: integer
        mustExclude:
          items:
            type: string
          type:
            - array
            - "null"
        mustInclude:
          items:
            type: string
          type:
            - array
            - "null"
        refineText:
          type: string
        runtimeTargetMin:
          format: int64
          type: integer
        tone:
          type: string
      required:
        - description
      type: object
    JobView:
      additionalProperties: false
      properties:
        lastError:
          description: Error detail when lastResult is error
          type: string
        lastResult:
          description: ok | error | '' (never run)
          type: string
        lastRun:
          description: When the job last started (zero = never)
          format: date-time
          type: string
        name:
          description: Stable job id (also the run/trigger key)
          type: string
        nextRun:
          description: When the job is next due
          format: date-time
          type: string
        running:
          description: True while the job is currently executing
          type: boolean
        schedule:
          description: Effective cron expression (settings override or default)
          type: string
        scheduleKey:
          description: Settings key to PATCH to change the schedule
          type: string
        title:
          description: Human label for the Tasks page
          type: string
      required:
        - name
        - title
        - schedule
        - scheduleKey
        - lastResult
        - running
      type: object
    JobsListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/JobsListOutputBody.json
          format: uri
          readOnly: true
          type: string
        jobs:
          items:
            $ref: "#/components/schemas/JobView"
          type:
            - array
            - "null"
      required:
        - jobs
      type: object
    LLMModelView:
      additionalProperties: false
      properties:
        approxVramGiB:
          format: double
          type: number
        fit:
          description: fits|tight|wont_fit against detected VRAM
          type: string
        label:
          type: string
        pulled:
          description: Already present in the local Ollama
          type: boolean
        recommended:
          type: boolean
        runtimeOk:
          description: Detected Ollama version supports this model
          type: boolean
        tag:
          type: string
        tools:
          description: Ollama reports tool-calling — required to ground suggestions; a false model is shown but not selectable
          type: boolean
        why:
          type: string
      required:
        - tag
        - label
        - approxVramGiB
        - fit
        - pulled
        - runtimeOk
        - tools
        - recommended
        - why
      type: object
    LineupContext:
      additionalProperties: false
      properties:
        key:
          type: string
        name:
          type: string
        year:
          format: int64
