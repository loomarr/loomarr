      tags:
        - settings
  /v1/settings/secrets/{name}:
    get:
      description: Admin only. Returns a displayable generated secret's current value (API_TOKEN — config-design §4's eye toggle). SESSION_SECRET reports displayable:false and withholds the value. Reading never rotates.
      operationId: secret-reveal
      parameters:
        - description: Which generated secret to reveal.
          in: path
          name: name
          required: true
          schema:
            description: Which generated secret to reveal.
            enum:
              - session_secret
              - api_token
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRevealOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reveal a generated secret
      tags:
        - settings
  /v1/settings/secrets/{name}/regenerate:
    post:
      description: Admin only. Rotates SESSION_SECRET | API_TOKEN with the §4 side-effects; the new value is returned only if displayable.
      operationId: secret-regenerate
      parameters:
        - description: Which generated secret to rotate.
          in: path
          name: name
          required: true
          schema:
            description: Which generated secret to rotate.
            enum:
              - session_secret
              - api_token
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRegenerateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Regenerate a generated secret
      tags:
        - settings
  /v1/settings/{key}:
    delete:
      description: Admin only. Drops the stored override so the key reverts to env/default — the explicit clear, and the only way to unset a secret (config-design §8/§9).
      operationId: settings-clear
      parameters:
        - description: Registry key to clear, e.g. seerr.api_key.
          in: path
          name: key
          required: true
          schema:
            description: Registry key to clear, e.g. seerr.api_key.
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Clear a setting
      tags:
        - settings
  /v1/settings/{key}/env-override:
    put:
      description: Admin only. Sets or clears the durable claim that this key is app-managed even though its environment variable is set (config-design §3.1). Unlocking seeds the stored value from the env value it takes over, so nothing changes until the operator saves; a secret never seeds. 404 unknown key (bootstrap keys are not in the registry), 409 when the environment does not pin the key.
      operationId: settings-env-override
      parameters:
        - description: Registry key, e.g. seerr.url.
          in: path
          name: key
          required: true
          schema:
            description: Registry key, e.g. seerr.url.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsEnvOverrideInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Take a setting back from the environment
      tags:
        - settings
  /v1/setup/bootstrap:
    post:
      description: "First-run only: creates the owning local admin. Succeeds exactly once (409 once an admin exists). Unauthenticated by design — it is functional only while no admin exists (§11)."
      operationId: bootstrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create the first admin
      tags:
        - setup
  /v1/setup/livetv-reconnect:
    post:
      description: Admin only. Removes + re-adds Loomarr's Tunarr tuner in the media server and re-scans it, clearing a STALE channel→stream binding (the media server streaming a since-deleted channel id — 'guide right, plays wrong'). Use when a channel plays the wrong content in the media server but is correct in Tunarr (§6/§9).
      operationId: livetv-reconnect
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivetvReconnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Force-re-wire the Tunarr tuner
      tags:
        - setup
  /v1/setup/state:
    get:
      description: Unauthenticated. Reports only whether bootstrap has happened, so the frontend can route a first-run visitor to the wizard instead of a login they cannot pass (§7/§13). Exposes nothing that POST /v1/setup/bootstrap doesn't already reveal by answering 409-vs-created.
      operationId: setup-state
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Whether the install has an owning admin
      tags:
        - setup
  /v1/setup/status:
    get:
      description: Admin only. Per-integration pass/fail (§13).
      operationId: setup-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Connection checklist
      tags:
        - setup
  /v1/setup/test:
    post:
      description: Admin only. Powers the per-block Test buttons (config-design §8).
      operationId: setup-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsTestInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsTestOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run one connection check
      tags:
        - settings
  /v1/setup/tunarr-connect:
    post:
      description: Admin only. Ensures Tunarr's Emby/Jellyfin source (Loomarr's admin token) + enables/scans the movie/show libraries. One-time, idempotent (§6).
      operationId: tunarr-connect
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunarrConnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Wire the library as Tunarr's media source
      tags:
        - setup
  /v1/suggestions:
    get:
      description: status=submitted is the approval queue.
      operationId: list-proposals
      parameters:
        - description: Filter by status; submitted = the approval queue
          explode: false
          in: query
          name: status
          schema:
            description: Filter by status; submitted = the approval queue
            enum:
              - submitted
              - approved
              - denied
            type: string
        - description: Scope to the caller's own proposals (the My requests surface). Resolved from the session, not from a user id.
          explode: false
          in: query
          name: mine
          schema:
            description: Scope to the caller's own proposals (the My requests surface). Resolved from the session, not from a user id.
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProposalsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List proposals by status
      tags:
        - suggestions
    post:
      description: Any authenticated user (§8).
      operationId: submit-suggestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Intent"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Start a suggestion job from an intent
      tags:
        - suggestions
  /v1/suggestions/approve:
    post:
      description: Admin only. Approves each id through the SAME single-approve gate (§8) — no batch path. Returns a per-id result so one already-handled proposal does not hide the rest.
      operationId: bulk-approve-proposals
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkApproveInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkApproveOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve several proposals (admin)
      tags:
        - suggestions
  /v1/suggestions/{id}:
    get:
      operationId: get-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a proposal + its job status
      tags:
        - suggestions
  /v1/suggestions/{id}/approve:
    post:
      description: Admin only. Enqueues acquisitions through the approval gate (§8).
      operationId: approve-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalEditDTO"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a proposal (admin)
      tags:
        - suggestions
  /v1/suggestions/{id}/deny:
    post:
      description: Admin only.
      operationId: deny-proposal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DenyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DenyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Deny a proposal (admin)
      tags:
        - suggestions
  /v1/system/backups:
    get:
      description: Admin only. What the scheduled backup job has written into the configured directory, plus the schedule and retention in force. A directory that does not exist yet is an empty list, not an error — nothing written yet is the normal state of a fresh install.
      operationId: system-backups-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Backups on disk, newest first
      tags:
        - system
    post:
      description: Admin only. Writes one snapshot into the configured directory and prunes to the retention policy — the same work the scheduled job does, without waiting for it.
      operationId: system-backups-run
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupEntry"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Write a backup now
      tags:
        - system
  /v1/system/database:
    get:
      description: Admin only. Which backend is live, whether a migration is offered, and how far one has got — including per-table row counts and the parity verdict.
      operationId: system-database-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Active backend + migration progress
      tags:
        - system
  /v1/system/database/backup:
    post:
      description: Admin only. Writes a server-side snapshot into the configured backup directory. This is the gate the migrate call enforces — a backup is required, not suggested, because it is the only thing that makes the move reversible.
      operationId: system-database-backup
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseBackup"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Write the pre-migration backup
      tags:
        - system
  /v1/system/database/migrate:
    post:
      description: "Admin only. Refuses without a passing preflight and a backup. The source is only ever read: on any failure the install is still running on SQLite and nothing was lost. Progress streams over /v1/events as `database` frames."
      operationId: system-database-migrate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTargetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Copy every table into the target and verify parity
      tags:
        - system
  /v1/system/database/preflight:
    post:
      description: Admin only. Runs every check against the target and returns them all — a check that ran and failed comes back with ok:false rather than as an error, so the operator sees which one. Nothing is written to either database.
      operationId: system-database-preflight
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTargetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabasePreflightOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Probe a candidate PostgreSQL target
      tags:
        - system
  /v1/system/database/switchover:
    post:
      description: Admin only. Persists the new DATABASE_URL to the bootstrap file. Takes effect on restart; the SQLite file is left in place untouched, so reverting is a one-line change.
      operationId: system-database-switchover
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTargetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseSwitchoverOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Point the next boot at the migrated database
      tags:
        - system
  /v1/system/llm:
    get:
      description: "Admin only. Active provider + model; the local-model catalog (for Ollama: detected VRAM/version, fit verdicts, recommended default, pulled flags); and the hosted-provider catalog (base URLs, live model lists, keyConfigured). API keys are never returned (§8.1)."
      operationId: system-llm-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLLMStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: LLM host probe + model catalog
      tags:
        - system
  /v1/system/llm/discover:
    get:
      description: "Admin only. Returns the most-popular downloadable GGUF models (Hugging Face) that are COMPATIBLE with this machine, ranked best-first (§8.1): each repo's best-fitting quant is chosen against detected VRAM and repos where nothing fits are dropped. Each result carries a pullRef to hand to POST /pull. Tool-capability is confirmed only AFTER the model is pulled and probed. Best-effort: if the source is unreachable the list is empty (browse on huggingface.co)."
      operationId: system-llm-discover
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-discoverResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Compatible downloadable local models
      tags:
        - system
  /v1/system/llm/pull:
    post:
      description: Admin only. Local Ollama only (409 on a hosted provider). Starts a pull as a background job; percent-complete streams over /v1/events (§8.1). Idempotent.
      operationId: system-llm-pull
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMPullInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-pullResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download a local model
      tags:
        - system
  /v1/system/llm/select:
    post:
      description: "Admin only. Persists the choice and hot-swaps the running suggester with no restart (§8.1). Local model must be pulled (409 else). Hosted: an optional apiKey is validated live before committing (401 on a bad key) and stored as a secret, never echoed."
      operationId: system-llm-select
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMSelectInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLLMStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Select the active provider + model
      tags:
        - system
  /v1/system/llm/test:
    post:
      description: Admin only. Validates a hosted provider + API key WITHOUT swapping (§8.1). Returns ok + an error hint; a bad key is ok=false (not a 5xx).
      operationId: system-llm-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMTestInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-testResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Test a hosted provider + key
      tags:
        - system
  /v1/system/reload:
    post:
      description: Admin only. Re-runs the connection checks without restarting or tearing anything down — no downtime. Uses the same probe implementation as the wizard's checklist, so the two can never disagree.
      operationId: system-reload
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemReloadOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Re-probe every configured service
      tags:
        - system
  /v1/system/restart:
    get:
      description: Admin only. The live count of channels Loomarr is streaming (which drop for a few seconds; Tunarr-backed channels keep playing), plus any boot-time setting waiting on a restart. Read-only — this does not restart anything.
      operationId: system-restart-cost
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartCost"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What a restart would cost right now
      tags:
        - system
    post:
      description: Admin only. Drains connections, tears down playout, and rebuilds every subsystem in the same process (§9.2) — no supervisor required. Responds before the drain begins, because a client that never gets a reply cannot tell 'restarting' from 'crashed'.
      operationId: system-restart
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Restart Loomarr in place
      tags:
        - system
  /v1/system/services:
    get:
      description: Admin only. Runs the SAME connection checks as the wizard checklist and /v1/system/reload — one probe implementation, so the three surfaces cannot disagree about whether the media server is reachable. Polled by the Dashboard every 30s.
      operationId: system-services
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every configured integration and whether it answers
      tags:
        - system
  /v1/system/version:
    get:
      description: What the operator quotes in a bug report, plus the readiness /readyz reports. /healthz and /readyz stay unauthenticated for orchestrators; this is their typed, authenticated twin for the UI.
      operationId: system-version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemVersionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Version and readiness of this instance
      tags:
        - system
  /v1/titles:
    get:
      operationId: list-titles
      parameters:
        - description: Filter by state
          explode: false
          in: query
          name: state
          schema:
            description: Filter by state
            enum:
              - wanted
              - requested
              - downloading
              - available
              - unavailable
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List titles, optionally filtered by state
      tags:
        - titles
    post:
      description: Idempotent by external id (§4). Admin only.
      operationId: enqueue-title
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Enqueue/ensure a title
      tags:
        - titles
  /v1/titles/{key}:
    delete:
      description: Admin only.
      operationId: delete-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Give up / cancel a title
      tags:
        - titles
    get:
      operationId: get-title
      parameters:
        - in: path
          name: key
          required: true
          schema:
            examples:
              - movie:tmdb:1111867
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a title's provisioning state
      tags:
        - titles
  /v1/users:
    get:
      operationId: list-users
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List users (admin)
      tags:
        - users
    post:
      operationId: create-local-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalUserInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a local account (admin)
      tags:
        - users
  /v1/users/candidates:
    get:
      description: Admin only. The media-server accounts available to import, each flagged whether it is already allowlisted (§11). Read-only — listing never provisions.
      operationId: import-candidates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCandidatesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List importable media-server accounts
      tags:
        - users
  /v1/users/import:
    post:
      description: Admin only. Allowlists the named media-server user ids — the only way a media-server user gains access (§11).
      operationId: import-users
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportUsersInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportUsersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Import media-server users
      tags:
        - users
  /v1/users/sync:
    post:
      operationId: sync-users
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Import/sync users from the media server (admin)
      tags:
        - users
  /v1/users/{id}:
    patch:
      operationId: patch-user
      parameters:
        - in: path
