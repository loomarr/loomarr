components:
  schemas:
    ActiveRuleDTO:
      additionalProperties: false
      properties:
        id:
          description: Stable rule id ('' when no rule matched)
          type: string
        label:
          description: Human-readable rule name, or 'Base policy' when none matched
          type: string
        matched:
          description: Whether a curation rule matched (false = base whole-policy behavior)
          type: boolean
        priority:
          description: The rule's priority (higher wins overlaps); 0 for the base policy
          format: int64
          type: integer
      required:
        - id
        - label
        - priority
        - matched
      type: object
    Activity:
      additionalProperties: false
      properties:
        at:
          format: int64
          type: integer
        id:
          type: string
        kind:
          type: string
        level:
          type: string
        subjectId:
          type: string
        text:
          type: string
      required:
        - id
        - at
        - kind
        - level
        - text
      type: object
    AdjacentContext:
      additionalProperties: false
      properties:
        key:
          type: string
        name:
          type: string
        votes:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - name
      type: object
    AppliedRelaxation:
      additionalProperties: false
      properties:
        from:
          type: string
        kind:
          type: string
        to:
          type: string
      required:
        - kind
        - from
        - to
      type: object
    ApprovalEditDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApprovalEditDTO.json
          format: uri
          readOnly: true
          type: string
        add:
          description: Titles to add as acquisitions
          items:
            $ref: "#/components/schemas/ProposalItem"
          type:
            - array
            - "null"
        drop:
          description: Provisioning keys to remove from the proposal before approving
          items:
            type: string
          type:
            - array
            - "null"
        note:
          description: A message to the requester, stored with the approval
          type: string
      type: object
    ApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        channelId:
          description: The channel this approval created or patched (§7). Empty only if channel creation failed — the approval itself still stands.
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        status:
          type: string
      required:
        - status
        - enqueued
      type: object
    AudiencePolicy:
      additionalProperties: false
      properties:
        ceiling:
          type: string
        unrated:
          type: string
      type: object
    AutoCurate:
      additionalProperties: false
      properties:
        maxTitles:
          format: int64
          type: integer
        minScorePct:
          format: int64
          type: integer
      type: object
    BackupEntry:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BackupEntry.json
          format: uri
          readOnly: true
          type: string
        bytes:
          description: Size on disk
          format: int64
          type: integer
        name:
          description: Filename, e.g. loomarr-2026-07-29-033000.db
          type: string
        writtenAt:
          description: Unix seconds
          format: int64
          type: integer
      required:
        - name
        - bytes
        - writtenAt
      type: object
    BackupList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BackupList.json
          format: uri
          readOnly: true
          type: string
        backups:
          description: On disk, newest first
          items:
            $ref: "#/components/schemas/BackupEntry"
          type:
            - array
            - "null"
        dir:
          description: Where backups are written (backup.dir)
          type: string
        retain:
          description: How many backups are kept; 0 keeps everything
          format: int64
          type: integer
        schedule:
          description: Cron for the scheduled backup (backup.schedule)
          type: string
        supported:
          description: Whether in-app backup is available on this backend
          type: boolean
      required:
        - supported
        - dir
        - schedule
        - retain
        - backups
      type: object
    BootstrapInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BootstrapInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: The owning admin's password (bcrypt-hashed at rest).
          type: string
        username:
          description: The owning admin's local username.
          type: string
      required:
        - username
        - password
      type: object
    BootstrapOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BootstrapOutputBody.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        name:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - role
      type: object
    BulkApproveInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkApproveInputBody.json
          format: uri
          readOnly: true
          type: string
        ids:
          description: Proposal ids to approve, each through the single approval gate
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - ids
      type: object
    BulkApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        approved:
          description: How many were approved
          format: int64
          type: integer
        results:
          items:
            $ref: "#/components/schemas/BulkApproveResult"
          type:
            - array
            - "null"
      required:
        - results
        - approved
      type: object
    BulkApproveResult:
      additionalProperties: false
      properties:
        channelId:
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        error:
          description: Why this one did not approve (already handled, not found, …)
          type: string
        id:
          type: string
        ok:
          type: boolean
      required:
        - id
        - ok
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChangePasswordInputBody.json
          format: uri
          readOnly: true
          type: string
        current:
          description: Your current password.
          format: password
          type: string
        next:
          description: The new password (min 8 characters).
          format: password
          minLength: 8
          type: string
      required:
        - current
        - next
      type: object
    ChannelDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChannelDTO.json
          format: uri
          readOnly: true
          type: string
        breakCount:
          description: Commercial-break gaps (§10) — NOT titles; a healthy break-heavy channel has a large breakCount and zero pendingCount
          format: int64
          type: integer
        group:
          examples:
            - Kids
          type: string
        id:
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        lineup:
          description: The channel's titles, in order (the intent-level lineup, not the expanded slots)
          items:
            $ref: "#/components/schemas/LineupEntryDTO"
          type:
            - array
            - "null"
        logo:
          description: Channel icon URL — pushed to Tunarr's channel icon (from TMDB, an upload, or set directly)
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          description: Guide channel number
          examples:
            - 42
          format: int64
          type: integer
        pendingCount:
          description: "Lineup titles not yet available — awaiting acquisition (coming-soon gaps + pod-fill placeholders). Health keys on this: pendingCount==0 means every title is ready, even on a channel full of commercial breaks."
          format: int64
          type: integer
        policy:
          $ref: "#/components/schemas/ChannelPolicy"
          description: Programming policy (scope/audience/separation/ordering/seasonal) + applied relaxations
        programCount:
          description: Real playable programs (available titles) in the desired lineup
          format: int64
          type: integer
        slotCount:
          description: Total desired slots incl. breaks + placeholders. NOT a readiness signal — use programCount/pendingCount (a break gap inflates this without any title pending). Kept for diagnostics.
          format: int64
          type: integer
        status:
          description: Loomarr-side channel status (§9)
          enum:
            - building
            - live
            - empty
            - drifted
            - detached
            - paused
          type: string
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
        tunarrId:
          description: Server-assigned Tunarr channel id; empty until first reconcile
          type: string
      required:
        - id
        - name
        - number
        - strategy
        - status
        - programCount
        - pendingCount
        - breakCount
        - slotCount
        - policy
        - lineup
      type: object
    ChannelNowNext:
      additionalProperties: false
      properties:
        channelId:
          description: Loomarr channel id
          type: string
        next:
          $ref: "#/components/schemas/NowNextEntry"
        now:
          $ref: "#/components/schemas/NowNextEntry"
      required:
        - channelId
      type: object
    ChannelPolicy:
      additionalProperties: false
      properties:
        applied:
          items:
            $ref: "#/components/schemas/AppliedRelaxation"
          type:
            - array
            - "null"
        audience:
          $ref: "#/components/schemas/AudiencePolicy"
        autoCurate:
          $ref: "#/components/schemas/AutoCurate"
        filler:
          $ref: "#/components/schemas/FillerSelection"
        operatorSet:
          items:
            type: string
          type:
            - array
            - "null"
        ordering:
          type: string
        playout:
          $ref: "#/components/schemas/PlayoutPolicy"
        rules:
          items:
            $ref: "#/components/schemas/SchedulingRule"
          type:
            - array
            - "null"
        scope:
          $ref: "#/components/schemas/ScopePolicy"
        seasonal:
          $ref: "#/components/schemas/SeasonalPolicy"
        separation:
          $ref: "#/components/schemas/SeparationPolicy"
        window:
          description: A Go-duration string, e.g. "168h" (7 days) or "24h". Empty/omitted means no limit.
          examples:
            - 168h
            - 24h
          type: string
      type: object
    ClipDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClipDTO.json
          format: uri
          readOnly: true
          type: string
        aiTagged:
          type: boolean
        audience:
          enum:
            - kids
            - family
            - general
            - late_night
            - ""
          type: string
        category:
          type: string
        durationMs:
          format: int64
          type: integer
        era:
          format: int64
          type: integer
        kind:
          enum:
            - commercial
            - bumper
            - station_id
            - psa
            - trailer
            - interstitial
          type: string
        lastPlayedAt:
          description: RFC3339; absent if never played (or not counted)
          type: string
        name:
          type: string
        path:
          type: string
        playCount:
          format: int64
          type: integer
        playsCounted:
          description: False when this install cannot observe airings (Tunarr-backed playout) — render as 'not counted', not as 0
          type: boolean
        quality:
          description: Resolution label from the probed video height (1080p, 480p). Display-only by default; affects selection only when the filler.min_quality floor is set, which is off unless an operator turns it on.
          type: string
        source:
          type: string
        tagged:
          description: Whether the clip has all match tags (era+audience+category)
          type: boolean
        thumbnail:
          type: string
        tunarrProgramId:
          type: string
      required:
        - path
        - name
        - kind
        - durationMs
        - playCount
        - playsCounted
        - aiTagged
        - tagged
      type: object
    CollectionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CollectionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        collections:
          items:
            $ref: "#/components/schemas/LibraryCollection"
          type:
            - array
            - "null"
      required:
        - collections
      type: object
    CoverageDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CoverageDTO.json
          format: uri
          readOnly: true
          type: string
        level:
          description: The rung a break would actually be filled from — the tightest non-empty one. bumper_card means nothing matches and breaks run on the embedded card.
          enum:
            - exact
            - widened
            - audience
            - bumper_card
          type: string
        rungs:
          description: Ladder rungs, TIGHTEST FIRST. A rung the channel's policy skips is absent, not zero.
          items:
            $ref: "#/components/schemas/CoverageRungDTO"
          type:
            - array
            - "null"
        total:
          description: Distinct eligible clips across the widest rung. NOT a sum of the rungs — they nest, so adding them counts one clip up to three times.
          format: int64
          type: integer
      required:
        - rungs
        - level
        - total
      type: object
    CoverageRungDTO:
      additionalProperties: false
      properties:
        clips:
          description: Eligible clips this rung holds, after the channel's kind/category/exclusion narrowing
          format: int64
          type: integer
        level:
          description: The ladder rung (§10)
          enum:
            - exact
            - widened
            - audience
            - bumper_card
          type: string
      required:
        - level
        - clips
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateChannelInputBody.json
          format: uri
          readOnly: true
          type: string
        group:
          examples:
            - Kids
          type: string
        id:
          description: Loomarr channel id (stable). Optional — omit and the server assigns one (ch_…); pass one to keep a caller-assigned id.
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        logo:
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          examples:
            - 42
          format: int64
          minimum: 1
          type: integer
        series:
          $ref: "#/components/schemas/SeriesStruct"
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
      required:
        - name
        - number
        - strategy
      type: object
    CreateLocalUserInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateLocalUserInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          format: password
          minLength: 8
          type: string
        quota:
          description: Pending-acquisition cap; 0 = the default.
          format: int64
          type: integer
        role:
          description: Defaults to member.
          enum:
            - admin
            - member
          type: string
        username:
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    CycleSlotDTO:
      additionalProperties: false
      properties:
        episode:
          description: Series episode number (0 = movie/unknown)
          format: int64
          type: integer
        key:
          description: Provisioning key of the title (empty for a break)
          type: string
        kind:
          description: program = a playable title; pending = an acquisition not yet available; break = a commercial gap
          enum:
            - program
            - pending
            - break
          type: string
        part:
          description: Play order within a multi-part or franchise group (0 = standalone)
          format: int64
          type: integer
        season:
          description: Series season number (0 = movie/unknown)
          format: int64
          type: integer
        title:
          description: Display label; empty for a break gap
          type: string
      required:
        - kind
      type: object
    DatabaseBackup:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DatabaseBackup.json
          format: uri
          readOnly: true
          type: string
        bytes:
          description: Size on disk
          format: int64
          type: integer
        path:
          description: Where the backup was written
          type: string
        writtenAt:
          description: Unix seconds
          format: int64
          type: integer
      required:
        - path
        - bytes
        - writtenAt
      type: object
    DatabaseCheck:
      additionalProperties: false
      properties:
        detail:
          description: Operator-facing detail — shown under the name
          type: string
        name:
          description: Check name, e.g. Target is empty
          type: string
        ok:
          description: Whether this check passed
          type: boolean
      required:
        - name
        - detail
        - ok
      type: object
    DatabasePreflightOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DatabasePreflightOutputBody.json
          format: uri
          readOnly: true
          type: string
        checks:
          items:
            $ref: "#/components/schemas/DatabaseCheck"
          type:
            - array
            - "null"
        passed:
          description: True only if every check passed
          type: boolean
      required:
        - checks
        - passed
      type: object
    DatabaseStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DatabaseStatus.json
          format: uri
          readOnly: true
          type: string
        backend:
          description: "Active backend: sqlite or postgres"
          type: string
        backup:
          $ref: "#/components/schemas/DatabaseBackup"
          description: The backup taken for this migration, if any
        canMigrate:
          description: Whether a migration is offered at all
          type: boolean
        error:
          description: Why the last migration failed, if it did
          type: string
        parity:
          description: unknown|match|mismatch
          type: string
        phase:
          description: idle|migrating|verified|failed
          type: string
        tables:
          description: Per-table progress; empty when idle
          items:
            $ref: "#/components/schemas/DatabaseTable"
          type:
            - array
            - "null"
      required:
        - backend
        - canMigrate
        - phase
        - tables
        - parity
      type: object
    DatabaseSwitchoverOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DatabaseSwitchoverOutputBody.json
          format: uri
          readOnly: true
          type: string
        note:
          description: What happens next, in operator-facing prose
          type: string
        restartRequired:
          description: Always true — DATABASE_URL is a boot-time setting
          type: boolean
      required:
        - restartRequired
        - note
      type: object
    DatabaseTable:
      additionalProperties: false
      properties:
        copied:
          description: Rows copied into the target so far
          format: int64
          type: integer
        source:
          description: Rows in the source database
          format: int64
          type: integer
        table:
          description: Table name
          type: string
      required:
        - table
        - source
        - copied
      type: object
    DatabaseTargetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DatabaseTargetInputBody.json
          format: uri
          readOnly: true
          type: string
        dsn:
          description: postgres:// connection string for the target
          type: string
      required:
        - dsn
      type: object
    DenyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyInputBody.json
          format: uri
          readOnly: true
          type: string
        reason:
          type: string
      type: object
    DenyOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DenyOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    DiscoverFillerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DiscoverFillerOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/DiscoveredClip"
          type:
            - array
            - "null"
        licenceNote:
          type: string
        total:
          format: int64
          type: integer
      required:
        - items
        - total
        - licenceNote
      type: object
    DiscoverModelView:
      additionalProperties: false
      properties:
        downloads:
          description: Source popularity — a ranking tiebreak only; not shown to the user (§8.1)
          format: int64
          type: integer
        fit:
          description: fits|tight|wont_fit against detected VRAM
          type: string
        id:
          description: Source repo id, e.g. unsloth/Qwen3.5-4B-GGUF
          type: string
        label:
          description: Human-friendly name, e.g. Qwen3.5 4B
          type: string
        note:
          description: Plain-English why-pick-this hint derived from role + fit (§8.1). Presentation only; may be empty.
          type: string
        pullRef:
          description: Model ref to POST to /pull — the bare repo (e.g. hf.co/unsloth/Qwen3.5-4B-GGUF); Ollama pulls its latest tag
          type: string
        quant:
          description: The build we sized against — Ollama's latest resolves to it (e.g. Q4_K_M). Informational; the pull is by bare repo ref.
          type: string
        recommended:
          description: True for the single safe-default pick for this machine — the hero card (§8.1). At most one per list.
          type: boolean
        role:
          description: "Plain-English job in the user's choice: balanced|faster|higher_quality (§8.1)"
          type: string
        sizeGiB:
          description: Sized build's on-disk size (VRAM proxy) — what latest downloads
          format: double
          type: number
      required:
        - id
        - label
        - quant
        - pullRef
        - sizeGiB
        - fit
        - downloads
        - role
        - recommended
      type: object
    DiscoveredClip:
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
        year:
          format: int64
          type: integer
      required:
        - id
        - url
      type: object
    DocSummary:
      additionalProperties: false
      properties:
        slug:
          examples:
            - troubleshooting
          type: string
        title:
          examples:
            - Troubleshooting
          type: string
      required:
        - slug
        - title
      type: object
    EnqueueInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnqueueInputBody.json
          format: uri
          readOnly: true
          type: string
        mediaType:
          enum:
            - movie
            - series
          type: string
        name:
          type: string
        seasons:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        tmdbId:
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - mediaType
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
