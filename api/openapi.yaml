components:
  schemas:
    ActiveRuleDTO:
      additionalProperties: false
      properties:
        id:
          description: Stable rule id ('' when no rule matched)
          type: string
        label:
          description: Human-readable rule name, or 'Base policy' when none matched
          type: string
        matched:
          description: Whether a curation rule matched (false = base whole-policy behavior)
          type: boolean
        priority:
          description: The rule's priority (higher wins overlaps); 0 for the base policy
          format: int64
          type: integer
      required:
        - id
        - label
        - priority
        - matched
      type: object
    Activity:
      additionalProperties: false
      properties:
        at:
          format: int64
          type: integer
        id:
          type: string
        kind:
          type: string
        level:
          type: string
        subjectId:
          type: string
        text:
          type: string
      required:
        - id
        - at
        - kind
        - level
        - text
      type: object
    AddFillerSourceInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddFillerSourceInputBody.json
          format: uri
          readOnly: true
          type: string
        kind:
          description: Which kind of source this is
          enum:
            - archive
            - youtube
            - folder
            - library
          type: string
        label:
          description: Operator-facing name; falls back to the identifier
          type: string
        uri:
          description: An archive.org collection identifier/URL, a YouTube playlist or channel URL, a folder path Loomarr can read, or a media-server library name
          minLength: 1
          type: string
      required:
        - kind
        - uri
      type: object
    AdjacentContext:
      additionalProperties: false
      properties:
        key:
          type: string
        name:
          type: string
        votes:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - name
      type: object
    AppliedRelaxation:
      additionalProperties: false
      properties:
        from:
          type: string
        kind:
          type: string
        to:
          type: string
      required:
        - kind
        - from
        - to
      type: object
    ApprovalEditDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApprovalEditDTO.json
          format: uri
          readOnly: true
          type: string
        add:
          description: Titles to add as acquisitions
          items:
            $ref: "#/components/schemas/ProposalItem"
          type:
            - array
            - "null"
        drop:
          description: Provisioning keys to remove from the proposal before approving
          items:
            type: string
          type:
            - array
            - "null"
        note:
          description: A message to the requester, stored with the approval
          type: string
      type: object
    ApproveFillerPullInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApproveFillerPullInputBody.json
          format: uri
          readOnly: true
          type: string
        dropSourceIds:
          items:
            type: string
          type:
            - array
            - "null"
        note:
          description: Narrowing instruction, e.g. 'no local dealers, no PSAs'
          type: string
      type: object
    ApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        channelId:
          description: The channel this approval created or patched (§7). Empty only if channel creation failed — the approval itself still stands.
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        status:
          type: string
      required:
        - status
        - enqueued
      type: object
    AudiencePolicy:
      additionalProperties: false
      properties:
        ceiling:
          type: string
        unrated:
          type: string
      type: object
    AutoCurate:
      additionalProperties: false
      properties:
        maxTitles:
          format: int64
          type: integer
        minScorePct:
          format: int64
          type: integer
      type: object
    BackupEntry:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BackupEntry.json
          format: uri
          readOnly: true
          type: string
        bytes:
          description: Size on disk
          format: int64
          type: integer
        name:
          description: Filename, e.g. loomarr-2026-07-29-033000.db
          type: string
        writtenAt:
          description: Unix seconds
          format: int64
          type: integer
      required:
        - name
        - bytes
        - writtenAt
      type: object
    BackupList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BackupList.json
          format: uri
          readOnly: true
          type: string
        backups:
          description: On disk, newest first
          items:
            $ref: "#/components/schemas/BackupEntry"
          type:
            - array
            - "null"
        dir:
          description: Where backups are written (backup.dir)
          type: string
        retain:
          description: How many backups are kept; 0 keeps everything
          format: int64
          type: integer
        schedule:
          description: Cron for the scheduled backup (backup.schedule)
          type: string
        supported:
          description: Whether in-app backup is available on this backend
          type: boolean
      required:
        - supported
        - dir
        - schedule
        - retain
        - backups
      type: object
    BootstrapInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BootstrapInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: The owning admin's password (bcrypt-hashed at rest).
          type: string
        username:
          description: The owning admin's local username.
          type: string
      required:
        - username
        - password
      type: object
    BootstrapOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BootstrapOutputBody.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        name:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - role
      type: object
    BulkApproveInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkApproveInputBody.json
          format: uri
          readOnly: true
          type: string
        ids:
          description: Proposal ids to approve, each through the single approval gate
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - ids
      type: object
    BulkApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        approved:
          description: How many were approved
          format: int64
          type: integer
        results:
          items:
            $ref: "#/components/schemas/BulkApproveResult"
          type:
            - array
            - "null"
      required:
        - results
        - approved
      type: object
    BulkApproveResult:
      additionalProperties: false
      properties:
        channelId:
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        error:
          description: Why this one did not approve (already handled, not found, …)
          type: string
        id:
          type: string
        ok:
          type: boolean
      required:
        - id
        - ok
      type: object
    BulkRemoveFillerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkRemoveFillerInputBody.json
          format: uri
          readOnly: true
          type: string
        hashes:
          description: Clip identities (content hashes, §10 V45a)
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
        restore:
          description: Put the clips back in the catalog instead of removing them
          type: boolean
      required:
        - hashes
      type: object
    BulkResultOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkResultOutputBody.json
          format: uri
          readOnly: true
          type: string
        missing:
          format: int64
          type: integer
        updated:
          description: How many clips actually changed
          format: int64
          type: integer
      required:
        - updated
        - missing
      type: object
    BulkTagFillerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BulkTagFillerInputBody.json
          format: uri
          readOnly: true
          type: string
        audience:
          description: Omit to leave it alone.
          enum:
            - kids
            - family
            - general
            - late_night
          type: string
        era:
          description: Set the era on every selected clip. Omit to leave it alone.
          format: int64
          type: integer
        hashes:
          description: Clip identities (content hashes, §10 V45a)
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
        tags:
          description: Taxonomy tags to set on every selected clip. Grounded on write; category derived. Omit to leave alone (§10 V45a).
          items:
            type: string
          type: array
      required:
        - hashes
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChangePasswordInputBody.json
          format: uri
          readOnly: true
          type: string
        current:
          description: Your current password.
          format: password
          type: string
        next:
          description: The new password (min 8 characters).
          format: password
          minLength: 8
          type: string
      required:
        - current
        - next
      type: object
    ChannelDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChannelDTO.json
          format: uri
          readOnly: true
          type: string
        breakCount:
          description: Commercial-break gaps (§10) — NOT titles; a healthy break-heavy channel has a large breakCount and zero pendingCount
          format: int64
          type: integer
        group:
          examples:
            - Kids
          type: string
        id:
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        lineup:
          description: The channel's titles, in order (the intent-level lineup, not the expanded slots)
          items:
            $ref: "#/components/schemas/LineupEntryDTO"
          type:
            - array
            - "null"
        logo:
          description: Channel icon URL — pushed to Tunarr's channel icon (from TMDB, an upload, or set directly)
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          description: Guide channel number
          examples:
            - 42
          format: int64
          type: integer
        pendingCount:
          description: "Lineup titles not yet available — awaiting acquisition (coming-soon gaps + pod-fill placeholders). Health keys on this: pendingCount==0 means every title is ready, even on a channel full of commercial breaks."
          format: int64
          type: integer
        policy:
          $ref: "#/components/schemas/ChannelPolicy"
          description: Programming policy (scope/audience/separation/ordering/seasonal) + applied relaxations
        programCount:
          description: Real playable programs (available titles) in the desired lineup
          format: int64
          type: integer
        slotCount:
          description: Total desired slots incl. breaks + placeholders. NOT a readiness signal — use programCount/pendingCount (a break gap inflates this without any title pending). Kept for diagnostics.
          format: int64
          type: integer
        status:
          description: Loomarr-side channel status (§9)
          enum:
            - building
            - live
            - empty
            - drifted
            - detached
            - paused
          type: string
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
        tunarrId:
          description: Server-assigned Tunarr channel id; empty until first reconcile
          type: string
      required:
        - id
        - name
        - number
        - strategy
        - status
        - programCount
        - pendingCount
        - breakCount
        - slotCount
        - policy
        - lineup
      type: object
    ChannelFitDTO:
      additionalProperties: false
      properties:
        channelId:
          type: string
        excluded:
          type: boolean
        level:
          description: The rung this clip would be drawn from; bumper_card means it is not a candidate (see reason)
          enum:
            - exact
            - widened
            - audience
            - bumper_card
          type: string
        name:
          type: string
        number:
          format: int64
          type: integer
        pinned:
          type: boolean
        reason:
          description: Why the clip is not a candidate; absent when it is one
          enum:
            - kind
            - duration
            - quality
            - category
            - audience
            - excluded
          type: string
      required:
        - channelId
        - name
        - number
        - level
        - pinned
        - excluded
      type: object
    ChannelHealth:
      additionalProperties: false
      properties:
        bufferedMs:
          description: Encoded lead over realtime in ms; negative = falling behind
          format: int64
          type: integer
        channelId:
          type: string
        coldStartMs:
          description: Time to first frame in ms — the black-screen window; 0 if unmeasured
          format: int64
          type: integer
        encoder:
          description: Resolved encoder, or 'copy' when direct-playing
          type: string
        hardware:
          description: Whether the encoder is hardware-accelerated
          type: boolean
        health:
          description: ok | degraded | stalled
          type: string
        mode:
          description: direct-play (copy) | transcode
          type: string
        name:
          description: Channel name for display (empty = unknown)
          type: string
        number:
          description: Channel number for display (0 = unknown)
          format: int64
          type: integer
        reason:
          description: One line an operator can act on
          type: string
        speed:
          description: Realtime multiple; <1.0 means the channel will stutter
          format: double
          type: number
        target:
          description: "Codec audience: browser|mediaserver (§9.1 V47)"
          type: string
        viewers:
          description: How many clients are attached
          format: int64
          type: integer
      required:
        - channelId
        - number
        - name
        - target
        - viewers
        - bufferedMs
        - encoder
        - hardware
        - mode
        - speed
        - health
        - reason
        - coldStartMs
      type: object
    ChannelNowNext:
      additionalProperties: false
      properties:
        channelId:
          description: Loomarr channel id
          type: string
        next:
          $ref: "#/components/schemas/NowNextEntry"
        now:
          $ref: "#/components/schemas/NowNextEntry"
      required:
        - channelId
      type: object
    ChannelPolicy:
      additionalProperties: false
      properties:
        applied:
          items:
            $ref: "#/components/schemas/AppliedRelaxation"
          type:
            - array
            - "null"
        audience:
          $ref: "#/components/schemas/AudiencePolicy"
        autoCurate:
          $ref: "#/components/schemas/AutoCurate"
        filler:
          $ref: "#/components/schemas/FillerSelection"
        operatorSet:
          items:
            type: string
          type:
            - array
            - "null"
        ordering:
          type: string
        playout:
          $ref: "#/components/schemas/PlayoutPolicy"
        rules:
          items:
            $ref: "#/components/schemas/SchedulingRule"
          type:
            - array
            - "null"
        scope:
          $ref: "#/components/schemas/ScopePolicy"
        seasonal:
          $ref: "#/components/schemas/SeasonalPolicy"
        separation:
          $ref: "#/components/schemas/SeparationPolicy"
        window:
          description: A Go-duration string, e.g. "168h" (7 days) or "24h". Empty/omitted means no limit.
          examples:
            - 168h
            - 24h
          type: string
      type: object
    ChannelTracksOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChannelTracksOutputBody.json
          format: uri
          readOnly: true
          type: string
        audio:
          items:
            $ref: "#/components/schemas/TrackDTO"
          type:
            - array
            - "null"
        subtitles:
          items:
            $ref: "#/components/schemas/TrackDTO"
          type:
            - array
            - "null"
      required:
        - audio
        - subtitles
      type: object
    ClipDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClipDTO.json
          format: uri
          readOnly: true
          type: string
        aiTagged:
          type: boolean
        audience:
          enum:
            - kids
            - family
            - general
            - late_night
            - ""
          type: string
        category:
          description: Derived primary product-leaf tag; the full set is in tags (§10 V45a)
          type: string
        durationMs:
          format: int64
          type: integer
        era:
          format: int64
          type: integer
        hash:
          type: string
        isComposite:
          description: A recorded break (many ads in one file), not airable — render as a container whose segments are the airable clips (§10 V45)
          type: boolean
        kind:
          enum:
            - commercial
            - bumper
            - station_id
            - psa
            - trailer
            - interstitial
          type: string
        lastPlayedAt:
          description: RFC3339; absent if never played (or not counted)
          type: string
        name:
          type: string
        parentHash:
          description: The composite this clip was split from; absent for a non-segment clip (§10 V45)
          type: string
        playCount:
          format: int64
          type: integer
        playsCounted:
          description: False when this install cannot observe airings (Tunarr-backed playout) — render as 'not counted', not as 0
          type: boolean
        preview:
          description: Animated hover preview; absent when not generated — fall back to the thumbnail, do not render a placeholder
          type: string
        quality:
          description: Resolution label from the probed video height (1080p, 480p). Display-only by default; affects selection only when the filler.min_quality floor is set, which is off unless an operator turns it on.
          type: string
        source:
          type: string
        suggestedEra:
          description: AI-proposed era NOT persisted as a tag because the year is absent from the clip's text signals (§10). Confirm by PATCHing era; 0 = no suggestion.
          format: int64
          type: integer
        tagged:
          description: Whether the clip has all match tags (era+audience+category)
          type: boolean
        tags:
          description: The clip's taxonomy tags (leaf + rolled-up ancestors); category is the derived primary product leaf (§10 V45a)
          items:
            type: string
          type:
            - array
            - "null"
        thumbnail:
          type: string
        tunarrProgramId:
          type: string
      required:
        - hash
        - name
        - kind
        - durationMs
        - playCount
        - playsCounted
        - aiTagged
        - tagged
      type: object
    ClipFitOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClipFitOutputBody.json
          format: uri
          readOnly: true
          type: string
        channels:
          items:
            $ref: "#/components/schemas/ChannelFitDTO"
          type:
            - array
            - "null"
      required:
        - channels
      type: object
    CollectionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CollectionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        collections:
          items:
            $ref: "#/components/schemas/LibraryCollection"
          type:
            - array
            - "null"
      required:
        - collections
      type: object
    ConfirmFillerSplitInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConfirmFillerSplitInputBody.json
          format: uri
          readOnly: true
          type: string
        segments:
          items:
            $ref: "#/components/schemas/SplitSegment"
          minItems: 1
          type:
            - array
            - "null"
      required:
        - segments
      type: object
    ConfirmFillerSplitOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConfirmFillerSplitOutputBody.json
          format: uri
          readOnly: true
          type: string
        clips:
          format: int64
          type: integer
      required:
        - clips
      type: object
    CoverageDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CoverageDTO.json
          format: uri
          readOnly: true
          type: string
        level:
          description: The rung a break would actually be filled from — the tightest non-empty one. bumper_card means nothing matches and breaks run on the embedded card.
          enum:
            - exact
            - widened
            - audience
            - bumper_card
          type: string
        rungs:
          description: Ladder rungs, TIGHTEST FIRST. A rung the channel's policy skips is absent, not zero.
          items:
            $ref: "#/components/schemas/CoverageRungDTO"
          type:
            - array
            - "null"
        total:
          description: Distinct eligible clips across the widest rung. NOT a sum of the rungs — they nest, so adding them counts one clip up to three times.
          format: int64
          type: integer
      required:
        - rungs
        - level
        - total
      type: object
    CoverageRungDTO:
      additionalProperties: false
      properties:
        clips:
          description: Eligible clips this rung holds, after the channel's kind/category/exclusion narrowing
          format: int64
          type: integer
        level:
          description: The ladder rung (§10)
          enum:
            - exact
            - widened
            - audience
            - bumper_card
          type: string
      required:
        - level
        - clips
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateChannelInputBody.json
          format: uri
          readOnly: true
          type: string
        group:
          examples:
            - Kids
          type: string
        id:
          description: Loomarr channel id (stable). Optional — omit and the server assigns one (ch_…); pass one to keep a caller-assigned id.
          examples:
            - ch_abc123
          type: string
        intentRef:
          type: string
        logo:
          type: string
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          examples:
            - 42
          format: int64
          minimum: 1
          type: integer
        series:
          $ref: "#/components/schemas/SeriesStruct"
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
      required:
        - name
        - number
        - strategy
      type: object
    CreateLocalUserInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateLocalUserInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          format: password
          minLength: 8
          type: string
        quota:
          description: Pending-acquisition cap; 0 = the default.
          format: int64
          type: integer
        role:
          description: Defaults to member.
          enum:
            - admin
            - member
          type: string
        username:
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    CycleSlotDTO:
      additionalProperties: false
      properties:
        episode:
          description: Series episode number (0 = movie/unknown)
          format: int64
          type: integer
        key:
          description: Provisioning key of the title (empty for a break)
          type: string
        kind:
          description: program = a playable title; pending = an acquisition not yet available; break = a commercial gap
          enum:
            - program
            - pending
            - break
          type: string
        part:
