# Loomarr dev dependencies (not the app itself). Brings up a persistent local Tunarr
# to develop the Programmer adapter (§9/§10) and filler pipeline (§12) against.
#
#   make dev                                             # portable (Mac or Linux, CPU transcode)
#   make dev-gpu                                          # Linux + NVIDIA (adds compose.dev.gpu.yaml)
#   docker compose -f docker/compose.dev.yaml up -d
#   docker compose -f docker/compose.dev.yaml logs -f tunarr
#
# Tunarr owns transcoding/streaming/EPG; loomarr owns lineup + filler (§6). Its media source
# (Emby) is configured via Tunarr's API after first start — see docker/tunarr-dev-setup.md.
# Pinned to the version our vendored spec (api/vendor/tunarr-openapi.json) was captured against.
#
# This base file is host-agnostic (Mac/Apple-Silicon or Linux). NVIDIA GPU transcode is an
# opt-in overlay (docker/compose.dev.gpu.yaml) since it only applies on a Linux NVIDIA host —
# on a Mac there is no GPU passthrough and the image runs under emulation (see below).

services:
  tunarr:
    # 1.3.8 — matches api/vendor/tunarr-openapi.json. Digest-pinned so :latest drift can't
    # silently invalidate the vendored spec (design §6: "pin and record the version tested").
    image: chrisbenincasa/tunarr:1.3.8@sha256:88122a21c21e62c3786db786cb2725f2b94da538ea613d08febb67bf3d912e3e
    # The 1.3.8 image is amd64-only (no arm64 tag). Pinning the platform makes Apple Silicon
    # run it under emulation deterministically instead of failing to resolve a manifest.
    # Transcoding under emulation is slow — fine for developing the adapter/API against; for
    # real playback use the Linux GPU host (compose.dev.gpu.yaml).
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${TUNARR_DEV_PORT:-8000}:8000"
    volumes:
      - tunarr-dev-config:/config/tunarr
      # Filler drop-folder (§10): Loomarr registers this path as a Tunarr `local`
      # media source and syncs the scanned clips. Loomarr's own ingest writes here
      # (in-core since the sidecar was removed, §10); Tunarr scans it. Same path
      # inside Loomarr's FILLER_DIR and here.
      - ${FILLER_DROP_DIR:-../.filler-drop}:/filler
volumes:
  tunarr-dev-config:
