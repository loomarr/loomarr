# Loomarr deployment compose (design §16). Profiles: sqlite · postgres · ai.
# Filler ingest is NOT a profile — it is an image tag: run loomarr:filler (same binary,
# plus vendored yt-dlp + ffmpeg) to download clips in-app. See §16.
#
#   docker compose -f docker/compose.yaml --profile sqlite up -d
#   docker compose -f docker/compose.yaml --profile postgres up -d
#
# The `ai` profile is orthogonal — ADD it to run a local Ollama (the default
# LLM_PROVIDER points at http://ollama:11434). Skip it for a hosted/external LLM:
#   docker compose -f docker/compose.yaml --profile sqlite --profile ai up -d
#
# The `ai` profile starts Ollama ready-to-use but WITHOUT a model — model choice is the
# setup wizard's job (design §8.1: the right model depends on your GPU). Two knobs:
#   • Fast local inference (NVIDIA + nvidia-container-toolkit): add the GPU overlay —
#       docker compose -f docker/compose.yaml -f docker/compose.gpu.yaml \
#         --profile sqlite --profile ai up -d
#   • Zero-touch (preload a model, skip the wizard's AI step): set LLM_MODEL, e.g.
#       LLM_MODEL=qwen3:8b docker compose -f docker/compose.yaml --profile sqlite --profile ai up -d
#     Left unset, the wizard picks the model — the design default.
#
# For local dev dependencies (a persistent Tunarr wired to Emby) see compose.dev.yaml.

services:
  # ---- sqlite profile: chown the fresh /data volume for the nonroot image (uid 65532) ----
  # A new named volume is root-owned; the distroless nonroot binary can't create
  # /data/loomarr.db without this one-shot chown. sqlite-only (postgres has no /data).
  loomarr-init:
    image: busybox:1.36
    profiles: ["sqlite"]
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes: ["loomarr-data:/data"]

  loomarr:
    image: loomarr:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      loomarr-init:
        condition: service_completed_successfully # sqlite profile; skipped when absent
        required: false                           # postgres profile has no init
      # ai profile: wait for Ollama to be ready (and any opt-in preload to finish) before
      # loomarr's first probe — so the AI settings/wizard never open on a transient "host
      # unreachable". required:false so a hosted/external-LLM deploy (no ai profile) skips it.
      ollama:
        condition: service_healthy
        required: false
      ollama-pull:
        condition: service_completed_successfully
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/loomarr.db}
      LIBRARY_FLAVOR: ${LIBRARY_FLAVOR}
      LIBRARY_URL: ${LIBRARY_URL}
      LIBRARY_TOKEN: ${LIBRARY_TOKEN}
      SEERR_URL: ${SEERR_URL}
      SEERR_API_KEY: ${SEERR_API_KEY}
      TUNARR_URL: ${TUNARR_URL}
      TUNARR_API_KEY: ${TUNARR_API_KEY:-}
      # Tunarr requires channel.transcodeConfigId to be a valid UUID on create
      # (1.3.8: empty ⇒ 400 "Invalid UUID"). Point at a Tunarr transcode config id.
      TUNARR_TRANSCODE_CONFIG_ID: ${TUNARR_TRANSCODE_CONFIG_ID:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      API_TOKEN: ${API_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_URL: ${LLM_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY}
      # Filler (§10): the drop-folder the core registers as a Tunarr `local` media
      # source. Set FILLER_DIR to the in-container mount below; the SAME host folder
      # must be mounted into your Tunarr container at the same path so Tunarr can
      # scan it (Tunarr is external — see compose.dev.yaml / your Tunarr deployment).
      FILLER_DIR: ${FILLER_DIR:-}
      FILLER_BREAKS_PER_HOUR: ${FILLER_BREAKS_PER_HOUR:-}
      # Loomarr's own address as your media server and Tunarr reach it (§9.1, §15).
      # REQUIRED for internal playout: every stream URL is built from this base, and
      # ffmpeg — a separate process fetching the playlist itself — has no notion of
      # "the origin this came from", so there is no relative fallback. A wrong value
      # means channels appear in the guide and never play.
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-}
      # Internal playout (§9.1). Defaults are deliberate: `internal` is the default
      # backend, and an empty encoder means "use the best one the transcode check
      # found". Set PLAYOUT_ENCODER only to override that choice.
      PLAYOUT_BACKEND: ${PLAYOUT_BACKEND:-internal}
      PLAYOUT_ENCODER: ${PLAYOUT_ENCODER:-}
      PLAYOUT_MAX_CHANNELS: ${PLAYOUT_MAX_CHANNELS:-}
      PLAYOUT_QUALITY_TIER: ${PLAYOUT_QUALITY_TIER:-}
      AUTO_MIGRATE: "true"
    ports: ["8080:8080"]
    # Mount the filler drop-folder so the core can hand its path to
    # Tunarr as a `local` source. Empty/unused when FILLER_DIR isn't set.
    volumes:
      - ${FILLER_DROP_DIR:-filler-drop}:/filler
    restart: unless-stopped
    # HTTP liveness against /healthz (image is distroless — no in-container curl).
    healthcheck:
      test: ["CMD", "/loomarr", "healthcheck"] # `healthcheck` subcommand: Phase 8+
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- sqlite profile: just loomarr + a /data volume for the DB file ----
  # (attach the volume only under this profile)

  # ---- postgres profile ----
  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: loomarr
      POSTGRES_USER: ${POSTGRES_USER:-loomarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loomarr}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    restart: unless-stopped

  # ---- ai profile: local Ollama (skip for a hosted/external LLM) ----
  # LLM_URL defaults to http://ollama:11434, so with --profile ai this "just works" once a
  # model is chosen. Model choice is the WIZARD's job (design §8.1: it depends on the user's
  # GPU) — so we do NOT bake in a model. For a truly zero-touch install, set LLM_MODEL and
  # the ollama-pull one-shot below fetches it on first boot; left empty, the wizard picks.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped
    # Readiness so loomarr waits for the server before its first probe (no transient
    # "AI host unreachable" on first load). `ollama list` exits 0 only once the server is up.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12       # up to ~2min for the server to come up on a cold start
      start_period: 20s

  # ---- ai profile, OPT-IN: preload a model so suggestions work with zero wizard steps ----
  # No-op unless LLM_MODEL is set (empty ⇒ `ollama pull ""` is skipped, exit 0). This keeps
  # the design-default "the user picks the model" intact while making a fully-scripted,
  # model-included deploy a one-env-var opt-in. Runs to completion, then loomarr can start.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-}
    entrypoint: ["/bin/sh", "-c"]
    # Guard on a non-empty tag; pulling is idempotent, so a re-run with the model present
    # is a fast no-op. A pull failure is non-fatal to the stack — the wizard can still pull.
    command:
      - |
        if [ -n "$${LLM_MODEL}" ]; then
          echo "Preloading LLM_MODEL=$${LLM_MODEL} into Ollama…"
          ollama pull "$${LLM_MODEL}"
        else
          echo "LLM_MODEL not set — skipping preload (pick a model in the setup wizard)."
        fi
    restart: "no"

volumes:
  loomarr-data: # sqlite backend
  pg-data: # postgres profile
  filler-drop: # filler drop-folder (override with FILLER_DROP_DIR bind mount)
  ollama: # ai profile
