# Loomarr deployment compose (design §16). Profiles: sqlite · postgres · ai · filler.
#
#   docker compose -f docker/compose.yaml --profile sqlite up -d
#   docker compose -f docker/compose.yaml --profile postgres up -d
#
# For local dev dependencies (a persistent Tunarr wired to Emby) see compose.dev.yaml.

services:
  # ---- sqlite profile: chown the fresh /data volume for the nonroot image (uid 65532) ----
  # A new named volume is root-owned; the distroless nonroot binary can't create
  # /data/loomarr.db without this one-shot chown. sqlite-only (postgres has no /data).
  loomarr-init:
    image: busybox:1.36
    profiles: ["sqlite"]
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes: ["loomarr-data:/data"]

  loomarr:
    image: loomarr:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      loomarr-init:
        condition: service_completed_successfully # sqlite profile; skipped when absent
        required: false                           # postgres profile has no init
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/loomarr.db}
      LIBRARY_FLAVOR: ${LIBRARY_FLAVOR}
      LIBRARY_URL: ${LIBRARY_URL}
      LIBRARY_TOKEN: ${LIBRARY_TOKEN}
      SEERR_URL: ${SEERR_URL}
      SEERR_API_KEY: ${SEERR_API_KEY}
      TUNARR_URL: ${TUNARR_URL}
      TUNARR_API_KEY: ${TUNARR_API_KEY:-}
      # Tunarr requires channel.transcodeConfigId to be a valid UUID on create
      # (1.3.8: empty ⇒ 400 "Invalid UUID"). Point at a Tunarr transcode config id.
      TUNARR_TRANSCODE_CONFIG_ID: ${TUNARR_TRANSCODE_CONFIG_ID:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      API_TOKEN: ${API_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_URL: ${LLM_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY}
      AUTO_MIGRATE: "true"
    ports: ["8080:8080"]
    restart: unless-stopped
    # HTTP liveness against /healthz (image is distroless — no in-container curl).
    healthcheck:
      test: ["CMD", "/loomarr", "healthcheck"] # `healthcheck` subcommand: Phase 8+
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- sqlite profile: just loomarr + a /data volume for the DB file ----
  # (attach the volume only under this profile)

  # ---- postgres profile ----
  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: loomarr
      POSTGRES_USER: ${POSTGRES_USER:-loomarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loomarr}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    restart: unless-stopped

  # ---- ai profile: local Ollama (skip for anthropic/external) ----
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

  # ---- filler profile: loomarr-ingest sidecar (Phase 12) ----
  # Go binary bundling yt-dlp + ffmpeg (YouTube + Archive.org → drop-folder).
  # Separate image so that ~170MB of media tooling never touches the core (§16).
  loomarr-ingest:
    image: loomarr-ingest:latest
    build:
      context: ..
      dockerfile: Dockerfile.ingest
    profiles: ["filler"]
    environment:
      # The sidecar owns its OWN config (§10 — the core has no download config).
      INGEST_DROP_DIR: /drop
      INGEST_SOURCES: ${INGEST_SOURCES:-}      # comma-separated YouTube playlist / Archive.org URLs
      INGEST_EVERY: ${INGEST_EVERY:-6h}        # unset for single-shot
      INGEST_PREFER_ORIGINAL: ${INGEST_PREFER_ORIGINAL:-false}  # true keeps full-quality masters; default takes Archive's small derivative (right for filler)
    volumes:
      # The drop-folder MUST be the same path the media server scans as its
      # filler library (§10); loomarr then syncs the catalog from the server.
      - ${FILLER_DROP_DIR:-filler-drop}:/drop
    restart: unless-stopped

volumes:
  loomarr-data: # sqlite backend
  pg-data: # postgres profile
  filler-drop: # filler profile drop-folder (override with FILLER_DROP_DIR bind mount)
  ollama: # ai profile
